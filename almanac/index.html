  let h = sheetHead("Settings") + '<div class="settings" style="display:flex;flex-direction:column;gap:22px">';
  h += '<div class="group"><h3>Your year</h3><div class="panel">' +
    '<div class="kv"><span>Seasons</span><div class="seg" style="margin:0"><button class="' + (s.hemi === "N" ? "on" : "") + '" data-act="set-hemi" data-v="N">Northern</button><button class="' + (s.hemi === "S" ? "on" : "") + '" data-act="set-hemi" data-v="S">Southern</button></div></div>' +
    '<div class="kv"><span>Mother\'s Day</span><select id="set-region" style="width:auto" aria-label="Mother\'s Day">' +

      ' <span class="muted" style="font-size:13px">' + esc(fmtDay(nextOccDate(holidayOcc(k), T))) + "</span></label>").join("") + "</div>";
  h += '<div class="panel">' + (db.occasions.length ? db.occasions.map(o => '<div class="kv"><span>' + esc(o.label) + ' <span class="muted">' + o.d + " " + MONTHS[o.m] + '</span></span><button class="link" data-act="occ-remove" data-id="' + esc(o.id) + '">Remove</button></div>').join("") : '<p>Your own yearly days: a wedding anniversary, a family reunion, the day the swallows usually come back.</p>') +
    '<input type="text" data-bind="occ.label" placeholder="Name of the day" value="' + esc(state.sheet.draft.occ.label) + '"><div class="date-row" style="grid-template-columns:1fr 1.4fr auto">' + dayMonthSelects("occ", state.sheet.draft.occ.d, state.sheet.draft.occ.m) +
    '<button class="btn" data-act="occ-add">Add</button></div></div></div>';

  if(canCalendar()){

      [["dates","Birthdays and people's days, two weeks ahead"],["holidays","The days above, three weeks ahead"],["seasons","The turn of each season"],["monthly","A monthly look at the months ahead (first Sunday, 10:00)"],["plans","Things you've planned"]].map(x =>
        '<label class="check"><input type="checkbox" data-bind="cal.' + x[0] + '"' + (c[x[0]] ? " checked" : "") + ">" + x[1] + "</label>").join("") +
      '<button class="btn primary" data-act="ics-all">' + ic("cal") + "Create the calendar file</button>" +
      '<p class="muted" style="font-size:13px">Importing the file twice adds everything twice. For a plan made later, use "Add to my calendar" on that idea.</p></div></div>';
  }

  h += '<div class="group"><h3>Your data</h3><p>' + (store.cloud
      ? "Saved to your Claude account, so it's the same wherever you open this page."
      : "Saved in this browser on this device only. Keep a backup somewhere safe from time to time.") +
    (s.lastBackup ? " Last backup " + esc(rel(daysBetween(T, parseYmd(s.lastBackup)))) + "." : "") + "</p>" +
    '<div class="panel"><div class="btns"><button class="btn" data-act="backup">Save a backup</button><button class="btn" data-act="backup-copy">Copy it</button>' +
    '<label class="btn" style="position:relative">Restore a backup<input type="file" accept=".json,application/json" data-act="restore-file" style="position:absolute;inset:0;opacity:0"></label></div>' +
    '<textarea id="restore-text" rows="2" placeholder="Or paste a backup here"></textarea><button class="btn" data-act="restore-paste">Restore from pasted text</button></div></div>';

  if(hasExamples()) h += '<button class="btn" data-act="start-own">Remove the examples</button>';
  h += '<button class="btn danger" data-act="erase">' + (state.sheet.confirm ? "Tap again: this erases everything" : "Erase everything") + "</button>";
  h += '<p class="muted" style="font-size:13px;text-align:center">Almanac ' + APP_VERSION + "</p></div>";
  return h;

  const p = {id: uid(), name, color: PERSON_COLORS[db.people.length % PERSON_COLORS.length], dates: [], notes: "", ex: false};
  db.people.push(p); save();

};
ACT["cap-kind"] = el => { const d = state.sheet.draft; d.kind = d.kind === el.dataset.v ? "" : el.dataset.v; d.set.kind = true; refreshCapture(); };
ACT["cap-when"] = el => {
  const d = state.sheet.draft, v = el.dataset.v; d.set.when = true; d.whenOpen = "";
  if(v === "someday") d.when = normalizeWhen({});
  else if(SEASON_BASE[v]) d.when = {t: "months", months: seasonMonths(v), occ: "", date: ""};
  else if(v === "months"){ d.whenOpen = "months"; if(d.when.t !== "months") d.when = {t: "months", months: [], occ: "", date: ""}; }
  else if(v === "occasion"){ if(d.when.t !== "occasion") d.when = {t: "occasion", months: [], occ: "", date: ""}; }

};
ACT["cap-month"] = el => {
  const w = state.sheet.draft.when, m = +el.dataset.m, k = w.months.indexOf(m);
  if(k >= 0) w.months.splice(k, 1); else w.months.push(m);
  w.months.sort((a, b) => a - b); state.sheet.draft.whenOpen = "months";
  refreshCapture();
};
ACT["cap-occ"] = el => { state.sheet.draft.when.occ = el.dataset.v; refreshCapture(); };
ACT["cap-yearly"] = el => { state.sheet.draft.yearly = el.checked; state.sheet.draft.set.yearly = true; refreshCapture(); };
ACT["cap-save"] = () => saveCapture();

ACT.idea = el => openSheet({type: "idea", id: el.dataset.id, mode: "view"});
ACT["idea-mode"] = el => {
  const i = idea(state.sheet.id), mode = el.dataset.mode, T = today();
  if(mode === "plan") state.sheet.draft = {date: i.plan ? i.plan.date : suggestDate(i, T)};
  if(mode === "lived"){
    const pd = i.plan && parseYmd(i.plan.date);
    state.sheet.draft = {date: pd && pd <= T ? i.plan.date : ymd(T), note: "", tradition: false};
  }
  state.sheet.mode = mode; renderSheet();
};
ACT["idea-edit"] = el => { const i = idea(el.dataset.id); if(i) openSheet({type: "capture", draft: draftFromIdea(i), seed: 1}); };
ACT["plan-save"] = () => {
  const i = idea(state.sheet.id), d = state.sheet.draft.date;
  if(!parseYmd(d)){ toast("Pick a date first."); return; }
  i.plan = {date: d}; i.snooze = ""; i.updated = new Date().toISOString(); save();
  state.sheet.mode = "view"; render();
  toast("Planned for " + fmtDay(parseYmd(d)) + ".");
};
ACT.unplan = el => { const i = idea(el.dataset.id); i.plan = null; save(); render(); toast("Unplanned. It's back with your ideas."); };
function markLived(i, dateStr, note, tradition){
  const d = parseYmd(dateStr) || today();
  const l = {id: uid(), ideaId: i.id, text: i.text, people: i.people.slice(), date: ymd(d), note: (note || "").trim(), ex: false};
  db.lived.push(l);
  if(tradition) i.yearly = true;
  if(i.yearly){
    const k = turnKeyAt(i, d);
    if(i.doneYears.indexOf(k) < 0) i.doneYears.push(k);
    i.plan = null; i.snooze = "";
  }else{ i.status = "done"; i.plan = null; }
  i.updated = new Date().toISOString();
  save();
  return l;
}
ACT["lived-save"] = () => {
  const i = idea(state.sheet.id), dr = state.sheet.draft;
  markLived(i, dr.date, dr.note, dr.tradition);
  closeSheet(); render();
  toast(i.yearly ? "Kept in your year. It will come round again next time." : "Kept in your year.");
};
ACT.happened = el => {
  const i = idea(el.dataset.id), T = today(), pd = i.plan && parseYmd(i.plan.date);
  openSheet({type: "idea", id: i.id, mode: "lived", draft: {date: pd && pd <= T ? i.plan.date : (i.when.t === "date" ? i.when.date : ymd(T)), note: "", tradition: false}});
};
ACT.didnt = el => {
  const i = idea(el.dataset.id);
  if(i.plan) i.plan = null;
  else if(i.when.t === "date") i.when = normalizeWhen({});
  i.updated = new Date().toISOString(); save(); render();
  toast("That's alright. It's back with your ideas.", {label: "Let it go", fn: () => { i.status = "gone"; save(); render(); }});
};
ACT["find-time"] = el => {
  const i = idea(el.dataset.id);
  openSheet({type: "idea", id: i.id, mode: "plan", draft: {date: suggestDate(i, today())}});
};
ACT.rest = el => {
  const i = idea(el.dataset.id), T = today(), w = nextWindow(i, T);
  let msg;
  if(i.when.t === "someday" || !w){ i.snooze = ymd(addDays(T, 60)); msg = "It will come up again in a couple of months."; }
  else{
    i.snooze = ymd(addDays(w.end, 1));
    const nw = nextWindow(i, addDays(w.end, 1));
    msg = nw ? "Not this time. It will come back " + (i.when.t === "months" ? "next " + (seasonOfSet(i.when.months) ? SEASON_LBL[seasonOfSet(i.when.months)].toLowerCase() : MONTHS[nw.start.getMonth()]) : whenBack(addDays(nw.start, -leadDays(i)), T)) + "." : "Not this time.";
  }
  save(); closeSheet(); render();
  toast(msg, {label: "Undo", fn: () => { i.snooze = ""; save(); render(); }});
};
ACT["let-go"] = el => {
  const i = idea(el.dataset.id); i.status = "gone"; save(); closeSheet(); render();
  toast("Let go. You'll find it under Ideas, Let go.", {label: "Undo", fn: () => { i.status = "open"; save(); render(); }});
};
ACT.revive = el => {
  const i = idea(el.dataset.id); i.status = "open"; i.snooze = "";
  if(i.when.t === "date" && parseYmd(i.when.date) < today()) i.when = normalizeWhen({});
  save(); render(); toast("It's back with your ideas.");
};
ACT["idea-delete"] = el => {
  if(!state.sheet.confirm){ state.sheet.confirm = true; renderSheet(); return; }
  db.ideas = db.ideas.filter(i => i.id !== el.dataset.id); save(); closeSheet(); render(); toast("Deleted.");
};

ACT.lived = el => openSheet({type: "lived", id: el.dataset.id, mode: "view"});
ACT.remember = () => openSheet({type: "lived", id: "", mode: "edit", draft: {text: "", people: [], date: ymd(today()), note: ""}});
ACT["lived-edit"] = () => {
  const l = db.lived.find(x => x.id === state.sheet.id);
  state.sheet.mode = "edit"; state.sheet.draft = {text: l.text, people: l.people.slice(), date: l.date, note: l.note}; renderSheet();
};
ACT["lived-person"] = el => {
  const p = state.sheet.draft.people, k = p.indexOf(el.dataset.id);
  if(k >= 0) p.splice(k, 1); else p.push(el.dataset.id);
  renderSheet();
};
ACT["memory-save"] = () => {
  const dr = state.sheet.draft;
  if(!dr.text.trim()){ toast("Write a few words about it first."); return; }
  if(!parseYmd(dr.date)){ toast("Pick a date first."); return; }
  const existing = state.sheet.id && db.lived.find(x => x.id === state.sheet.id);
  if(existing) Object.assign(existing, {text: dr.text.trim(), people: dr.people.slice(), date: dr.date, note: dr.note.trim(), ex: false});
  else db.lived.push({id: uid(), ideaId: "", text: dr.text.trim(), people: dr.people.slice(), date: dr.date, note: dr.note.trim(), ex: false});
  save(); closeSheet(); render(); toast("Kept in your year.");
};
ACT["lived-delete"] = () => {
  if(!state.sheet.confirm){ state.sheet.confirm = true; renderSheet(); return; }
  const l = db.lived.find(x => x.id === state.sheet.id);
  db.lived = db.lived.filter(x => x.id !== state.sheet.id);
  const i = l && l.ideaId && idea(l.ideaId);
  if(i){
    const rest = db.lived.filter(x => x.ideaId === i.id);
    if(i.yearly) i.doneYears = Array.from(new Set(rest.map(x => turnKeyAt(i, parseYmd(x.date)))));
    else if(!rest.length && i.status === "done") i.status = "open";
  }
  save(); closeSheet(); render(); toast("Deleted.");
};

ACT["person-new"] = () => openSheet({type: "person", draft: {id: "", name: "", color: PERSON_COLORS[db.people.length % PERSON_COLORS.length], dates: [{id: uid(), label: "Birthday", kind: "Birthday", d: 0, m: -1, y: 0}], notes: ""}});
ACT["person-edit"] = el => {

ACT["pdate-remove"] = el => { state.sheet.draft.dates.splice(+el.dataset.k, 1); renderSheet(); };
ACT.pcolor = el => { state.sheet.draft.color = el.dataset.v; renderSheet(); };

ACT["room-pick"] = el => {

ACT["set-hemi"] = el => { db.settings.hemi = el.dataset.v; save(); render(); };

/* ----- files: backup, restore, calendar ----- */
async function offerFile(name, text, mime){
  if(store.dl){
    try{ await store.dl.save({filename: name, data: text}); return true; }
    catch(e){ if(e && e.code !== "declined") toast("Couldn't save the file here. Use Copy instead."); return false; }
  }
  if(window.claude) { toast("Saving files isn't available here. Use Copy instead."); return false; }
  const file = new File([text], name, {type: mime});
  if(/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [file]})){
    try{ await navigator.share({files: [file], title: name}); return true; }catch(e){ if(e && e.name === "AbortError") return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
ACT.backup = async () => {
  const ok = await offerFile("almanac-backup-" + ymd(today()) + ".json", JSON.stringify(db, null, 2), "application/json");
  if(ok){ db.settings.lastBackup = ymd(today()); save(); render(); toast("Backup saved."); }
};
ACT["backup-copy"] = () => {
  const text = JSON.stringify(db);
  const done = () => { db.settings.lastBackup = ymd(today()); save(); renderSheet(); toast("Copied. Paste it into a note or an email to yourself."); };
  try{
    navigator.clipboard.writeText(text).then(done, () => { const t = $("#restore-text"); if(t){ t.value = text; t.select(); } toast("Select the text in the box and copy it."); });
  }catch(e){ const t = $("#restore-text"); if(t){ t.value = text; t.select(); } }
};
function restoreFrom(text){
  try{
    const p = JSON.parse(text);
    if(!p || (!Array.isArray(p.ideas) && !Array.isArray(p.people))) throw new Error("not an Almanac backup");
    const before = db;
    db = normalizeDb(p); save(); closeSheet(); render();
    toast("Restored " + db.ideas.length + " ideas and " + db.people.length + " people.", {label: "Undo", fn: () => { db = before; save(); render(); }});
  }catch(e){ toast("That doesn't look like an Almanac backup."); }
}
ACT["restore-paste"] = () => { const t = $("#restore-text"); if(t && t.value.trim()) restoreFrom(t.value.trim()); };

function icsText(s){ return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function icsFold(line){ const out = []; while(line.length > 74){ out.push(line.slice(0, 74)); line = " " + line.slice(74); } out.push(line); return out.join("\r\n"); }
function icsDate(d){ return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function appUrl(){ try{ return location.protocol.indexOf("http") === 0 ? location.origin + location.pathname : ""; }catch(e){ return ""; } }
function icsEvent(o){
  const L = ["BEGIN:VEVENT", "UID:" + o.uid + "@almanac", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z"];
  if(o.time){ L.push("DTSTART:" + icsDate(o.date) + "T" + o.time + "00", "DURATION:PT20M"); }
  else L.push("DTSTART;VALUE=DATE:" + icsDate(o.date), "DTEND;VALUE=DATE:" + icsDate(addDays(o.date, 1)), "TRANSP:TRANSPARENT");
  if(o.rrule) L.push("RRULE:" + o.rrule);
  L.push("SUMMARY:" + icsText(o.title));
  const url = appUrl();
  if(o.desc || url) L.push("DESCRIPTION:" + icsText((o.desc || "") + (url ? (o.desc ? "\n\n" : "") + "Open Almanac: " + url : "")));
  if(url) L.push("URL:" + url);
  (o.alarms || []).forEach(a => L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsText(a.text || o.title), "TRIGGER:" + a.trigger, "END:VALARM"));
  L.push("END:VEVENT");
  return L.map(icsFold).join("\r\n");
}
function icsWrap(events){
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Almanac//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Almanac"].join("\r\n") + "\r\n" +
    events.join("\r\n") + "\r\nEND:VCALENDAR\r\n";
}
function planEvent(i){
  const d = parseYmd(i.plan.date);
  return icsEvent({uid: "plan-" + i.id + "-" + i.plan.date, date: d, title: i.text, desc: i.people.length ? "With " + names(i.people) : "",
    alarms: [{trigger: "-PT6H", text: "Tomorrow: " + i.text}]});
}
ACT["ics-one"] = el => { const i = idea(el.dataset.id); if(i && i.plan) offerFile("almanac-plan.ics", icsWrap([planEvent(i)]), "text/calendar"); };
ACT["ics-all"] = () => {
  const c = state.sheet.draft.cal, T = today(), ev = [];
  if(c.dates) db.people.forEach(p => p.dates.forEach(dt => {
    const o = personOcc(p, dt), d = nextOccDate(o, T);
    ev.push(icsEvent({uid: "date-" + p.id + "-" + dt.id, date: d, rrule: "FREQ=YEARLY", title: o.label,
      alarms: [{trigger: "-P13DT15H", text: o.label + " is in two weeks. Anything you'd like to do?"}, {trigger: "PT9H", text: o.label + " today"}]}));
  }));
  if(c.holidays){
    HOLIDAY_IDS.filter(h => db.settings.holidays[h]).forEach(h => {
      const o = holidayOcc(h);
      for(let y = T.getFullYear(); y < T.getFullYear() + 3; y++){
        const d = o.date(y); if(d < T) continue;
        ev.push(icsEvent({uid: "h-" + h + "-" + y, date: d, title: o.label, alarms: [{trigger: "-P20DT15H", text: o.label + " is three weeks away."}]}));
      }
    });
    db.occasions.forEach(x => { const o = customOcc(x); ev.push(icsEvent({uid: "c-" + x.id, date: nextOccDate(o, T), rrule: "FREQ=YEARLY", title: o.label, alarms: [{trigger: "-P13DT15H", text: o.label + " is in two weeks."}]})); });
  }
  if(c.seasons) SEASONS.forEach(sn => {
    const m = seasonMonths(sn)[0]; let d = new Date(T.getFullYear(), m, 1); if(d < T) d = new Date(T.getFullYear() + 1, m, 1);
    ev.push(icsEvent({uid: "season-" + sn, date: d, rrule: "FREQ=YEARLY", title: SEASON_LBL[sn] + " begins", desc: "See what you'd hoped to do this " + sn + ".",
      alarms: [{trigger: "PT9H", text: SEASON_LBL[sn] + " begins. Have a look at your Almanac."}]}));
  });
  if(c.monthly){
    let d = nthSunday(T.getFullYear(), T.getMonth() + 1, 1);
    ev.push(icsEvent({uid: "monthly", date: d, time: "1000", rrule: "FREQ=MONTHLY;BYDAY=1SU", title: "Look at the months ahead",
      desc: "Ten minutes with your Almanac: what's coming, what's in season, what you'd love to make room for.", alarms: [{trigger: "PT0M"}]}));
  }
  if(c.plans) db.ideas.filter(i => i.status === "open" && i.plan && parseYmd(i.plan.date) >= T).forEach(i => ev.push(planEvent(i)));
  if(!ev.length){ toast("Choose at least one kind of reminder."); return; }
  offerFile("almanac-reminders.ics", icsWrap(ev), "text/calendar");
};

/* =========================================================
   16. EVENTS
   ========================================================= */
let toastTimer = 0;
function toast(msg, action){
  const el = $("#toast");
  el.innerHTML = "<span>" + esc(msg) + "</span>" + (action ? '<button data-act="toast-action">' + esc(action.label) + "</button>" : "");
  store.toastAction = action ? action.fn : null;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("on"); store.toastAction = null; }, action ? 6500 : 4200);
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.tagName === "INPUT") return;
  const fn = ACT[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.bind && (el.tagName === "SELECT" || el.type === "checkbox")) bindField(el);
  if(el.dataset.act === "cap-yearly" || el.dataset.act === "set-holiday") ACT[el.dataset.act](el);
  if(el.dataset.act === "restore-file" && el.files && el.files[0]){
    const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(el.files[0]);
  }
  if(el.id === "set-region"){ db.settings.region = el.value; save(); render(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if(el.id === "q"){ state.q = el.value; const box = $("#ideas-list"); if(box) box.innerHTML = ideasList(today()); return; }
  bindField(el);
});
let lastBound = "";
function bindField(el){
  const path = el.dataset.bind;
  if(!path || !state.sheet || !state.sheet.draft) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if(el.dataset.num !== undefined) v = v === "" ? 0 : Number(v);
  setPath(state.sheet.draft, path, v);
  if(/^dates\.\d+\.kind$/.test(path)){
    const dt = state.sheet.draft.dates[+path.split(".")[1]];
    if(v !== "Other") dt.label = v; else if(DATE_LABELS.indexOf(dt.label) >= 0) dt.label = "";
  }
  const sig = path + "=" + v;
  if(sig === lastBound && el.tagName !== "TEXTAREA" && el.type !== "text") return;   // input and change both fired
  lastBound = sig;
  if(state.sheet.type === "capture"){
    if(path === "text") onCaptureText();
    else if(el.dataset.rerender !== undefined) refreshCapture();
    else updatePromise();
  }else if(el.dataset.rerender !== undefined) renderSheet();
}
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && state.sheet) closeSheet();
  if(e.key === "Enter" && e.target.id === "cap-newname"){ e.preventDefault(); ACT["cap-addperson"](); }
  if(e.key === "Enter" && e.target.id === "cap-text" && !e.shiftKey){ e.preventDefault(); if(state.sheet.draft.text.trim()) saveCapture(); }
});
window.addEventListener("scroll", () => { $("#bar").classList.toggle("scrolled", window.scrollY > 4); }, {passive: true});
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && !state.sheet) render(); });

if(["now","year","people","ideas"].indexOf(initialTab) >= 0) state.tab = initialTab;

render();
connectCloud();
if(!window.claude && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
