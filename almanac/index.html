<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes" data-standalone>
<meta name="mobile-web-app-capable" content="yes" data-standalone>
<meta name="apple-mobile-web-app-status-bar-style" content="default" data-standalone>
<meta name="apple-mobile-web-app-title" content="Almanac" data-standalone>
<meta name="theme-color" content="#F4F5EF" media="(prefers-color-scheme: light)" data-standalone>
<meta name="theme-color" content="#121613" media="(prefers-color-scheme: dark)" data-standalone>
<link rel="manifest" href="manifest.webmanifest" data-standalone>
<link rel="apple-touch-icon" href="icon-180.png" data-standalone>
<link rel="icon" type="image/png" href="icon-192.png" data-standalone>
<title>Almanac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one calm column like a page of an almanac; dates sit in a numeral margin,
   the year is drawn as a wheel, and the accent follows the season you are in. */
:root{
  --paper:#F4F5EF;
  --sheet:#FFFFFF;
  --ink:#1C2420;
  --ink-2:#56605A;
  --ink-3:#848C85;
  --rule:#DCE0D6;
  --wash:#E8EBE2;
  --winter:#44678A;
  --spring:#3D8350;
  --summer:#A57410;
  --autumn:#AE4E26;
  --accent:var(--autumn);
  --on-accent:#FFFFFF;
  --danger:#A63D32;
  --scrim:rgba(18,24,20,.38);
  --shadow:0 1px 2px rgba(20,30,24,.06), 0 12px 32px rgba(20,30,24,.10);

  --f-display:"IM Fell English", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-sc:"IM Fell English SC", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --fs-xs:12.5px; --fs-s:14px; --fs-m:16px; --fs-l:19px; --fs-xl:26px; --fs-xxl:52px;
  --r-s:10px; --r-m:14px; --r-l:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121613; --sheet:#1A201C; --ink:#E8E9E2; --ink-2:#AAB1A8; --ink-3:#7A827B;
    --rule:#2A322D; --wash:#222924;
    --winter:#8EB0D3; --spring:#86BF8E; --summer:#E0B457; --autumn:#E58C61;
    --on-accent:#121613; --danger:#E5806F; --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121613; --sheet:#1A201C; --ink:#E8E9E2; --ink-2:#AAB1A8; --ink-3:#7A827B;
  --rule:#2A322D; --wash:#222924;
  --winter:#8EB0D3; --spring:#86BF8E; --summer:#E0B457; --autumn:#E58C61;
  --on-accent:#121613; --danger:#E5806F; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root[data-season="winter"]{--accent:var(--winter)}
:root[data-season="spring"]{--accent:var(--spring)}
:root[data-season="summer"]{--accent:var(--summer)}
:root[data-season="autumn"]{--accent:var(--autumn)}
.t-winter{--tone:var(--winter)} .t-spring{--tone:var(--spring)}
.t-summer{--tone:var(--summer)} .t-autumn{--tone:var(--autumn)}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%; padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:var(--fs-m)/1.5 var(--f-ui);
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
}
body.locked{overflow:hidden}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--paper)}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:20px; height:20px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.wrap{
  max-width:680px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}

/* ---------- Top bar & tab bar ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); background:color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%); border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--rule)}
.bar-in{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:10px; max-width:680px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.wordmark{background:none; border:0; padding:0; font-family:var(--f-display); font-size:23px; letter-spacing:.01em; color:var(--ink)}
.wordmark i{font-style:italic; color:var(--accent)}
.icon-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--rule); background:var(--sheet); color:var(--ink-2);
  display:inline-flex; align-items:center; justify-content:center}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--sheet); background:color-mix(in srgb, var(--sheet) 92%, transparent);
  -webkit-backdrop-filter:blur(16px) saturate(160%); backdrop-filter:blur(16px) saturate(160%);
  border-top:1px solid var(--rule);
  padding:6px max(10px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px));
}
.tabbar-in{display:grid; grid-template-columns:repeat(5,1fr); align-items:center; max-width:520px; margin:0 auto}
.tab{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 4px; color:var(--ink-3); font-size:11.5px; font-weight:560; letter-spacing:.01em}
.tab .ic{width:23px; height:23px}
.tab.on{color:var(--ink)}
.tab.on .ic{color:var(--accent); stroke-width:1.9}
.tab-add{justify-self:center; width:54px; height:54px; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent);
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); margin-top:-6px}
.tab-add .ic{width:26px; height:26px; stroke-width:2}
.tab-add:active{transform:scale(.96)}

/* ---------- Type & sections ---------- */
.eyebrow{font-family:var(--f-sc); font-size:15px; letter-spacing:.06em; color:var(--ink-3); text-transform:lowercase}
.sec{display:flex; flex-direction:column; gap:2px; margin-top:34px; padding-bottom:6px}
.sec h2{font-family:var(--f-display); font-weight:400; font-size:var(--fs-xl); line-height:1.15; text-wrap:balance; color:var(--ink)}
.sec-row{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.lede{color:var(--ink-2); font-size:var(--fs-s); max-width:60ch}
.page-title{font-family:var(--f-display); font-weight:400; font-size:38px; line-height:1.05; margin-top:18px; text-wrap:balance}
.muted{color:var(--ink-3)}
.link{background:none; border:0; padding:0; color:var(--accent); font-weight:560; font-size:var(--fs-s)}

/* ---------- Masthead (Now) ---------- */
.mast{display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:end; padding-top:18px; padding-bottom:4px; border-bottom:1px solid var(--rule); padding-bottom:22px}
.mast-date{grid-column:1 / -1; font-family:var(--f-sc); font-size:16px; letter-spacing:.06em; color:var(--ink-2); text-transform:lowercase}
.mast-season{font-family:var(--f-display); font-weight:400; font-size:var(--fs-xxl); line-height:.95; color:var(--tone); letter-spacing:-.01em}
.mast-line{grid-column:1 / -1; font-family:var(--f-display); font-style:italic; font-size:var(--fs-l); line-height:1.35; color:var(--ink-2); max-width:34ch; margin-top:6px}
.mast-wheel{width:76px; height:76px; border:0; background:none; padding:0; align-self:center}
.mast-wheel svg{width:100%; height:100%; display:block}

/* ---------- Rows ---------- */
.list{display:flex; flex-direction:column}
.row{display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--rule);
  padding:13px 0; color:inherit}
.row:last-child{border-bottom:0}
.row:active{background:var(--wash)}
.row-main{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1}
.row-title{font-size:16.5px; font-weight:560; line-height:1.3; text-wrap:pretty}
.row-meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:var(--fs-xs); color:var(--ink-3); line-height:1.35}
.row-meta .ic{width:14px; height:14px}
.row-note{font-family:var(--f-display); font-style:italic; color:var(--ink-2); font-size:15.5px; line-height:1.35}
.row .chev{color:var(--ink-3); margin-top:2px}
.tag{display:inline-flex; align-items:center; gap:4px; color:var(--tone, var(--ink-3))}
.row.has-sub{border-bottom:0; padding-bottom:4px}
.sub{margin-left:62px}
.list > .sub{border-bottom:1px solid var(--rule); padding-bottom:6px}
.list > .sub:last-child{border-bottom:0}
.sub .row{padding:9px 0; border-bottom:0}
.sub .row-title{font-size:15.5px; font-weight:500}
.empty-line{font-size:var(--fs-s); color:var(--ink-3); padding:2px 0 12px; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center}

/* almanac day numerals */
.day{flex:0 0 48px; display:flex; flex-direction:column; align-items:center; line-height:1; padding-top:1px; color:var(--ink-2)}
.day small{font-family:var(--f-sc); font-size:13px; letter-spacing:.05em; text-transform:lowercase; color:var(--ink-3)}
.day b{font-family:var(--f-display); font-weight:400; font-size:30px; line-height:1; color:var(--ink); margin:1px 0}
.day.past b{color:var(--ink-3)}
.day.tone b{color:var(--tone)}
.glyph{flex:0 0 48px; display:flex; justify-content:center; padding-top:3px; color:var(--tone, var(--ink-3))}
.glyph .ic{width:22px; height:22px}

/* avatars */
.avs{display:inline-flex}
.av{--c:#666; width:22px; height:22px; border-radius:50%; background:var(--c); color:#fff; font-size:10.5px; font-weight:650; letter-spacing:.02em;
  display:inline-flex; align-items:center; justify-content:center; border:2px solid var(--paper); margin-left:-6px; flex:0 0 auto}
.avs .av:first-child{margin-left:0}
.av.lg{width:56px; height:56px; font-size:20px; border:0}
.av.md{width:40px; height:40px; font-size:15px; border:0}

/* ---------- Cards that ask something ---------- */
.ask{background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r-m); padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow)}
.ask + .ask{margin-top:10px}
.ask p{font-size:15.5px}
.ask b{font-weight:600}
.btns{display:flex; flex-wrap:wrap; gap:8px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:8px 15px; border-radius:var(--r-s);
  border:1px solid var(--rule); background:var(--sheet); color:var(--ink); font-size:15px; font-weight:560; white-space:nowrap}
.btn .ic{width:18px; height:18px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.quiet{background:transparent; border-color:transparent; color:var(--ink-2); padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}

.banner{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:12px; padding:10px 14px;
  border-radius:var(--r-m); background:var(--wash); background:color-mix(in srgb, var(--accent) 11%, var(--paper)); color:var(--ink); font-size:var(--fs-s)}
.banner .btn{min-height:34px; padding:5px 12px; font-size:14px}

.welcome{padding-top:26px; display:flex; flex-direction:column; gap:16px}
.welcome h1{font-family:var(--f-display); font-weight:400; font-size:36px; line-height:1.1; text-wrap:balance}
.welcome p{color:var(--ink-2); max-width:52ch}

.foot{margin-top:36px; padding-top:16px; border-top:1px solid var(--rule); color:var(--ink-3); font-size:var(--fs-s); display:flex; flex-direction:column; gap:6px}

/* ---------- Year ---------- */
.seg{display:inline-grid; grid-auto-flow:column; gap:2px; padding:3px; border-radius:12px; background:var(--wash); margin-top:16px}
.seg button{border:0; background:none; padding:7px 14px; border-radius:9px; font-size:14px; font-weight:560; color:var(--ink-2)}
.seg button.on{background:var(--sheet); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}
.wheel{display:block; width:100%; max-width:380px; margin:14px auto 0}
.wheel svg{width:100%; height:auto; display:block; overflow:visible}
.wheel .wm{cursor:pointer}
.legend{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px; font-size:var(--fs-xs); color:var(--ink-3); margin-top:6px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend svg{width:16px; height:10px}
.month{padding-top:30px; scroll-margin-top:70px}
.month-head{display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--rule); padding-bottom:8px}
.month-head h3{font-family:var(--f-display); font-weight:400; font-size:30px; line-height:1; color:var(--tone)}
.month-head .yr{font-family:var(--f-sc); color:var(--ink-3); font-size:15px; letter-spacing:.05em}
.month-head .add{margin-left:auto}
.month-line{font-family:var(--f-display); font-style:italic; color:var(--ink-2); font-size:16px; padding:8px 0 4px}
.month .row{border-bottom:0; padding:9px 0}
.month .lived .row-title{font-weight:500}
.room{display:flex; align-items:center; gap:10px; color:var(--ink-3); font-size:var(--fs-s); padding:10px 0 0}

/* ---------- People ---------- */
.person-row .row-title{font-size:17px}
.person-head{display:flex; align-items:center; gap:16px; margin-top:16px}
.person-head h1{font-family:var(--f-display); font-weight:400; font-size:36px; line-height:1.05}
.back{display:inline-flex; align-items:center; gap:4px; background:none; border:0; padding:6px 0; margin-top:10px; color:var(--ink-2); font-size:15px}
.notes{font-family:var(--f-display); font-size:18px; line-height:1.45; color:var(--ink-2); white-space:pre-wrap}
.facts{display:flex; flex-direction:column; gap:4px; margin-top:12px; font-size:15px; color:var(--ink-2)}

/* ---------- Ideas ---------- */
.search{position:relative; margin-top:14px}
.search .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.search input[type=search]{padding-left:40px}
.filters{display:flex; gap:7px; overflow-x:auto; padding:12px 0 2px; scrollbar-width:none; margin-inline:-2px}
.filters::-webkit-scrollbar{display:none}

/* ---------- Form controls ---------- */
input[type=text], input[type=search], input[type=date], input[type=number], input:not([type]), select, textarea{
  width:100%; background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r-s); padding:11px 13px; font-size:16px; outline:none; color:var(--ink);
}
input:focus, select:focus, textarea:focus{border-color:var(--accent)}
input:focus-visible, select:focus-visible, textarea:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
textarea{resize:vertical; min-height:84px; line-height:1.45}
select{-webkit-appearance:none; appearance:none; padding-right:30px;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size:5px 5px, 5px 5px; background-repeat:no-repeat}
label.field{display:flex; flex-direction:column; gap:6px; font-size:var(--fs-s); color:var(--ink-2); font-weight:520}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:var(--sheet); color:var(--ink-2);
  padding:7px 13px; border-radius:999px; font-size:14.5px; font-weight:520; white-space:nowrap}
.chip .av{width:18px; height:18px; font-size:9px; border:0; margin:0 0 0 -5px}
.chip.on{border-color:var(--tone, var(--accent)); color:var(--ink); background:var(--wash); background:color-mix(in srgb, var(--tone, var(--accent)) 13%, var(--sheet)); font-weight:600}
.chip.add{border-style:dashed; color:var(--ink-3)}
.chip .ic{width:16px; height:16px}
.chip small{color:var(--ink-3); font-weight:500}
.months12{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.months12 .chip{justify-content:center; padding:7px 0}
.switch-row{display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--rule); border-radius:var(--r-m); background:var(--sheet)}
.switch-row div{flex:1; min-width:0}
.switch-row b{display:block; font-weight:600; font-size:15.5px}
.switch-row small{display:block; color:var(--ink-3); font-size:13px; line-height:1.35}
.switch{position:relative; width:50px; height:30px; flex:0 0 auto}
.switch input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.switch span{position:absolute; inset:0; border-radius:999px; background:var(--wash); border:1px solid var(--rule); transition:background .2s}
.switch span::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--sheet); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
.switch input:checked + span{background:var(--accent); border-color:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--accent); outline-offset:2px}
.promise{font-family:var(--f-display); font-style:italic; font-size:16.5px; color:var(--accent); line-height:1.35}
.date-row{display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:8px}
.inline-new{display:flex; gap:8px}
.inline-new input{flex:1}

/* ---------- Sheet ---------- */
#sheet-root{position:fixed; inset:0; z-index:60; pointer-events:none}
.scrim{position:absolute; inset:0; background:var(--scrim); opacity:0; transition:opacity .25s}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:calc(100% - 28px - env(safe-area-inset-top,0px)); overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--paper); border-radius:var(--r-l) var(--r-l) 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.18);
  transform:translateY(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); overscroll-behavior:contain}
#sheet-root.open{pointer-events:auto}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:none}
.sheet-in{max-width:620px; margin:0 auto; padding:10px max(18px, env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:18px}
.grab{width:38px; height:5px; border-radius:3px; background:var(--rule); margin:0 auto}
.sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.sheet-head h2{font-family:var(--f-display); font-weight:400; font-size:28px; line-height:1.1; text-wrap:balance}
.sheet-head .icon-btn{flex:0 0 auto}
.group{display:flex; flex-direction:column; gap:9px}
.group > .eyebrow{font-size:14.5px}
.cap-text{font-size:20px !important; line-height:1.35; min-height:92px; font-weight:520; border-radius:var(--r-m) !important; padding:14px 15px !important}
.sheet-foot{display:flex; gap:10px; position:sticky; bottom:0; background:var(--paper); z-index:2;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px)); margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px)); border-top:1px solid var(--rule)}
.detail-title{font-size:23px; font-weight:600; line-height:1.25; text-wrap:pretty}
.facts-list{display:flex; flex-direction:column; border-top:1px solid var(--rule)}
.fact{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--rule); font-size:15.5px; align-items:flex-start}
.fact .ic{color:var(--ink-3); margin-top:1px}
.fact span{min-width:0}
.panel{background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r-m); padding:14px; display:flex; flex-direction:column; gap:12px}
.settings h3{font-family:var(--f-display); font-weight:400; font-size:22px}
.settings p{font-size:var(--fs-s); color:var(--ink-2)}

<script>
"use strict";

/* =========================================================
   1. CONSTANTS
   ========================================================= */
const APP_VERSION = "1.0";
const KEY = "almanac.v1";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON = MONTHS.map(m => m.slice(0, 3));
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const SEASONS = ["winter","spring","summer","autumn"];
const SEASON_LBL = {winter:"Winter", spring:"Spring", summer:"Summer", autumn:"Autumn"};
const SEASON_BASE = {winter:[11,0,1], spring:[2,3,4], summer:[5,6,7], autumn:[8,9,10]};   // northern hemisphere
const KINDS = [
  {id:"time",    label:"Time together"},
  {id:"trip",    label:"A trip or weekend"},
  {id:"gift",    label:"A gift"},
  {id:"make",    label:"Make or cook"},
  {id:"gesture", label:"A small gesture"}
];
const HOLIDAY_IDS = ["christmas","nye","easter","mothers","fathers","valentine"];
const PERSON_COLORS = ["#7B5E9E","#3B7A82","#B4632F","#567A37","#A44B6E","#4A6FA6","#86722B","#5F6B74"];
const DATE_LABELS = ["Birthday","Name day","Anniversary"];
const OCC_WINDOW = 42;          // days ahead an occasion appears on Now
const CHRISTMAS_WINDOW = 56;

/* One line per month, written for the northern hemisphere and shifted six months
   in the south. Nature and light only, so they hold wherever you live. */
const ALMANAC = [
  "The quiet month. Frost on the grass, and long evenings that suit slow plans.",
  "The light comes back a couple of minutes a day. Snowdrops first.",
  "Buds and blossom, and mornings loud with birds.",
  "Spring proper. Gardens wake up and the evenings stretch out.",
  "Long light evenings and the first meals outside.",
  "The longest days of the year. Strawberries and late sunsets.",
  "High summer. Fruit, warm nights, time away.",
  "Late summer. The light softens and the blackberries ripen.",
  "Apples and the first cool mornings. A good month for new starts.",
  "Harvest month: walnuts, chestnuts, mushrooms after rain.",
  "Short days, candles and soup. Bright skies on a good day.",
  "The year draws in. Gatherings, lights, and a moment to look back."
];

const ICONS = {
  now:     '<path d="M3 17.5h18M6.5 17.5a5.5 5.5 0 0 1 11 0M12 6v2.5M5.4 9.9l1.7 1.4M18.6 9.9l-1.7 1.4"/>',
  year:    '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v5"/>',
  people:  '<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2"/><circle cx="16.8" cy="9.4" r="2.6"/><path d="M16 14.4c2.6-.2 4.5 1.4 5 4.2"/>',
  ideas:   '<path d="M7 3.5h10v17l-5-3.6-5 3.6z"/>',
  plus:    '<path d="M12 5v14M5 12h14"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  close:   '<path d="M6 6l12 12M18 6L6 18"/>',
  back:    '<path d="M15 5l-7 7 7 7"/>',
  chev:    '<path d="M9 5l7 7-7 7"/>',
  check:   '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  cal:     '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  gift:    '<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5v8h14v-8M12 8.5v12M12 8.5c-1.6-3.4-5.5-3.9-5.5-1.5 0 1.4 2.4 1.5 5.5 1.5zM12 8.5c1.6-3.4 5.5-3.9 5.5-1.5 0 1.4-2.4 1.5-5.5 1.5z"/>',
  heart:   '<path d="M12 19.5s-7.5-4.5-7.5-10A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.3c0 5.5-7.5 10-7.5 10z"/>',
  repeat:  '<path d="M17 3.5l3 3-3 3M20 6.5H8.5A4.5 4.5 0 0 0 4 11v.5M7 20.5l-3-3 3-3M4 17.5h11.5A4.5 4.5 0 0 0 20 13v-.5"/>',
  person:  '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.7-3.8 3.4-6 7-6s6.3 2.2 7 6"/>',
  clock:   '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  note:    '<path d="M5 4.5h14v15H5zM8.5 9h7M8.5 12.5h7M8.5 16h4"/>',
  search:  '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  winter:  '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"/>',
  spring:  '<path d="M12 20.5v-8.5"/><path d="M12 12c0-4 2.5-6.5 7-6.5 0 4-2.5 6.5-7 6.5zM12 14.5c0-3.3-2-5.3-6-5.3 0 3.3 2 5.3 6 5.3z"/>',
  summer:  '<circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  autumn:  '<path d="M5 19c0-8 5-13.6 14-14 0 9-5.6 14-14 14z"/><path d="M5 19l8.5-8.5"/>',
  someday: '<path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3"/><circle cx="12" cy="12" r="3"/>'
};
function ic(name, cls){ return '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>"; }

/* =========================================================
   2. SMALL HELPERS
   ========================================================= */
const $ = (s, r) => (r || document).querySelector(s);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseYmd(s){
  const p = String(s || "").split("-").map(Number);
  return p.length === 3 && p[0] && p[1] ? new Date(p[0], p[1] - 1, p[2]) : null;
}
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function daysBetween(a, b){ return Math.round((b - a) / 86400000); }
function sameDay(a, b){ return !!a && !!b && ymd(a) === ymd(b); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function hash(s){ let h = 2166136261; for(let k = 0; k < s.length; k++){ h = Math.imul(h ^ s.charCodeAt(k), 16777619); } return h >>> 0; }

/* ?today=2026-12-01 lets you look at the app as it will be on another day */
const TODAY_OVERRIDE = (/[?&]today=(\d{4}-\d{2}-\d{2})/.exec(location.search || "") || [])[1] || "";
function today(){
  if(TODAY_OVERRIDE) return parseYmd(TODAY_OVERRIDE);
  const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function fmtDay(d){ return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; }
function fmtLong(d, T){
  const s = d.getDate() + " " + MONTHS[d.getMonth()];
  return T && d.getFullYear() !== T.getFullYear() ? s + " " + d.getFullYear() : s;
}
function ago(n){
  if(n < 7) return n + " days ago";
  if(n < 11) return "a week ago";
  if(n < 46) return Math.round(n / 7) + " weeks ago";
  if(n < 335){ const mo = Math.round(n / 30.4); return mo <= 1 ? "a month ago" : mo + " months ago"; }
  const y = Math.round(n / 365); return y <= 1 ? "a year ago" : y + " years ago";
}
function rel(n){
  if(n === 0) return "today";
  if(n === 1) return "tomorrow";
  if(n === -1) return "yesterday";
  if(n < 0) return ago(-n);
  if(n < 7) return "in " + n + " days";
  if(n < 11) return "in a week";
  if(n < 46) return "in " + Math.round(n / 7) + " weeks";
  const mo = Math.round(n / 30.4); return mo <= 1 ? "in a month" : "in " + mo + " months";
}
function partOfMonth(d){ const x = d.getDate(); return (x <= 10 ? "early " : x <= 20 ? "mid-" : "late ") + MONTHS[d.getMonth()]; }
/* "in mid-October", or "next year, in mid-October" when that is a year away */
function whenBack(d, T){ return (daysBetween(T, d) > 300 ? "next year, in " : "in ") + partOfMonth(d); }
function initials(name){
  const w = String(name || "?").split(/[\s&,+]+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "?").slice(0, 1)).toUpperCase();
}
function possessive(n){ return /s$/i.test(n) ? n + "'" : n + "'s"; }
function listNames(names){
  if(names.length <= 1) return names.join("");
  return names.slice(0, -1).join(", ") + " & " + names[names.length - 1];
}

/* =========================================================
   3. DATA, STORAGE, SYNC
   ========================================================= */
function emptyDb(){
  return {
    v: 1,
    people: [],      // {id, name, color, dates:[{id,label,m,d,y}], notes}
    ideas: [],       // {id, text, people, kind, when:{t,months,occ,date}, yearly, note, status, plan, snooze, doneYears}
    lived: [],       // {id, ideaId, text, people, date, note}
    occasions: [],   // custom yearly dates: {id, label, m, d}
    settings: {
      hemi: "N", region: "uk",
      holidays: {christmas:true, nye:false, easter:true, mothers:true, fathers:true, valentine:false},
      started: "", lastBackup: ""
    }
  };
}
let db = emptyDb();

function normalizeDb(p){
  const d = emptyDb();
  p = p || {};
  const s = p.settings || {};
  d.settings.hemi = s.hemi === "S" ? "S" : "N";
  d.settings.region = ["uk","fr","us"].indexOf(s.region) >= 0 ? s.region : "uk";
  Object.assign(d.settings.holidays, s.holidays || {});
  d.settings.started = s.started || "";
  d.settings.lastBackup = s.lastBackup || "";
  d.people = (Array.isArray(p.people) ? p.people : []).filter(x => x && x.id && x.name).map((x, k) => ({
    id: String(x.id), name: String(x.name), color: x.color || PERSON_COLORS[k % PERSON_COLORS.length],
    dates: (Array.isArray(x.dates) ? x.dates : []).filter(t => t && t.m >= 0 && t.m < 12 && t.d >= 1 && t.d <= 31)
      .map(t => ({id: String(t.id || uid()), label: String(t.label || "Birthday"), m: +t.m, d: +t.d, y: +t.y || 0})),
    notes: String(x.notes || ""), ex: !!x.ex
  }));
  d.ideas = (Array.isArray(p.ideas) ? p.ideas : []).filter(x => x && x.id && x.text).map(x => ({
    id: String(x.id), text: String(x.text), people: Array.isArray(x.people) ? x.people.map(String) : [],
    kind: x.kind || "", when: normalizeWhen(x.when), yearly: !!x.yearly, note: String(x.note || ""),
    status: ["open","done","gone"].indexOf(x.status) >= 0 ? x.status : "open",
    plan: x.plan && x.plan.date ? {date: x.plan.date} : null, snooze: x.snooze || "",
    doneYears: Array.isArray(x.doneYears) ? x.doneYears.map(Number) : [],
    created: x.created || "", updated: x.updated || "", ex: !!x.ex
  }));
  d.lived = (Array.isArray(p.lived) ? p.lived : []).filter(x => x && x.id && x.date).map(x => ({
    id: String(x.id), ideaId: x.ideaId || "", text: String(x.text || ""), people: Array.isArray(x.people) ? x.people.map(String) : [],
    date: x.date, note: String(x.note || ""), ex: !!x.ex
  }));
  d.occasions = (Array.isArray(p.occasions) ? p.occasions : []).filter(x => x && x.id && x.label)
    .map(x => ({id: String(x.id), label: String(x.label), m: +x.m || 0, d: +x.d || 1}));
  return d;
}
function normalizeWhen(w){
  w = w || {};
  const out = {t: "someday", months: [], occ: "", date: ""};
  if(w.t === "months"){
    const ms = Array.from(new Set((w.months || []).map(Number).filter(m => m >= 0 && m < 12))).sort((a, b) => a - b);
    if(ms.length && ms.length < 12){ out.t = "months"; out.months = ms; }
  }else if(w.t === "occasion" && w.occ){ out.t = "occasion"; out.occ = String(w.occ); }
  else if(w.t === "date" && parseYmd(w.date)){ out.t = "date"; out.date = w.date; }
  return out;
}

const store = {cloud: null, writing: false, again: false, rev: "", timer: 0, held: null, dl: null, failures: 0};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ if(!store.cloud) toast("Couldn't save on this device. The storage may be full."); }
  if(store.cloud){ clearTimeout(store.timer); store.timer = setTimeout(pushCloud, 400); }
}
async function pushCloud(){
  if(!store.cloud) return;
  if(store.writing){ store.again = true; return; }
  store.writing = true;
  try{
    store.rev = uid();
    await store.cloud.set({json: JSON.stringify(db), rev: store.rev, savedAt: new Date().toISOString()});
    store.failures = 0;
  }catch(e){
    console.warn("Saving to your account failed", e);
    store.failures++;
    if(store.failures === 1) toast("Couldn't reach your account. Your change is kept here and will be sent again.");
    if(store.failures < 5) setTimeout(pushCloud, 4000 * store.failures);
  }
  store.writing = false;
  if(store.again){ store.again = false; pushCloud(); }
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw) return false;
  try{ db = normalizeDb(JSON.parse(raw)); return true; }
  catch(e){ console.warn("Couldn't read saved data", e); return false; }
}
function hasOwnData(){
  return !!db.settings.started || db.people.some(p => !p.ex) || db.ideas.some(i => !i.ex) || db.lived.some(l => !l.ex);
}
function hasExamples(){ return db.people.some(p => p.ex) || db.ideas.some(i => i.ex) || db.lived.some(l => l.ex); }

/* Inside claude.ai the page keeps its data in the artifact's own store, so phone and
   computer see the same almanac. Anywhere else it stays in this browser. */
async function connectCloud(){
  const c = window.claude;
  if(!c || typeof c.use !== "function") return;
  const quiet = p => Promise.resolve(p).catch(() => null);
  const got = await Promise.all([quiet(c.use("downloads")), quiet(c.use("db"))]);
  store.dl = got[0];
  const dbc = got[1];
  if(!dbc){ render(); return; }
  try{
    const ref = dbc.doc("almanac/state");
    const snap = await ref.get();
    store.cloud = ref;
    if(snap.exists) applyRemote(snap.data());
    else if(hasOwnData()) pushCloud();
    render();
    ref.onSnapshot(s => {
      if(!s.exists || s.metadata.hasPendingWrites) return;
      const b = s.data();
      if(!b || b.rev === store.rev) return;
      if(state.sheet){ store.held = b; return; }
      applyRemote(b); render();
    }, e => console.warn("Live updates stopped", e));
  }catch(e){ console.warn("Account storage unavailable", e); render(); }
}
function applyRemote(b){
  try{
    db = normalizeDb(JSON.parse(b.json));
    store.rev = b.rev || "";
    try{ localStorage.setItem(KEY, b.json); }catch(e){}
  }catch(e){ console.warn("Couldn't read the saved almanac", e); }
}

/* lookups */
function person(id){ return db.people.find(p => p.id === id) || null; }
function idea(id){ return db.ideas.find(i => i.id === id) || null; }
function peopleOf(ids){ return (ids || []).map(person).filter(Boolean); }

/* =========================================================
   4. THE YEAR: SEASONS, OCCASIONS, WINDOWS
   ========================================================= */
function seasonMonths(s){ const b = SEASON_BASE[s]; return db.settings.hemi === "S" ? b.map(m => (m + 6) % 12) : b.slice(); }
function seasonOf(m){ return SEASONS.find(s => seasonMonths(s).indexOf(m) >= 0); }
function almanacLine(m){ return ALMANAC[db.settings.hemi === "S" ? (m + 6) % 12 : m]; }
function sameSet(a, b){ return a.length === b.length && a.every(x => b.indexOf(x) >= 0); }
function seasonOfSet(months){ return SEASONS.find(s => sameSet(months, seasonMonths(s))) || ""; }

function easter(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function nthSunday(y, m, n){ const first = new Date(y, m, 1); return new Date(y, m, 1 + (7 - first.getDay()) % 7 + (n - 1) * 7); }
function lastSunday(y, m){ const last = new Date(y, m + 1, 0); return new Date(y, m, last.getDate() - last.getDay()); }
function mothersDay(y){
  const r = db.settings.region;
  if(r === "uk") return addDays(easter(y), -21);                       // Mothering Sunday
  if(r === "fr"){ const d = lastSunday(y, 4); return sameDay(d, addDays(easter(y), 49)) ? addDays(d, 7) : d; }
  return nthSunday(y, 4, 2);
}
const HOLIDAYS = {
  christmas: {label:"Christmas",       date: y => new Date(y, 11, 25)},
  nye:       {label:"New Year's Eve",  date: y => new Date(y, 11, 31)},
  easter:    {label:"Easter",          date: easter},
  mothers:   {label:"Mother's Day",    date: mothersDay},
  fathers:   {label:"Father's Day",    date: y => nthSunday(y, 5, 3)},
  valentine: {label:"Valentine's Day", date: y => new Date(y, 1, 14)}
};

function personOcc(p, dt){
  const label = dt.label === "Birthday" ? possessive(p.name) + " birthday"
    : dt.label === "Name day" ? possessive(p.name) + " name day"
    : dt.label === "Anniversary" ? possessive(p.name) + " anniversary" : dt.label;
  return {key: "p:" + p.id + ":" + dt.id, label, people: [p.id], type: dt.label === "Birthday" || /birthday/i.test(dt.label) ? "birthday" : "date",
    born: dt.y || 0, date: y => new Date(y, dt.m, dt.d)};
}
function holidayOcc(h){ return {key: "h:" + h, label: HOLIDAYS[h].label, people: [], type: "holiday", born: 0, date: HOLIDAYS[h].date}; }
function customOcc(o){ return {key: "c:" + o.id, label: o.label, people: [], type: "custom", born: 0, date: y => new Date(y, o.m, o.d)}; }
function allOccasions(){
  const list = [];
  db.people.forEach(p => p.dates.forEach(dt => list.push(personOcc(p, dt))));
  HOLIDAY_IDS.forEach(h => { if(db.settings.holidays[h]) list.push(holidayOcc(h)); });
  db.occasions.forEach(o => list.push(customOcc(o)));
  return list;
}
function occByKey(key){
  const p = String(key || "").split(":");
  if(p[0] === "h" && HOLIDAYS[p[1]]) return holidayOcc(p[1]);
  if(p[0] === "p"){ const who = person(p[1]); const dt = who && who.dates.find(x => x.id === p[2]); return dt ? personOcc(who, dt) : null; }
  if(p[0] === "c"){ const o = db.occasions.find(x => x.id === p[1]); return o ? customOcc(o) : null; }
  return null;
}
function nextOccDate(o, from){ let d = o.date(from.getFullYear()); if(d < from) d = o.date(from.getFullYear() + 1); return d; }
function occurrencesBetween(a, b){
  const out = [];
  allOccasions().forEach(o => { for(let y = a.getFullYear(); y <= b.getFullYear(); y++){ const d = o.date(y); if(d >= a && d <= b) out.push({o, date: d}); } });
  return out.sort((x, y) => x.date - y.date);
}
function occAgeNote(o, d){ return o.born && o.type === "birthday" ? "turns " + (d.getFullYear() - o.born) : ""; }

/* a run of consecutive chosen months around month m (wrapping round the year) */
function runAround(months, y, m){
  let s = 0; while(s < 11 && months.indexOf((m - s - 1 + 12) % 12) >= 0) s++;
  let e = 0; while(e < 11 && months.indexOf((m + e + 1) % 12) >= 0) e++;
  return {start: new Date(y, m - s, 1), end: new Date(y, m + e + 1, 0)};
}
function monthsWindow(months, from){
  const y = from.getFullYear(), m = from.getMonth();
  if(months.indexOf(m) >= 0) return runAround(months, y, m);
  for(let k = 1; k <= 12; k++){
    const mm = (m + k) % 12;
    if(months.indexOf(mm) >= 0) return runAround(months, y + Math.floor((m + k) / 12), mm);
  }
  return null;
}
/* The window in which an idea makes sense, at or after `from`. `key` identifies
   which year's turn it is, so a tradition done this year waits for the next. */
function windowFrom(i, from){
  const w = i.when;
  if(w.t === "months"){ const r = monthsWindow(w.months, from); return r && {start: r.start, end: r.end, key: r.start.getFullYear()}; }
  if(w.t === "occasion"){ const o = occByKey(w.occ); if(!o) return null; const d = nextOccDate(o, from); return {start: d, end: d, key: d.getFullYear(), occ: o}; }
  if(w.t === "date"){
    const d = parseYmd(w.date); if(!d) return null;
    if(!i.yearly) return {start: d, end: d, key: d.getFullYear()};
    let n = new Date(from.getFullYear(), d.getMonth(), d.getDate());
    if(n < from) n = new Date(from.getFullYear() + 1, d.getMonth(), d.getDate());
    return {start: n, end: n, key: n.getFullYear()};
  }
  return null;
}
function nextWindow(i, from){
  for(let guard = 0; guard < 3; guard++){
    const w = windowFrom(i, from);
    if(!w) return null;
    if(i.yearly && i.doneYears.indexOf(w.key) >= 0){ from = addDays(w.end, 1); continue; }
    return w;
  }
  return null;
}
/* which turn of a yearly idea a lived date belongs to */
function turnKeyAt(i, d){
  const w = i.when;
  if(w.t === "occasion" || (w.t === "date" && i.yearly)){
    const o = w.t === "occasion" ? occByKey(w.occ) : null;
    const base = parseYmd(w.date);
    const at = y => o ? o.date(y) : new Date(y, base.getMonth(), base.getDate());
    if(!o && !base) return d.getFullYear();
    let best = d.getFullYear(), bestGap = Infinity;
    [d.getFullYear() - 1, d.getFullYear(), d.getFullYear() + 1].forEach(y => { const g = Math.abs(daysBetween(d, at(y))); if(g < bestGap){ bestGap = g; best = y; } });
    return best;
  }
  const win = windowFrom(i, d);
  return win ? win.key : d.getFullYear();
}
function leadDays(i){
  if(i.kind === "trip") return 56;
  if(i.kind === "gift") return i.when.occ === "h:christmas" ? 42 : 28;
  return 21;
}

/* =========================================================
   5. WHAT COMES BACK, AND WHEN
   ========================================================= */
function surface(T){
  const res = {ask: [], coming: [], season: [], soon: [], someday: []};
  const groups = {};
  const group = (o, d) => { const k = o.key + "@" + ymd(d); return groups[k] || (groups[k] = {type: "occ", o, date: d, ideas: [], extra: []}); };

  occurrencesBetween(T, addDays(T, CHRISTMAS_WINDOW)).forEach(x => {
    if(daysBetween(T, x.date) <= (x.o.key === "h:christmas" ? CHRISTMAS_WINDOW : OCC_WINDOW)) group(x.o, x.date);
  });

  const pool = [];
  db.ideas.forEach(i => {
    if(i.status !== "open") return;
    if(i.plan){
      const d = parseYmd(i.plan.date);
      if(d < T) res.ask.push({i, date: d});
      else if(daysBetween(T, d) <= 60) res.coming.push({type: "plan", i, date: d});
      return;
    }
    if(i.snooze && parseYmd(i.snooze) > T) return;
    const w = nextWindow(i, T);
    if(!w){
      if(i.when.t === "date" && !i.yearly) return;
      if(i.yearly && i.when.t === "someday" && i.doneYears.indexOf(T.getFullYear()) >= 0) return;
      pool.push(i); return;
    }
    const n = daysBetween(T, w.start);
    if(i.when.t === "months"){
      if(n <= 0) res.season.push({i, w});
      else if(n <= leadDays(i)) res.soon.push({i, w});
    }else if(i.when.t === "occasion"){
      if(n <= leadDays(i)) group(w.occ, w.start).ideas.push(i);
    }else if(i.when.t === "date"){
      if(n < 0) res.ask.push({i, date: w.start, unplanned: true});
      else if(n <= leadDays(i)) res.coming.push({type: "date", i, date: w.start});
    }
  });

  /* gift ideas kept without a date wait for that person's day, and for Christmas */
  const gifts = pool.filter(i => i.kind === "gift");
  Object.keys(groups).forEach(k => {
    const g = groups[k];
    if(g.o.people.length) g.extra = gifts.filter(i => i.people.some(pid => g.o.people.indexOf(pid) >= 0));
    else if(g.o.key === "h:christmas") g.extra = gifts.slice();
  });
  const attached = new Set();
  Object.keys(groups).forEach(k => groups[k].extra.forEach(i => attached.add(i.id)));

  const wk = T.getFullYear() + ":" + Math.floor(daysBetween(new Date(T.getFullYear(), 0, 1), T) / 7);
  res.someday = pool.filter(i => !attached.has(i.id)).sort((a, b) => hash(a.id + wk) - hash(b.id + wk)).slice(0, 2);

  res.coming = res.coming.concat(Object.keys(groups).map(k => groups[k])).sort((a, b) => a.date - b.date);
  res.season.sort((a, b) => a.w.end - b.w.end);
  res.soon.sort((a, b) => a.w.start - b.w.start);
  return res;
}

function whenText(i, short){
  const w = i.when;
  if(i.plan && i.status === "open" && w.t === "someday") return "Planned for " + fmtDay(parseYmd(i.plan.date));
  let s = "Someday";
  if(w.t === "months"){
    const sn = seasonOfSet(w.months);
    if(sn) s = SEASON_LBL[sn];
    else{
      const r = runAround(w.months, 2000, w.months[0]);
      const len = Math.round((r.end - r.start) / (30.4 * 86400000));
      if(len === w.months.length && w.months.length > 1){
        const a = r.start.getMonth(), b = r.end.getMonth();
        s = (short ? MON[a] : MONTHS[a]) + "–" + (short ? MON[b] : MONTHS[b]);
      }else s = w.months.map(m => w.months.length > 2 || short ? MON[m] : MONTHS[m]).join(", ");
    }
  }else if(w.t === "occasion"){
    const o = occByKey(w.occ);
    s = o ? (i.kind === "gift" ? "For " : "Around ") + o.label : "Someday";
  }else if(w.t === "date"){
    const d = parseYmd(w.date);
    s = d ? (i.yearly ? "Every " + d.getDate() + " " + MONTHS[d.getMonth()] : "On " + fmtDay(d)) : "Someday";
  }
  return s;
}
function toneOfIdea(i, T){
  if(i.when.t === "months") return seasonOf(i.when.months[0]);
  const w = nextWindow(i, T || today());
  return w ? seasonOf(w.start.getMonth()) : "";
}
function promiseText(i){
  const T = today();
  if(i.plan) return "It's planned for " + fmtDay(parseYmd(i.plan.date)) + ".";
  const w = nextWindow(i, T);
  if(!w) return i.when.t === "date" ? "That date has passed." : "Kept for someday. It will come up now and then.";
  const n = daysBetween(T, w.start), lead = leadDays(i);
  if(i.when.t === "months" && n <= 0) return "It's in season now, so you'll find it on Now.";
  if(n <= lead) return "It's close, so you'll find it on Now.";
  const back = addDays(w.start, -lead);
  let tail = "";
  if(i.when.t === "months"){ const sn = seasonOfSet(i.when.months); tail = sn ? ", as " + SEASON_LBL[sn].toLowerCase() + " comes round" : ", ahead of " + MONTHS[w.start.getMonth()]; }
  else if(i.when.t === "occasion") tail = ", before " + w.occ.label;
  return "It will come back " + whenBack(back, T) + tail + ".";
}

/* the year, drawn as a wheel: seasons round the rim, dates as dots,
   seasonal ideas as arcs inside, the moments you've lived as ticks outside */
function wheelSvg(T, opts){
  opts = opts || {};
  const Y = T.getFullYear(), C = 180, R1 = 150, R2 = 123;
  const jan1 = new Date(Y, 0, 1), len = daysBetween(jan1, new Date(Y + 1, 0, 1));
  const ang = d => daysBetween(jan1, d) / len * 2 * Math.PI - Math.PI / 2;
  const f = n => n.toFixed(1);
  const pt = (a, r) => [C + r * Math.cos(a), C + r * Math.sin(a)];
  const sector = (a1, a2, r1, r2) => {
    const L = a2 - a1 > Math.PI ? 1 : 0, p1 = pt(a1, r1), p2 = pt(a2, r1), p3 = pt(a2, r2), p4 = pt(a1, r2);
    return "M" + f(p1[0]) + " " + f(p1[1]) + "A" + r1 + " " + r1 + " 0 " + L + " 1 " + f(p2[0]) + " " + f(p2[1]) +
      "L" + f(p3[0]) + " " + f(p3[1]) + "A" + r2 + " " + r2 + " 0 " + L + " 0 " + f(p4[0]) + " " + f(p4[1]) + "Z";
  };
  const arc = (a1, a2, r) => {
    const L = a2 - a1 > Math.PI ? 1 : 0, p1 = pt(a1, r), p2 = pt(a2, r);
    return "M" + f(p1[0]) + " " + f(p1[1]) + "A" + r + " " + r + " 0 " + L + " 1 " + f(p2[0]) + " " + f(p2[1]);
  };
  let s = "";
  for(let m = 0; m < 12; m++){
    const a1 = ang(new Date(Y, m, 1)), a2 = ang(new Date(Y, m + 1, 1)), sn = seasonOf(m);
    s += '<path class="wm t-' + sn + '" d="' + sector(a1, a2, R1, R2) + '" style="fill:var(--tone);fill-opacity:' + (m === T.getMonth() ? (opts.mini ? .9 : .42) : (opts.mini ? .4 : .2)) +
      ';stroke:var(--paper);stroke-width:2"' + (opts.mini ? "" : ' data-act="wheel-month" data-m="' + m + '"') + "/>";
    if(!opts.mini){
      const p = pt((a1 + a2) / 2, (R1 + R2) / 2);
      s += '<text x="' + f(p[0]) + '" y="' + f(p[1]) + '" text-anchor="middle" dominant-baseline="central" class="t-' + sn +
        '" style="fill:' + (m === T.getMonth() ? "var(--ink)" : "var(--tone)") + ';font-family:var(--f-sc);font-size:13px;letter-spacing:.04em;pointer-events:none">' + MON[m].toLowerCase() + "</text>";
    }
  }
  s += '<path d="' + sector(ang(jan1) + .0001, ang(T), R1 + 1, R2 - 1) + '" style="fill:var(--paper);fill-opacity:.5;pointer-events:none"/>';
  if(!opts.mini){
    /* seasonal ideas as arcs, each in the first free lane */
    const lanes = [104, 95, 86, 77, 68], used = lanes.map(() => []);
    const arcs = [];
    db.ideas.filter(i => i.status === "open" && i.when.t === "months").forEach(i => {
      const ms = i.when.months, seen = {};
      ms.forEach(m => {
        if(seen[m]) return;
        const r = runAround(ms, Y, m);
        let k = new Date(r.start); while(k <= r.end){ seen[k.getMonth()] = 1; k = new Date(k.getFullYear(), k.getMonth() + 1, 1); }
        arcs.push({i, a1: ang(r.start), a2: ang(addDays(r.end, 1)), tone: seasonOf(r.start.getMonth())});
      });
    });
    arcs.sort((a, b) => (b.a2 - b.a1) - (a.a2 - a.a1));
    const overlaps = (x, y) => {
      const norm = a => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const segs = z => { const a = norm(z.a1), b = a + (z.a2 - z.a1); return b > 2 * Math.PI ? [[a, 2 * Math.PI], [0, b - 2 * Math.PI]] : [[a, b]]; };
      return segs(x).some(p => segs(y).some(q => p[0] < q[1] - .02 && q[0] < p[1] - .02));
    };
    arcs.forEach(a => {
      const k = used.findIndex(list => !list.some(b => overlaps(a, b)));
      if(k < 0) return;
      used[k].push(a);
      s += '<path d="' + arc(a.a1 + .025, a.a2 - .025, lanes[k]) + '" class="t-' + a.tone + '" style="fill:none;stroke:var(--tone);stroke-width:5;stroke-linecap:round;stroke-opacity:' + (a.i.yearly ? 1 : .55) + '"/>';
    });
    /* dates */
    occurrencesBetween(jan1, new Date(Y, 11, 31)).forEach(x => {
      const p = pt(ang(x.date) + Math.PI / len, 114);
      s += x.o.type === "holiday" || x.o.type === "custom"
        ? '<circle cx="' + f(p[0]) + '" cy="' + f(p[1]) + '" r="3.2" style="fill:var(--paper);stroke:var(--ink-2);stroke-width:1.4"/>'
        : '<circle cx="' + f(p[0]) + '" cy="' + f(p[1]) + '" r="3.6" style="fill:var(--ink)"/>';
    });
    /* moments lived this year */
    db.lived.forEach(l => {
      const d = parseYmd(l.date); if(!d || d.getFullYear() !== Y) return;
      const a = ang(d) + Math.PI / len, p1 = pt(a, 154), p2 = pt(a, 162);
      s += '<path d="M' + f(p1[0]) + " " + f(p1[1]) + "L" + f(p2[0]) + " " + f(p2[1]) + '" style="stroke:var(--accent);stroke-width:2.4;stroke-linecap:round"/>';
    });
    const sn = seasonOf(T.getMonth());
    s += '<text x="180" y="174" text-anchor="middle" style="fill:var(--ink);font-family:var(--f-display);font-size:40px">' + Y + "</text>";
    s += '<text x="180" y="200" text-anchor="middle" class="t-' + sn + '" style="fill:var(--tone);font-family:var(--f-display);font-style:italic;font-size:17px">' + SEASON_LBL[sn].toLowerCase() + "</text>";
  }
  const a = ang(T) + Math.PI / len, h1 = pt(a, opts.mini ? 0 : 58), h2 = pt(a, R1 + 3), dot = pt(a, R1 + 11);
  s += '<path d="M' + f(h1[0]) + " " + f(h1[1]) + "L" + f(h2[0]) + " " + f(h2[1]) + '" style="stroke:var(--ink);stroke-width:' + (opts.mini ? 6 : 1.3) + ';stroke-linecap:round"/>';
  s += '<circle cx="' + f(dot[0]) + '" cy="' + f(dot[1]) + '" r="' + (opts.mini ? 11 : 5) + '" style="fill:var(--accent)"/>';
  const vb = opts.mini ? "4 4 352 352" : "0 0 360 360";
  return '<svg viewBox="' + vb + '" role="img" aria-label="The year ' + Y + ', today in ' + MONTHS[T.getMonth()] + '">' + s + "</svg>";
}

/* =========================================================

        '<button class="btn" data-act="didnt" data-id="' + esc(i.id) + '">It didn\'t happen</button></div></div>';

      if(c.type === "occ"){

        }
      }else{
        h += ideaRow(c.i, {lead: dayCol(c.date, "tone t-" + tone), noWhen: true, extra: (c.type === "plan" ? "planned, " : "") + esc(rel(n))});
      }

  if(s.season.length){
    h += sec("In season", "This " + SEASON_LBL[sn].toLowerCase());

  if(s.soon.length){

    h += sec("Someday", "Still on your mind?");

      h += '<div class="ask"><button class="row" style="padding:0;border:0" data-act="idea" data-id="' + esc(i.id) + '"><span class="row-main"><span class="row-title">' + esc(i.text) + "</span>" + ideaMeta(i, {noWhen: true}) + "</span></button>" +
        '<div class="btns"><button class="btn" data-act="find-time" data-id="' + esc(i.id) + '">' + ic("cal") + "Find a time</button>" +

    });
  }

  const quiet = !s.ask.length && !s.coming.length && !s.season.length && !s.soon.length && !s.someday.length;
  if(quiet){
    h += sec("Right now", "Nothing pressing");

      '<div class="btns" style="margin-top:12px"><button class="btn" data-act="tab" data-tab="year">' + ic("year") + "The months ahead</button>" +
      '<button class="btn primary" data-act="capture">' + ic("plus") + "Keep an idea</button></div>";

  h += '<div class="foot"><span>You\'re holding ' + open.length + (open.length === 1 ? " idea" : " ideas") + " for " + db.people.length + (db.people.length === 1 ? " person" : " people") +

/* =========================================================
   10. YEAR
   ========================================================= */
function monthPlan(y, m, T){
  const a = new Date(y, m, 1), b = new Date(y, m + 1, 0);
  const rows = [], byKey = {}, season = [];
  occurrencesBetween(a, b).forEach(x => { const r = {date: x.date, kind: "occ", o: x.o, ideas: []}; rows.push(r); byKey[x.o.key] = r; });
  db.ideas.forEach(i => {
    if(i.status !== "open") return;
    if(i.snooze && parseYmd(i.snooze) > b) return;
    if(i.plan){ const d = parseYmd(i.plan.date); if(d >= a && d <= b) rows.push({date: d, kind: "plan", i}); return; }
    const w = windowFrom(i, a);
    if(!w) return;
    if(i.yearly && i.doneYears.indexOf(w.key) >= 0) return;
    if(i.when.t === "months"){ if(i.when.months.indexOf(m) >= 0) season.push(i); return; }
    if(w.start < a || w.start > b) return;
    if(i.when.t === "occasion"){
      let r = byKey[i.when.occ];
      if(!r){ r = byKey[i.when.occ] = {date: w.start, kind: "occ", o: w.occ, ideas: []}; rows.push(r); }
      r.ideas.push(i); return;
    }
    rows.push({date: w.start, kind: "date", i});
  });
  if(y === T.getFullYear() && m === T.getMonth()){
    db.lived.forEach(l => { const d = parseYmd(l.date); if(d && d >= a && d <= b) rows.push({date: d, kind: "lived", l}); });
  }
  rows.sort((x, z) => x.date - z.date);
  return {rows, season};
}
function renderYear(T){
  let h = '<h1 class="page-title">The year</h1>' +
    '<div class="seg" role="tablist"><button class="' + (state.yearMode === "ahead" ? "on" : "") + '" data-act="year-mode" data-mode="ahead">The months ahead</button>' +
    '<button class="' + (state.yearMode === "back" ? "on" : "") + '" data-act="year-mode" data-mode="back">Looking back</button></div>';
  h += exampleBanner();
  return h + (state.yearMode === "back" ? renderLookingBack(T) : renderAhead(T));
}
function renderAhead(T){
  let h = '<div class="wheel">' + wheelSvg(T) + "</div>" +
    '<div class="legend"><span><svg viewBox="0 0 16 10"><circle cx="8" cy="5" r="3.6" style="fill:var(--ink)"/></svg>birthdays &amp; dates</span>' +
    '<span><svg viewBox="0 0 16 10"><circle cx="8" cy="5" r="3.2" style="fill:var(--paper);stroke:var(--ink-2);stroke-width:1.4"/></svg>occasions</span>' +
    '<span><svg viewBox="0 0 16 10"><path d="M2 5h12" style="stroke:var(--accent);stroke-width:5;stroke-linecap:round"/></svg>seasonal ideas</span>' +
    '<span><svg viewBox="0 0 16 10"><path d="M8 1v8" style="stroke:var(--accent);stroke-width:2.4;stroke-linecap:round"/></svg>moments lived</span></div>';
  for(let k = 0; k < 12; k++){
    const y = T.getFullYear() + Math.floor((T.getMonth() + k) / 12), m = (T.getMonth() + k) % 12, sn = seasonOf(m);
    const plan = monthPlan(y, m, T);
    h += '<section class="month" id="mon-' + m + '"><div class="month-head t-' + sn + '"><h3>' + MONTHS[m] + "</h3>" +
      (k === 0 || m === 0 ? '<span class="yr">' + y + "</span>" : "") +
      '<button class="link add" data-act="capture" data-months="' + m + '">' + "+ Add</button></div>" +
      '<p class="month-line">' + esc(almanacLine(m)) + "</p>";
    if(plan.rows.length || plan.season.length){
      h += '<div class="list">';
      plan.rows.forEach(r => {
        const past = r.date < T;
        if(r.kind === "occ"){
          const age = occAgeNote(r.o, r.date);
          h += '<div class="row' + (r.ideas.length ? " has-sub" : "") + '" style="cursor:default">' + dayCol(r.date, past ? "past" : "") + '<span class="row-main"><span class="row-title">' + esc(r.o.label) + "</span>" +
            (age ? '<span class="row-meta"><span>' + esc(age) + "</span></span>" : "") + "</span></div>";
          if(r.ideas.length) h += '<div class="sub list">' + r.ideas.map(i => ideaRow(i, {noWhen: true})).join("") + "</div>";
        }else if(r.kind === "lived"){
          h += livedRow(r.l, T);
        }else{
          h += ideaRow(r.i, {lead: dayCol(r.date, past ? "past" : ""), noWhen: true, extra: r.kind === "plan" ? "planned" : ""});
        }
      });
      plan.season.forEach(i => { const tone = seasonOf(m); h += ideaRow(i, {lead: glyph(tone, tone)}); });
      h += "</div>";
    }else{
      h += '<p class="room">Nothing here yet. <button class="link" data-act="room" data-m="' + m + '">Room for something?</button></p>';
    }
    h += "</section>";
  }
  return h;
}
function renderLookingBack(T){
  const lived = db.lived.slice().sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
  const thisYear = lived.filter(l => l.date.slice(0, 4) === String(T.getFullYear()));
  const who = new Set(); thisYear.forEach(l => l.people.forEach(p => who.add(p)));
  let h = sec("Looking back", T.getFullYear() + " so far");
  h += '<p class="lede">' + (thisYear.length
    ? thisYear.length + (thisYear.length === 1 ? " moment" : " moments") + " lived" + (who.size ? " with " + who.size + (who.size === 1 ? " person" : " people") : "") + "."
    : "Nothing kept yet this year. When something happens, mark it here or from the idea itself.") + "</p>";
  h += '<div class="btns" style="margin-top:12px"><button class="btn" data-act="remember">' + ic("heart") + "Remember something</button></div>";
  let cur = "";
  lived.forEach(l => {
    const d = parseYmd(l.date), k = d.getFullYear() + "-" + d.getMonth();
    if(k !== cur){
      if(cur) h += "</div></section>";
      cur = k;
      const sn = seasonOf(d.getMonth());
      h += '<section class="month"><div class="month-head t-' + sn + '"><h3>' + MONTHS[d.getMonth()] + "</h3>" +
        (d.getFullYear() !== T.getFullYear() || d.getMonth() === 0 ? '<span class="yr">' + d.getFullYear() + "</span>" : "") + '</div><div class="list">';
    }
    h += livedRow(l, T);
  });
  if(cur) h += "</div></section>";
  return h;
}

/* =========================================================
   11. PEOPLE
   ========================================================= */
function nextDateOf(p, T){
  let best = null;
  p.dates.forEach(dt => { const o = personOcc(p, dt), d = nextOccDate(o, T); if(!best || d < best.date) best = {o, date: d}; });
  return best;
}
function lastLivedWith(pid){
  return db.lived.filter(l => l.people.indexOf(pid) >= 0).sort((a, b) => a.date < b.date ? 1 : -1)[0] || null;
}
function renderPeople(T){
  if(state.personId && person(state.personId)) return renderPerson(person(state.personId), T);
  let h = '<h1 class="page-title">People</h1>' + exampleBanner();
  if(!db.people.length){
    return h + '<p class="lede" style="margin-top:12px">The people you\'d love to make more time for. Add them with their birthdays, and Almanac will bring their days round before they arrive.</p>' +
      '<div class="btns" style="margin-top:14px"><button class="btn primary" data-act="people-setup">' + ic("people") + "Add people</button></div>";
  }
  const sorted = db.people.slice().sort((a, b) => {
    const x = nextDateOf(a, T), y = nextDateOf(b, T);
    if(x && y) return x.date - y.date;
    return x ? -1 : y ? 1 : a.name.localeCompare(b.name);
  });
  h += '<div class="list" style="margin-top:10px">';
  sorted.forEach(p => {
    const nx = nextDateOf(p, T), last = lastLivedWith(p.id);
    const open = db.ideas.filter(i => i.status === "open" && i.people.indexOf(p.id) >= 0).length;
    const meta = [];
    if(nx) meta.push(esc(nx.o.label.replace(possessive(p.name) + " ", "")) + " " + esc(rel(daysBetween(T, nx.date))));
    if(open) meta.push(open + (open === 1 ? " idea" : " ideas"));
    if(last) meta.push("last together " + esc(ago(Math.max(0, daysBetween(parseYmd(last.date), T)))));
    h += '<button class="row person-row" data-act="person" data-id="' + esc(p.id) + '"><span class="av md" style="--c:' + esc(p.color) + '">' + esc(initials(p.name)) + "</span>" +
      '<span class="row-main"><span class="row-title">' + esc(p.name) + '</span><span class="row-meta">' + meta.map(x => "<span>" + x + "</span>").join("<span>·</span>") + "</span></span>" + ic("chev", "chev") + "</button>";
  });
  h += "</div>" + '<div class="btns" style="margin-top:16px"><button class="btn" data-act="person-new">' + ic("plus") + "Add someone</button></div>";
  return h;
}
function renderPerson(p, T){
  let h = '<button class="back" data-act="people-back">' + ic("back") + "People</button>" +
    '<div class="person-head"><span class="av lg" style="--c:' + esc(p.color) + '">' + esc(initials(p.name)) + "</span><h1>" + esc(p.name) + "</h1></div>";
  if(p.dates.length){
    h += '<div class="facts">' + p.dates.map(dt => {
      const o = personOcc(p, dt), d = nextOccDate(o, T), age = occAgeNote(o, d);
      return "<span>" + esc(dt.label === "Birthday" ? "Birthday" : o.label) + ", " + dt.d + " " + MONTHS[dt.m] + " · " + esc(rel(daysBetween(T, d))) + (age ? " · " + esc(age) : "") + "</span>";
    }).join("") + "</div>";
  }
  h += '<div class="btns" style="margin-top:14px"><button class="btn primary" data-act="capture" data-people="' + esc(p.id) + '">' + ic("plus") + "An idea for " + esc(p.name) + "</button>" +
    '<button class="btn" data-act="person-edit" data-id="' + esc(p.id) + '">Edit</button></div>';

  const ideas = db.ideas.filter(i => i.status === "open" && i.people.indexOf(p.id) >= 0);
  const gifts = ideas.filter(i => i.kind === "gift"), rest = ideas.filter(i => i.kind !== "gift");
  if(rest.length){ h += sec("Things to do together", ""); h += '<div class="list">' + rest.map(i => ideaRow(i, {lead: glyph(i.yearly ? "repeat" : (i.when.t === "months" ? toneOfIdea(i, T) : "someday"), toneOfIdea(i, T))})).join("") + "</div>"; }
  if(gifts.length){ h += sec("Gift ideas", ""); h += '<div class="list">' + gifts.map(i => ideaRow(i, {lead: glyph("gift", ""), noKind: true})).join("") + "</div>"; }

  if(p.notes){ h += sec("What you know", ""); h += '<p class="notes">' + esc(p.notes) + "</p>"; }

  const lived = db.lived.filter(l => l.people.indexOf(p.id) >= 0).sort((a, b) => a.date < b.date ? 1 : -1);

   12. IDEAS

function renderIdeas(T){
  let h = '<h1 class="page-title">Ideas</h1>' + exampleBanner() +
    '<div class="search">' + ic("search") + '<input id="q" type="search" placeholder="Search your ideas" value="' + esc(state.q) + '" autocomplete="off"></div>' +
    '<div class="seg">' + [["open","Open"],["planned","Planned"],["lived","Lived"],["gone","Let go"]].map(x =>
      '<button class="' + (state.fStatus === x[0] ? "on" : "") + '" data-act="f-status" data-v="' + x[0] + '">' + x[1] + "</button>").join("") + "</div>";
  if(db.people.length){
    h += '<div class="filters"><button class="chip ' + (!state.fPerson ? "on" : "") + '" data-act="f-person" data-v="">Everyone</button>' +
      db.people.map(p => '<button class="chip ' + (state.fPerson === p.id ? "on" : "") + '" data-act="f-person" data-v="' + esc(p.id) + '"><span class="av" style="--c:' + esc(p.color) + '">' + esc(initials(p.name)) + "</span>" + esc(p.name) + "</button>").join("") + "</div>";
  }
  return h + '<div id="ideas-list">' + ideasList(T) + "</div>";
}
function ideasList(T){
  const q = state.q.trim().toLowerCase();
  const match = (text, ppl, note) => (!state.fPerson || ppl.indexOf(state.fPerson) >= 0) &&
    (!q || (text + " " + (note || "") + " " + names(ppl)).toLowerCase().indexOf(q) >= 0);
  if(state.fStatus === "lived"){
    const l = db.lived.filter(x => match(x.text, x.people, x.note)).sort((a, b) => a.date < b.date ? 1 : -1);
    return l.length ? '<div class="list" style="margin-top:8px">' + l.map(x => livedRow(x, T, {showDate: true})).join("") + "</div>" : emptyList();
  }
  const all = db.ideas.filter(i => match(i.text, i.people, i.note));
  if(state.fStatus === "gone"){
    const g = all.filter(i => i.status === "gone");
    return g.length ? '<div class="list" style="margin-top:8px">' + g.map(i => ideaRow(i)).join("") + "</div>" : emptyList();
  }
  if(state.fStatus === "planned"){
    const p = all.filter(i => i.status === "open" && i.plan).sort((a, b) => a.plan.date < b.plan.date ? -1 : 1);
    return p.length ? '<div class="list" style="margin-top:8px">' + p.map(i => ideaRow(i, {lead: dayCol(parseYmd(i.plan.date), parseYmd(i.plan.date) < T ? "past" : ""), noWhen: true, extra: "planned"})).join("") + "</div>" : emptyList();
  }
  const open = all.filter(i => i.status === "open" && !i.plan);
  const next = i => { const w = nextWindow(i, T); return w ? w.start : new Date(9999, 0, 1); };
  const groups = [
    ["Traditions", "Every year, in their time", open.filter(i => i.yearly)],
    ["Seasonal", "Waiting for their season", open.filter(i => !i.yearly && i.when.t === "months")],
    ["Occasions", "Around a day that matters", open.filter(i => !i.yearly && (i.when.t === "occasion" || i.when.t === "date") && nextWindow(i, T))],
    ["Someday", "No particular time", open.filter(i => !i.yearly && (i.when.t === "someday" || !nextWindow(i, T)))]
  ];
  let h = "";
  groups.forEach(g => {
    if(!g[2].length) return;
    g[2].sort((a, b) => next(a) - next(b));
    h += sec(g[0], "", '<span class="muted" style="font-size:13px">' + esc(g[1]) + "</span>");
    h += '<div class="list">' + g[2].map(i => { const tone = toneOfIdea(i, T); return ideaRow(i, {lead: glyph(i.yearly ? "repeat" : i.when.t === "months" ? tone : i.when.t === "someday" ? "someday" : "cal", tone)}); }).join("") + "</div>";
  });
  return h || emptyList();
}
function emptyList(){ return '<p class="lede" style="margin-top:22px">Nothing here' + (state.q || state.fPerson ? " for this search." : " yet.") + "</p>"; }

function closeSheet(){
  state.sheet = null; renderSheet();
  if(store.held){ const b = store.held; store.held = null; applyRemote(b); render(); }
}
function renderSheet(){
  const root = $("#sheet-root");
  if(!state.sheet){
    lastSheetKey = "";
    if(root.classList.contains("open")){
      root.classList.remove("open");
      setTimeout(() => { if(!state.sheet) root.innerHTML = ""; }, 320);
    }
    document.body.classList.remove("locked");
    return;
  }
  let panel = root.querySelector(".sheet");
  if(!panel){
    root.innerHTML = '<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-in"></div></div>';
    panel = root.querySelector(".sheet");
    void panel.offsetHeight;
    root.classList.add("open");
  }else root.classList.add("open");
  const key = state.sheet.type + ":" + (state.sheet.id || "") + ":" + (state.sheet.mode || "");
  const top = key === lastSheetKey ? panel.scrollTop : 0;
  panel.querySelector(".sheet-in").innerHTML = '<div class="grab"></div>' + (SHEETS[state.sheet.type] || (() => ""))();
  panel.scrollTop = top;
  lastSheetKey = key;
  document.body.classList.add("locked");
}
function sheetHead(title, eyebrow){
  return '<div class="sheet-head"><div>' + (eyebrow ? '<span class="eyebrow">' + esc(eyebrow) + "</span>" : "") + '<h2 id="sheet-title">' + esc(title) + "</h2></div>" +
    '<button class="icon-btn" data-act="close-sheet" aria-label="Close">' + ic("close") + "</button></div>";
}
function setPath(obj, path, v){
  const k = path.split("."); let o = obj;
  for(let n = 0; n < k.length - 1; n++) o = o[/^\d+$/.test(k[n]) ? +k[n] : k[n]];
  o[k[k.length - 1]] = v;
}
function dayMonthSelects(prefix, d, m){
  let h = '<select data-bind="' + prefix + '.d" data-num aria-label="Day"><option value="0">Day</option>';
  for(let k = 1; k <= 31; k++) h += '<option value="' + k + '"' + (k === d ? " selected" : "") + ">" + k + "</option>";
  h += '</select><select data-bind="' + prefix + '.m" data-num aria-label="Month"><option value="-1">Month</option>';
  MONTHS.forEach((name, k) => { h += '<option value="' + k + '"' + (k === m ? " selected" : "") + ">" + name + "</option>"; });
  return h + "</select>";
}

const SHEETS = {};

/* ----- keep an idea ----- */
function newDraft(pre){
  pre = pre || {};
  return {
    id: "", text: "", people: pre.people || [], kind: pre.kind || "", yearly: false, note: "",
    when: normalizeWhen(pre.when), whenOpen: pre.when && pre.when.t === "months" && !seasonOfSet(pre.when.months) ? "months" : "",
    auto: {people: [], when: false, kind: false, yearly: false}, off: [],
    set: {when: !!pre.when, kind: !!pre.kind, yearly: false},
    adding: false, newName: ""
  };
}
function draftFromIdea(i){
  const d = newDraft();
  Object.assign(d, {id: i.id, text: i.text, people: i.people.slice(), kind: i.kind, yearly: i.yearly, note: i.note,
    when: normalizeWhen(i.when), set: {when: true, kind: true, yearly: true}});
  d.whenOpen = d.when.t === "months" && !seasonOfSet(d.when.months) ? "months" : "";
  return d;
}

    '<button class="chip ' + (w.t === "date" ? "on" : "") + '" data-act="cap-when" data-v="date">A date…</button></div>';
  if(isMonths){
    h += '<div class="months12">' + MON.map((n, m) => '<button class="chip t-' + seasonOf(m) + " " + (w.months.indexOf(m) >= 0 ? "on" : "") + '" data-act="cap-month" data-m="' + m + '">' + n + "</button>").join("") + "</div>";
  }
  if(w.t === "occasion"){

    if(w.occ && !occs.some(o => o.key === w.occ)){ const o = occByKey(w.occ); if(o) occs.push(o); }
    const mine = o => o.people.some(pid => d.people.indexOf(pid) >= 0) ? 0 : o.people.length ? 1 : 2;

  if(d.text.trim()){
    const preview = {when: normalizeWhen(d.when), yearly: d.yearly, kind: d.kind, doneYears: d.id && idea(d.id) ? idea(d.id).doneYears : [], plan: null};
    h += '<p class="promise">' + esc(promiseText(preview)) + "</p>";
  }
  return h;
}
function refreshCapture(){
  const box = $("#cap-rest"); if(box) box.innerHTML = captureRest();
  const btn = $("#cap-save"); if(btn) btn.disabled = !state.sheet.draft.text.trim();
}

/* Reading what was typed: names, seasons, months, occasions, the kind of thing.
   Only fields not already chosen by hand are filled in, and every guess shows as a chip you can undo. */
function parseHints(text){
  const t = " " + text.toLowerCase().replace(/[’`]/g, "'") + " ";
  const h = {people: [], kind: "", months: null, occ: "", birthday: false, yearly: false};
  db.people.forEach(p => {
    const parts = [p.name].concat(p.name.split(/\s*(?:&|\band\b|,|\+)\s*/)).map(s => s.trim().toLowerCase()).filter(s => s.length > 1);
    if(parts.some(n => new RegExp("(^|[^a-zà-ÿ])" + escRe(n) + "('s|s)?(?![a-zà-ÿ])").test(t))) h.people.push(p.id);
  });
  if(/\b(gift|present|buy|give|offer)\b/.test(t)) h.kind = "gift";
  else if(/\b(weekend|trip|travel|getaway|holiday|road ?trip|night away|journey|abroad)\b/.test(t)) h.kind = "trip";
  else if(/\b(bake|baking|cook|cooking|knit|sew|build|paint|craft|jam|biscuits|cake)\b/.test(t)) h.kind = "make";
  else if(/\b(letter|card|call|ring|flowers|write|message|postcard|thank)\b/.test(t)) h.kind = "gesture";
  const sm = /\b(spring|summer|autumn|fall|winter)\b/.exec(t);
  if(sm) h.months = seasonMonths(sm[1] === "fall" ? "autumn" : sm[1]);
  const ms = [];
  MONTHS.forEach((name, k) => {
    const re = k === 4 ? /\b(in|early|late|mid|end of|this|next|every) may\b/ : new RegExp("\\b" + name.toLowerCase() + "\\b");
    if(re.test(t)) ms.push(k);
  });
  if(/\bsept\b/.test(t) && ms.indexOf(8) < 0) ms.push(8);
  if(ms.length) h.months = ms;
  if(/\b(christmas|xmas|noël|noel)\b/.test(t)) h.occ = "h:christmas";
  else if(/(mother's day|mothers day|mothering sunday|fête des mères)/.test(t)) h.occ = "h:mothers";
  else if(/(father's day|fathers day|fête des pères)/.test(t)) h.occ = "h:fathers";
  else if(/\beaster\b/.test(t)) h.occ = "h:easter";
  else if(/\bvalentine/.test(t)) h.occ = "h:valentine";
  else if(/\bnew year/.test(t)) h.occ = "h:nye";
  else if(/\b(birthday|bday|anniversary)\b/.test(t)) h.birthday = true;
  if(/\b(every year|each year|tradition|annual|yearly|every (spring|summer|autumn|fall|winter|christmas))\b/.test(t)) h.yearly = true;
  return h;
}
function onCaptureText(){
  const d = state.sheet.draft, h = parseHints(d.text), before = JSON.stringify([d.people, d.when, d.kind, d.yearly]);
  d.people = d.people.filter(pid => d.auto.people.indexOf(pid) < 0 || h.people.indexOf(pid) >= 0);
  h.people.forEach(pid => { if(d.people.indexOf(pid) < 0 && d.off.indexOf(pid) < 0) d.people.push(pid); });
  d.auto.people = h.people.slice();
  if(!d.set.when){
    let w = {t: "someday"};
    if(h.occ) w = {t: "occasion", occ: h.occ};
    else if(h.birthday){
      const who = peopleOf(d.people).find(p => p.dates.length);
      if(who){ const dt = who.dates.find(x => /birthday/i.test(x.label)) || who.dates[0]; w = {t: "occasion", occ: "p:" + who.id + ":" + dt.id}; }
    }else if(h.months) w = {t: "months", months: h.months};
    d.when = normalizeWhen(w);
    d.whenOpen = d.when.t === "months" && !seasonOfSet(d.when.months) ? "months" : "";
  }
  if(!d.set.kind) d.kind = h.kind;
  if(!d.set.yearly) d.yearly = h.yearly;
  const after = JSON.stringify([d.people, d.when, d.kind, d.yearly]);
  if(after !== before || !!d.text.trim() !== !!state.sheet.hadText){ state.sheet.hadText = !!d.text.trim(); refreshCapture(); }
  else updatePromise();
}
function updatePromise(){
  const d = state.sheet.draft, p = $(".promise");
  if(p && d.text.trim()) p.textContent = promiseText({when: normalizeWhen(d.when), yearly: d.yearly, kind: d.kind, doneYears: [], plan: null});
}
function saveCapture(){
  const d = state.sheet.draft, text = d.text.trim();
  if(!text) return;
  const now = new Date().toISOString(), when = normalizeWhen(d.when);
  let i;
  if(d.id && idea(d.id)){
    i = idea(d.id);
    if(JSON.stringify(i.when) !== JSON.stringify(when)) i.snooze = "";
    Object.assign(i, {text, people: d.people.slice(), kind: d.kind, when, yearly: d.yearly, note: d.note.trim(), updated: now});
    i.ex = false;
  }else{
    i = {id: uid(), text, people: d.people.slice(), kind: d.kind, when, yearly: d.yearly, note: d.note.trim(),
      status: "open", plan: null, snooze: "", doneYears: [], created: now, updated: now, ex: false};
    db.ideas.push(i);
  }
  save(); closeSheet(); render();
  toast((d.id ? "Saved. " : "Kept. ") + promiseText(i));
}

/* ----- an idea, close up ----- */
SHEETS.idea = function(){
  const i = idea(state.sheet.id), T = today();
  if(!i) return sheetHead("This idea is gone");
  const mode = state.sheet.mode || "view";
  const eyebrow = [kindLabel(i.kind), i.yearly ? "a tradition" : ""].filter(Boolean).join(" · ") || "An idea";
  let h = sheetHead(i.text, eyebrow).replace('<h2 id="sheet-title">', '<h2 id="sheet-title" class="detail-title" style="font-family:var(--f-ui)">');

  if(mode === "plan"){
    return h + '<div class="group"><span class="eyebrow">When will it be?</span><input type="date" data-bind="date" value="' + esc(state.sheet.draft.date) + '" aria-label="Date"></div>' +
      '<p class="lede">It will show in Coming up as the day gets closer, and on that month of your year.</p>' +
      '<div class="sheet-foot"><button class="btn wide" data-act="idea-mode" data-mode="view">Back</button><button class="btn primary wide" data-act="plan-save">' + ic("check") + "Save the date</button></div>";
  }
  if(mode === "lived"){
    const dr = state.sheet.draft;
    return h + '<div class="group"><span class="eyebrow">' + (i.kind === "gift" ? "When did you give it?" : "When was it?") + '</span><input type="date" data-bind="date" value="' + esc(dr.date) + '" aria-label="Date"></div>' +
      '<div class="group"><span class="eyebrow">A line to remember it by</span><textarea data-bind="note" rows="3" placeholder="What you did, what someone said, how it felt">' + esc(dr.note) + "</textarea></div>" +
      (i.yearly ? "" : '<label class="switch-row"><div><b>Make it a tradition</b><small>Bring it back again next year.</small></div><span class="switch"><input type="checkbox" data-bind="tradition"' + (dr.tradition ? " checked" : "") + "><span></span></span></label>") +
      '<div class="sheet-foot"><button class="btn wide" data-act="idea-mode" data-mode="view">Back</button><button class="btn primary wide" data-act="lived-save">' + ic("heart") + "Keep this moment</button></div>";
  }

  const facts = [];
  if(i.people.length) facts.push([ "person", avatars(i.people) + " " + esc(names(i.people)) ]);
  const w = i.status === "open" ? nextWindow(i, T) : null;
  let whenLine = esc(whenText(i)) + (i.yearly ? ", every year" : "");
  if(w && !i.plan){
    const n = daysBetween(T, w.start);
    whenLine += i.when.t === "months" ? (n <= 0 ? " · in season now" : " · " + rel(n)) : " · " + esc(fmtDay(w.start)) + ", " + rel(n);
  }
  if(!(i.plan && i.when.t === "someday")) facts.push(["clock", whenLine]);
  if(i.plan){ const pd = parseYmd(i.plan.date); facts.push(["cal", "Planned for <b>" + esc(fmtDay(pd)) + "</b>, " + esc(rel(daysBetween(T, pd))) + ' <button class="link" data-act="unplan" data-id="' + esc(i.id) + '">Unplan</button>']); }
  if(i.note) facts.push(["note", '<span class="row-note">' + esc(i.note) + "</span>"]);
  if(i.status === "done") facts.push(["heart", "Lived"]);
  if(i.status === "gone") facts.push(["close", "You let this one go"]);
  h += '<div class="facts-list">' + facts.map(f => '<div class="fact">' + ic(f[0]) + "<span>" + f[1] + "</span></div>").join("") + "</div>";

  const history = db.lived.filter(l => l.ideaId === i.id).sort((a, b) => a.date < b.date ? 1 : -1);
  if(history.length) h += '<div class="group"><span class="eyebrow">Times you\'ve done it</span><div class="list">' + history.map(l => livedRow(l, T, {showDate: false})).join("") + "</div></div>";

  if(i.status === "gone"){
    return h + '<div class="btns"><button class="btn primary wide" data-act="revive" data-id="' + esc(i.id) + '">Bring it back</button>' +
      '<button class="btn danger wide" data-act="idea-delete" data-id="' + esc(i.id) + '">' + (state.sheet.confirm ? "Tap again to delete" : "Delete for good") + "</button></div>";
  }
  if(i.status === "done"){
    return h + '<div class="btns"><button class="btn wide" data-act="revive" data-id="' + esc(i.id) + '">Do it again someday</button><button class="btn wide" data-act="idea-edit" data-id="' + esc(i.id) + '">Edit</button></div>';
  }
  h += '<div class="btns"><button class="btn wide" data-act="idea-mode" data-mode="plan">' + ic("cal") + (i.plan ? "Change the date" : "Plan it") + "</button>" +
    '<button class="btn primary wide" data-act="idea-mode" data-mode="lived">' + ic("heart") + (i.kind === "gift" ? "Given" : "It happened") + "</button></div>";
  if(i.plan && canCalendar()) h += '<button class="btn" data-act="ics-one" data-id="' + esc(i.id) + '">' + ic("cal") + "Add to my calendar</button>";
  const canRest = !i.plan && (i.when.t === "someday" || (w && daysBetween(T, w.start) <= leadDays(i)));
  h += '<div class="btns">' + (canRest ? '<button class="btn quiet" data-act="rest" data-id="' + esc(i.id) + '">' + (i.when.t === "someday" ? "Not now" : "Not this time") + "</button>" : "") +
    '<button class="btn quiet" data-act="idea-edit" data-id="' + esc(i.id) + '">Edit</button>' +
    '<button class="btn quiet" data-act="let-go" data-id="' + esc(i.id) + '">Let it go</button></div>';
  return h;
};
function suggestDate(i, T){
  const w = nextWindow(i, T);
  let d = addDays(T, 5);
  if(w){
    if(i.when.t === "months"){ d = w.start > T ? w.start : addDays(T, 5); }
    else{ d = addDays(w.start, -10); if(d < T) d = addDays(T, 1); }
  }
  while(d.getDay() !== 6) d = addDays(d, 1);
  return ymd(d);
}

SHEETS.settings = function(){
