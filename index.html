function entree(id){ return db.plan.find(x => x.id === id) || null; }
function annulerPlan(id){ db.plan = db.plan.filter(x => x.id !== id); save(); render(); }

function ouvrirFiche(rid, e){
  const r = getRecette(rid);
  if(!r) return;
  if(e && e.portions && r.portions) state.portions[rid] = e.portions;
  go("fiche", {ficheId: rid});
}

function retirerEntree(id){
  const i = db.plan.findIndex(e => e.id === id);
  if(i < 0) return;
  const e = db.plan[i];
  db.plan.splice(i, 1); save(); render();
  const r = getRecette(e.rid);
  toast((r ? r.nom : "Repas") + " retiré du planning", () => { db.plan.splice(Math.min(i, db.plan.length), 0, e); save(); render(); });
}
function basculerFait(id){
  const e = entree(id);
  if(!e) return;
  const r = getRecette(e.rid);
  e.fait = !e.fait;
  if(r){
    if(e.fait){ r.cuisinee = (r.cuisinee || 0) + 1; r.derniereFois = Date.now(); }
    else r.cuisinee = Math.max(0, (r.cuisinee || 0) - 1);
  }
  save();
}
function autreIdee(id){
  const e = entree(id);
  if(!e) return;
  const r = tirer(poolSuggestions(entreesSemaine(e.sem).map(x => x.rid)));
  if(!r){ toast("Pas d'autre idée : ajoute des recettes !"); return; }
  const avant = e.rid;
  e.rid = r.id; e.fait = false; save(); render();
  toast("🔀 " + r.nom, () => { e.rid = avant; save(); render(); });
}
function completerSemaine(sem){
  const cur = semaineCourante();
  if(sem < cur){ toast("Cette semaine est passée"); return; }
  const ajoutes = [];
  for(let j = (sem === cur ? indexJour() : 0); j < 7; j++){
    if(entreesSemaine(sem).some(e => e.jour === j)) continue;
    const r = tirer(poolSuggestions(entreesSemaine(sem).map(e => e.rid)));
    if(!r) break;
    ajoutes.push(planifier(r.id, sem, j));
  }
  if(!ajoutes.length){
    toast(db.recettes.length ? "Chaque jour a déjà son repas ✓" : "Ajoute d'abord quelques recettes");
    return;
  }
  render();
  toast("✨ " + ajoutes.length + " idée" + (ajoutes.length > 1 ? "s" : "") + " au menu — 🔀 pour en changer",
    () => { db.plan = db.plan.filter(e => ajoutes.indexOf(e) < 0); save(); render(); });
}

function ajouterArticle(){
  const el = $("#course-new");
  const v = el ? el.value.trim() : "";
  if(!v){ if(el) el.focus(); return; }
  coursesDe(state.semCourses).ajouts.push({id: uid(), txt: v, rayon: ""});
  save(); render();
  const n = $("#course-new"); if(n) n.focus();   // on enchaîne les ajouts sans refermer le clavier
}
function retirerArticle(cle, sem){
  const C = coursesDe(sem);
  if(cle.indexOf("m:") === 0){
    const i = C.ajouts.findIndex(a => "m:" + a.id === cle);
    if(i < 0) return;
    const a = C.ajouts[i];
    C.ajouts.splice(i, 1); save(); render();
    toast("« " + a.txt + " » retiré", () => { C.ajouts.splice(i, 0, a); save(); render(); });
  }else{
    if(C.retires.indexOf(cle) < 0) C.retires.push(cle);
    save(); render();
    toast("Retiré de la liste", () => { C.retires = C.retires.filter(x => x !== cle); save(); render(); });
  }
}

function modifierRecette(rid){
  const r = getRecette(rid);
  if(!r) return;
  state.formDraft = JSON.parse(JSON.stringify(r));
  state.vieuxBM = false; state.majExistante = false; state.etapesReparees = 0;
  go("form", {editId: r.id});
}
function dupliquerRecette(rid){
  const r = getRecette(rid);
  if(!r) return;
  const copie = normalize(Object.assign({}, JSON.parse(JSON.stringify(r)),
    {id:uid(), nom:r.nom + " (copie)", cree:Date.now(), cuisinee:0, derniereFois:0}));
  db.recettes.push(copie); save(); toast("Recette dupliquée ✓");
  go("fiche", {ficheId: copie.id});
}
function supprimerRecette(rid){
  const r = getRecette(rid);
  if(!r) return;
  if(!confirm("Supprimer « " + r.nom + " » ? Cette action est définitive.")) return;
  db.recettes = db.recettes.filter(x => x.id !== rid);
  db.plan = db.plan.filter(e => e.rid !== rid);
  save(); state.formDraft = null; toast("Recette supprimée");
  onglet(state.onglet || "galerie");
}

function surprise(){
  const r = tirer(poolSuggestions([]));
  if(!r){ toast("Ajoute d'abord quelques recettes"); return; }
  go("fiche", {ficheId: r.id});
  toast("🎲 Et pourquoi pas… " + r.nom + " ?");
}

function allerA(cible){
  switch(cible){
    case "search":   state.frigo = false; state.focusQ = true; onglet("galerie"); return;
    case "frigo":    state.frigo = true; state.focusQ = true; onglet("galerie"); return;
    case "planning": state.semPlan = semaineCourante(); onglet("planning"); return;
    case "courses":  onglet("courses"); return;
    case "recettes": onglet("galerie"); return;
    case "surprise": surprise(); return;
  }
}

function voirTout(v){
  resetFiltres();
  state.tri = "categorie";
  switch(v){
    case "meilleures": state.tri = "meilleures"; break;
    case "rapides":    state.tri = "rapides"; state.filters.tempsMax = 30; break;
    case "saison":     state.tri = "meilleures"; state.filters.season = [saisonActuelle()]; break;
    case "phase":      state.filters.maPhase = true; break;
    case "tester":     state.tri = "recentes"; state.filters.aTester = true; break;
    case "recentes":   state.tri = "recentes"; break;
  }
  onglet("galerie");
}

function raccourci(k){
  const f = state.filters;
  switch(k){
    case "frigo":    state.frigo = !state.frigo; state.focusQ = true; break;
    case "fav":      f.fav = !f.fav; break;
    case "rapide":   f.tempsMax = f.tempsMax === 30 ? 0 : 30; break;
    case "top":      f.noteMin = f.noteMin === 4 ? 0 : 4; break;
    case "planning": f.semaine = !f.semaine; break;
    case "tester":   f.aTester = !f.aTester; break;
    case "phase":    f.maPhase = !f.maPhase; break;
  }
  render();
}

function faireAction(a){
  const act = a.dataset.act;
  const f = state.feuille || {};
  switch(act){
    // nouvelle recette
    case "new-manuel": case "new-web": case "new-coller": case "new-json":
      state.formDraft = vide();
      state.formTab = {"new-manuel":"manuel", "new-web":"web", "new-coller":"coller", "new-json":"json"}[act];
      state.vieuxBM = false; state.majExistante = false; state.etapesReparees = 0;
      go("form", {editId:null});
      return;

    // planifier une recette
    case "pl-sem":   f.sem = a.dataset.sem; renderFeuille(); return;
    case "pl-moins": f.portions = Math.max(1, f.portions - 1); renderFeuille(); return;
    case "pl-plus":  f.portions = f.portions + 1; renderFeuille(); return;
    case "pl-jour": {
      const j = parseInt(a.dataset.jour, 10);
      const e = planifier(f.rid, f.sem, j, f.portions);
      fermerFeuille(); render();
      if(e) toast("Prévu " + (j >= 0 ? libJour(f.sem, j).toLowerCase() : f.sem === semaineCourante() ? "cette semaine" : "la semaine prochaine") +
        " ✓", () => annulerPlan(e.id));
      return;
    }
    case "pl-retirer": db.plan = db.plan.filter(x => x.id !== a.dataset.entree); save(); renderFeuille(); render(); return;

    // choisir une recette pour un jour
    case "ch-recette": {
      const e = planifier(a.dataset.rid, f.sem, f.jour);
      fermerFeuille(); render();
      if(e) toast(getRecette(e.rid).nom + " · " + libJour(f.sem, f.jour).toLowerCase() + " ✓", () => annulerPlan(e.id));
      return;
    }

    // un repas du planning
    case "en-ouvrir": { const e = entree(f.id); fermerFeuille(); if(e) ouvrirFiche(e.rid, e); return; }
    case "en-fait":   basculerFait(f.id); fermerFeuille(); render(); return;
    case "en-autre":  fermerFeuille(); autreIdee(f.id); return;
    case "en-jour": {
      const e = entree(f.id);
      if(!e) return;
      e.jour = parseInt(a.dataset.jour, 10); save(); fermerFeuille(); render();
      toast("Déplacé : " + libJour(e.sem, e.jour).toLowerCase());
      return;
    }
    case "en-retirer": fermerFeuille(); retirerEntree(f.id); return;

    // la semaine du planning
    case "pl-menu":    ouvrirFeuille({type:"semaine", sem: state.semPlan}); return;
    case "pl-auto":    fermerFeuille(); completerSemaine(state.semPlan); return;
    case "pl-courses": fermerFeuille(); state.semCourses = state.semPlan; onglet("courses"); return;
    case "sm-vider": {
      const sem = state.semPlan, avant = db.plan.slice();
      db.plan = db.plan.filter(e => e.sem !== sem); save(); fermerFeuille(); render();
      toast("Semaine vidée", () => { db.plan = avant; save(); render(); });
      return;
    }
    case "sm-copier": {
      const sem = state.semPlan;
      const copies = entreesSemaine(ajouterJours(sem, -7)).map(e =>
        ({id: uid(), rid: e.rid, sem: sem, jour: e.jour, portions: e.portions, fait: false}));
      fermerFeuille();
      if(!copies.length){ toast("La semaine précédente est vide"); return; }
      db.plan = db.plan.concat(copies); save(); render();
      toast(copies.length + " repas repris ✓", () => { db.plan = db.plan.filter(e => copies.indexOf(e) < 0); save(); render(); });
      return;
    }

    // un article de la liste
    case "ar-placard": {
      const cle = f.cle;
      const L = trouverLigneCourses(cle, f.sem);
      if(L) db.placardNoms[cle] = L.nom;
      if(db.placard.indexOf(cle) < 0) db.placard.push(cle);
      save(); fermerFeuille(); render();
      toast("Rangé dans « Mes placards » 🏠", () => { db.placard = db.placard.filter(k => k !== cle); save(); render(); });
      return;
    }
    case "ar-placard-non":
      db.placard = db.placard.filter(k => k !== f.cle); save(); fermerFeuille(); render(); toast("Remis dans la liste");
      return;
    case "ar-retirer": fermerFeuille(); retirerArticle(f.cle, f.sem); return;
    case "ar-rayon": {
      const L = trouverLigneCourses(f.cle, f.sem);
      if(!L) return;
      const ry = a.dataset.rayon;
      if(L.manuel){
        const aj = coursesDe(f.sem).ajouts.find(x => "m:" + x.id === f.cle);
        if(aj) aj.rayon = ry;
      }else{
        db.rayons[normAli(L.ali ? L.ali.fr + " " + L.ali.en : L.nom)] = ry;
      }
      save(); fermerFeuille(); render(); toast("Rangé dans " + ry);
      return;
    }

    // la fiche
    case "fi-menu":  ouvrirFeuille({type:"fiche", rid: state.ficheId}); return;
    case "fi-edit":  fermerFeuille(); modifierRecette(f.rid); return;
    case "fi-dup":   fermerFeuille(); dupliquerRecette(f.rid); return;
    case "fi-share": { fermerFeuille(); const r = getRecette(f.rid); if(r) partager(r.nom, texteRecette(r), "Recette copiée ✓"); return; }
    case "fi-del":   fermerFeuille(); supprimerRecette(f.rid); return;
    case "fi-tag": {
      const r = getRecette(f.rid), t = a.dataset.tag;
      if(!r) return;
      const i = r.tags.indexOf(t);
      if(i >= 0) r.tags.splice(i, 1); else r.tags.push(t);
      r.maj = Date.now(); save(); renderFeuille(); render();
      return;
    }
    case "fi-tag-new": {
      const v = prompt("Nouvelle collection :");
      if(!v || !v.trim()) return;
      const r = getRecette(f.rid), val = v.trim();
      if(db.tags.indexOf(val) < 0) db.tags.push(val);
      if(r && r.tags.indexOf(val) < 0){ r.tags.push(val); r.maj = Date.now(); }
      save(); renderFeuille(); render();
      return;
    }
  }
}

let bound = false;
let notesT, notesPersoT, toucheX = null, toucheY = 0;

function bind(){
  if(bound) return;
  bound = true;

  $("#btn-search").innerHTML = ico("loupe");
  $("#btn-settings").innerHTML = ico("reglages");
  $("#fab").innerHTML = ico("plus");
  $("#brand").onclick = () => { resetFiltres(); onglet("accueil"); };
  $("#btn-search").onclick = () => allerA("search");
  $("#btn-settings").onclick = () => go("reglages");
  $("#phase-sel").onchange = e => {
    db.phaseActuelle = e.target.value || "";
    if(db.phaseActuelle) state.cycle = db.phaseActuelle;
    save(); render();
  };
  $("#fab").onclick = () => ouvrirFeuille({type:"nouvelle"});
  $("#alerte-export").onclick = () => exportJSON();

  // un onglet déjà ouvert : on remonte en haut, comme sur iPhone
  $("#tabbar").addEventListener("click", e => {
    const t = e.target.closest("[data-tab]");
    if(!t) return;
    if(t.dataset.tab === state.view){ window.scrollTo({top:0, behavior:"smooth"}); return; }
    onglet(t.dataset.tab);
  });

  $("#app").addEventListener("click", onAppClick);
  $("#app").addEventListener("input", onAppInput);
  $("#app").addEventListener("change", onAppChange);
  $("#app").addEventListener("keydown", onAppKeydown);
  $("#app").addEventListener("paste", onAppPaste);

  $("#sheet").addEventListener("click", e => {
    const a = e.target.closest("[data-act]");
    if(a) faireAction(a);
  });
  $("#sheet").addEventListener("input", e => {
    if(e.target.id !== "pick-q" || !state.feuille) return;
    state.feuille.q = e.target.value;
    const l = $("#pick-list"); if(l) l.innerHTML = listeChoix(state.feuille);
  });
  $("#sheet-bg").addEventListener("click", () => fermerFeuille());

  $("#toast").addEventListener("click", e => {
    if(e.target.id !== "toast-undo" || !toastAnnuler) return;
    const f = toastAnnuler;
    toastAnnuler = null;
    $("#toast").classList.remove("show");
    f();
  });

  $("#timers").addEventListener("click", e => {
    const s = e.target.closest("[data-timerstop]");
    if(s){ e.stopPropagation(); arreterMinuteur(s.dataset.timerstop); return; }
    const g = e.target.closest("[data-timergo]");
    if(g) allerAuMinuteur(g.dataset.timergo);
  });

  // mode cuisine : glisser pour changer d'étape, flèches au clavier sur Mac
  document.addEventListener("touchstart", e => {
    toucheX = null;
    if(state.view !== "cuisine" || e.touches.length !== 1) return;
    if(e.target.closest && e.target.closest("textarea, input, .timers")) return;
    toucheX = e.touches[0].clientX; toucheY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", e => {
    if(toucheX === null || state.view !== "cuisine") return;
    const t = e.changedTouches[0];
    const dx = t.clientX - toucheX, dy = t.clientY - toucheY;
    toucheX = null;
    if(Math.abs(dx) > 60 && Math.abs(dy) < 50) changerEtape(dx < 0 ? 1 : -1);
  }, {passive:true});
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && state.feuille){ fermerFeuille(); return; }
    if(state.view !== "cuisine") return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "")) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); changerEtape(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); changerEtape(-1); }
    else if(e.key === "Escape") retour();
  });
  document.addEventListener("visibilitychange", () => { if(state.view === "cuisine") garderEcranAllume(true); });

  // geste retour du navigateur : on dépile l'écran précédent
  window.addEventListener("popstate", e => {
    const n = (e.state && e.state.n) || 0;
    if(n >= pile.length) return;
    if(brouillonModifie() && !confirm("Abandonner les modifications ?")){
      try{ history.pushState({n: pile.length}, ""); }catch(_){}
      return;
    }
    if(state.view === "form") state.formDraft = null;
    depiler(n);
  });
}

function onAppClick(e){
  const t = e.target;

  const act = t.closest("[data-act]");
  if(act){ faireAction(act); return; }
  const gx = t.closest("[data-go]");
  if(gx){ allerA(gx.dataset.go); return; }

  // planifier depuis une vignette ou la fiche
  const w = t.closest("[data-plan]");
  if(w){ e.stopPropagation(); ouvrirPlanifier(w.dataset.plan); return; }
  const fv = t.closest("[data-fav]");
  if(fv){
    const r = getRecette(fv.dataset.fav);
    if(r){ const on = basculerFavori(r); render(); toast(on ? "Ajoutée aux favoris ❤️" : "Retirée des favoris"); }
    return;
  }
  const ck = t.closest("[data-cook]");
  if(ck){ demarrerCuisine(ck.dataset.cook, ck.dataset.entree); return; }
  const oe = t.closest("[data-open-entree]");
  if(oe){ const en = entree(oe.dataset.openEntree); if(en) ouvrirFiche(en.rid, en); return; }
  // ouvrir une fiche
  const o = t.closest("[data-open]");
  if(o){ go("fiche", {ficheId:o.dataset.open}); return; }

  // planning
  const pm = t.closest("[data-pe-moins]");
  if(pm){ const en = entree(pm.dataset.peMoins); if(en){ en.portions = Math.max(1, (en.portions || 1) - 1); save(); render(); } return; }
  const pp = t.closest("[data-pe-plus]");
  if(pp){ const en = entree(pp.dataset.pePlus); if(en){ en.portions = (en.portions || 0) + 1; save(); render(); } return; }
  const pmn = t.closest("[data-pe-menu]");
  if(pmn){ ouvrirFeuille({type:"entree", id: pmn.dataset.peMenu}); return; }
  const pa = t.closest("[data-pe-autre]");
  if(pa){ autreIdee(pa.dataset.peAutre); return; }
  const ad = t.closest("[data-addday]");
  if(ad){ ouvrirChoix(state.semPlan, parseInt(ad.dataset.addday, 10)); return; }
  const sn = t.closest("[data-semnav]");
  if(sn){
    const d = parseInt(sn.dataset.semnav, 10);
    state.semPlan = d ? ajouterJours(state.semPlan, 7 * d) : semaineCourante();
    render(); return;
  }
  const sc = t.closest("[data-semcourses]");
  if(sc){
    const d = parseInt(sc.dataset.semcourses, 10);
    state.semCourses = d ? ajouterJours(state.semCourses, 7 * d) : semaineCourante();
    render(); return;
  }

  // fiche : portions, multiple, note, minuteurs
  const fpm = t.closest("[data-fp-moins]");
  if(fpm){ const r = getRecette(fpm.dataset.fpMoins); if(r){ state.portions[r.id] = Math.max(1, portionsFiche(r) - 1); render(); } return; }
  const fpp = t.closest("[data-fp-plus]");
  if(fpp){ const r = getRecette(fpp.dataset.fpPlus); if(r){ state.portions[r.id] = portionsFiche(r) + 1; render(); } return; }
  const fmm = t.closest("[data-fm-moins]");
  if(fmm){ const i = MULTS.indexOf(state.mult[fmm.dataset.fmMoins] || 1); state.mult[fmm.dataset.fmMoins] = MULTS[Math.max(0, i - 1)]; render(); return; }
  const fmp = t.closest("[data-fm-plus]");
  if(fmp){ const i = MULTS.indexOf(state.mult[fmp.dataset.fmPlus] || 1); state.mult[fmp.dataset.fmPlus] = MULTS[Math.min(MULTS.length - 1, i + 1)]; render(); return; }
  const rt = t.closest("[data-rate]");
  if(rt){
    const r = getRecette(ridCourant());
    if(r){
      const v = num(rt.dataset.rate);
      r.note = r.note === v ? 0 : v; r.maj = Date.now(); save(); render();
      toast(r.note ? "Noté " + r.note + " ★" : "Note retirée");
    }
    return;
  }
  const tm = t.closest("[data-timer]");
  if(tm){ lancerMinuteur(num(tm.dataset.timer), tm.dataset.timerlib, ridCourant(), num(tm.dataset.timeretape)); return; }

  // accueil et bibliothèque
  const vt = t.closest("[data-voir]");
  if(vt){ voirTout(vt.dataset.voir); return; }
  const cl = t.closest("[data-coll]");
  if(cl){ resetFiltres(); state.tri = "categorie"; state.filters.tags = [cl.dataset.coll]; onglet("galerie"); return; }
  const cm = t.closest("[data-catmeal]");
  if(cm){ resetFiltres(); state.filters.meal = [cm.dataset.catmeal]; onglet("galerie"); return; }
  const qk = t.closest("[data-quick]");
  if(qk){ raccourci(qk.dataset.quick); return; }
  const qm = t.closest("[data-quickmeal]");
  if(qm){
    const m = qm.dataset.quickmeal, f = state.filters;
    f.meal = (f.meal.length === 1 && f.meal[0] === m) ? [] : [m];
    render(); return;
  }
  const tg = t.closest("[data-tab-go]");
  if(tg){ onglet(tg.dataset.tabGo); return; }
  const cy = t.closest("[data-cycle]");
  if(cy){ state.cycle = cy.dataset.cycle; render(); return; }

  // réglages (pas « data-theme » : <html data-theme> est un ancêtre de tout, closest() le trouverait)
  const pr = t.closest("[data-prefportions]");
  if(pr){
    db.prefs.portions = num(pr.dataset.prefportions); state.portions = {}; save(); render();
    toast(db.prefs.portions ? "Recettes proposées pour " + db.prefs.portions + " ✓" : "Portions de chaque recette ✓");
    return;
  }
  const th = t.closest("[data-apparence]");
  if(th){ db.prefs.theme = th.dataset.apparence; save(); appliquerTheme(); render(); return; }
  const rp = t.closest("[data-rmplacard]");
  if(rp){ db.placard = db.placard.filter(k => k !== rp.dataset.rmplacard); save(); render(); return; }

  // courses : options d'un article
  const cmn = t.closest("[data-coursemenu]");
  if(cmn){ ouvrirFeuille({type:"article", cle: cmn.dataset.coursemenu, sem: state.semCourses}); return; }

  // chips (filtres et formulaire)
  const chip = t.closest(".chip");
  if(chip && chip.dataset.val !== undefined && chip.parentElement && chip.parentElement.dataset.chipgroup){
    onChip(chip, chip.parentElement.dataset.chipgroup);
    return;
  }

  const id = t.id || (t.closest("button") ? t.closest("button").id : "");

  switch(id){
    case "toggle-filters": state.showFilters = !state.showFilters; render(); return;
    case "clear-filters":  resetFiltres(); render(); return;
    case "f-semaine":      state.filters.semaine = !state.filters.semaine; render(); return;
    case "f-maphase":      state.filters.maPhase = !state.filters.maPhase; render(); return;
    case "reset-courses": {
      const C = coursesDe(state.semCourses), avant = C.coches;
      C.coches = {}; save(); render();
      toast("Liste décochée", () => { C.coches = avant; save(); render(); });
      return;
    }
    case "add-course":    ajouterArticle(); return;
    case "share-courses": partager("Courses", texteCourses(state.semCourses), "Liste copiée ✓"); return;
    case "back":
      if(brouillonModifie() && !confirm("Abandonner les modifications ?")) return;
      if(state.view === "form") state.formDraft = null;
      retour();
      return;
    case "edit": modifierRecette(state.ficheId); return;
    case "dup":  dupliquerRecette(state.ficheId); return;
    case "del":  supprimerRecette(state.view === "form" ? state.formDraft.id : state.ficheId); return;
    case "cook": case "cook2": demarrerCuisine(state.ficheId); return;
    case "share": { const r = getRecette(state.ficheId); if(r) partager(r.nom, texteRecette(r), "Recette copiée ✓"); return; }
    case "to-courses": {
      const r = getRecette(state.ficheId);
      if(!r) return;
      const cur = semaineCourante();
      if(estPlanifiee(r, cur)){ toast("Déjà au planning cette semaine : ses ingrédients sont sur la liste"); return; }
      const e = planifier(r.id, cur, -1, r.portions ? portionsFiche(r) : 0);
      render();
      toast("Ingrédients ajoutés à la liste de la semaine ✓", () => annulerPlan(e.id));
      return;
    }
    case "uncheck-ings": {
      const r = getRecette(state.ficheId);
      if(r) r.ingredients.forEach((i, k) => delete state.checked[r.id + "-" + k]);
      render(); return;
    }
    case "portions-reset": { const r = getRecette(ridCourant()); if(r) state.portions[r.id] = r.portions; render(); return; }
    case "cook-exit": case "cook-exit2": retour(); return;
    case "cook-prev": changerEtape(-1); return;
    case "cook-next": changerEtape(1); return;
    case "cook-done": {
      const c = state.cuisine, r = c && getRecette(c.rid);
      if(r && !c.marque){ marquerCuisinee(r, c.entree); c.marque = true; render(); toast("Bravo ! 👩‍🍳 C'est noté"); }
      return;
    }
    case "save-recette": saveRecette(); return;
    case "save-notes":   db.cycleNotes[state.cycle] = $("#cycle-notes").value; save(); toast("Notes enregistrées ✓"); return;
    case "add-ing": {
      syncDraft();
      const box = $("#ings");
      const k = box.children.length;
      box.insertAdjacentHTML("beforeend", ingRow({txt:"",alg:false}, k));
      const inputs = box.querySelectorAll(".ing-txt");
      inputs[inputs.length-1].focus();
      return;
    }
    case "add-tag": case "add-tag2": {
      const v = prompt("Nouveau tag / collection :");
      if(!v || !v.trim()) return;
      const val = v.trim();
      if(db.tags.indexOf(val) < 0) db.tags.push(val);
      save();
      if(id === "add-tag"){ syncDraft(); if(state.formDraft.tags.indexOf(val) < 0) state.formDraft.tags.push(val); }
      render();
      return;
    }
    case "add-cuisine": case "add-cuisine2": {
      const v = prompt("Nouvelle cuisine / catégorie :");
      if(!v || !v.trim()) return;
      const val = v.trim();
      if(db.cuisines.indexOf(val) < 0) db.cuisines.push(val);
      save();
      if(id === "add-cuisine"){ syncDraft(); if(state.formDraft.cuisines.indexOf(val) < 0) state.formDraft.cuisines.push(val); }
      render();
      return;
    }
    case "rm-img": syncDraft(); state.formDraft.image = ""; render(); return;
    case "do-parse":     appliquerImport($("#paste-src").value); return;
    case "do-webimport": appliquerImport($("#web-src").value); return;
    case "copy-bm":      copier(bookmarkletSrc(), "Bookmarklet copié ✓"); return;
    case "copy-ios":     copier(IOS_JS, "Code du raccourci copié ✓"); return;
    case "paste-clip":
      if(navigator.clipboard && navigator.clipboard.readText){
        navigator.clipboard.readText().then(
          txt => { const el = $("#web-src"); if(el) el.value = txt; appliquerImport(txt); },
          () => toast("Safari a refusé l'accès au presse-papiers — colle dans le champ ci-dessous")
        );
      }else{
        toast("Presse-papiers indisponible — colle dans le champ ci-dessous");
      }
      return;
    case "do-json": importJSON($("#json-text").value, false); return;
    case "do-export": exportJSON(); return;
    case "fc-export": fcExport(); return;
    case "fc-toggle":
      db.fc.actif = !db.fc.actif;
      if(!db.fc.actif) state.filters.maPhase = false;
      save(); toast(db.fc.actif ? "Food Cycling activé" : "Food Cycling désactivé");
      render();
      return;
    case "ouvrir-aliments": state.qAli = ""; state.filtreAli = ""; state.aliEdit = ""; go("aliments"); return;
    case "ali-new": {
      const fr = prompt("Nom de l'aliment (en français) :");
      if(!fr || !fr.trim()) return;
      const en = (prompt("Nom en anglais (facultatif, sert à la reconnaissance) :", fr.trim()) || fr).trim();
      if(ALIMENTS.find(x => normLibelle(x.en) === normLibelle(en))){ toast("Cet aliment existe déjà"); return; }
      db.aliments.perso.push({en:en, fr:fr.trim(), cat:"O", gi:"", pest:""});
      construireAliments(); save();
      state.qAli = fr.trim(); state.filtreAli = ""; state.aliEdit = en;
      toast("Complète sa fiche ci-dessous");
      render();
      return;
    }
    case "ae-close": state.aliEdit = ""; render(); return;
    case "ae-save": {
      const fr = ($("#ae-fr").value || "").trim();
      const enInput = $("#ae-en");
      const a = ALIMENTS.find(x => x.en === state.aliEdit);
      if(!a || !fr){ toast("Le nom français est obligatoire"); return; }
      if(a.perso && enInput && enInput.value.trim() && enInput.value.trim() !== a.en){
        const nouveau = enInput.value.trim();
        const p = db.aliments.perso.find(x => x.en === a.en);
        if(p) p.en = nouveau;
        if(db.fc.assoc[a.en]){ db.fc.assoc[nouveau] = db.fc.assoc[a.en]; delete db.fc.assoc[a.en]; }
        Object.keys(db.synonymes).forEach(k => { if(db.synonymes[k] === a.en) db.synonymes[k] = nouveau; });
        state.aliEdit = nouveau;
        majAliment(nouveau, {fr: fr});
      }else{
        majAliment(a.en, {fr: fr});
      }
      toast("Aliment enregistré ✓");
      render();
      return;
    }
    case "err-home": state.formDraft = null; state.ficheId = null; onglet("accueil"); return;
    case "go-web":
      if(!confirm("Abandonner cet import et aller remplacer le bookmarklet ?")) return;
      state.vieuxBM = false; state.majExistante = false;
      state.formTab = "web"; state.formDraft = vide(); render();
      return;
    case "wipe":
      if(!confirm("Effacer TOUTES les recettes, le planning et les notes ? Pense à exporter avant.")) return;
      if(!confirm("Vraiment sûre ? C'est définitif.")) return;
      db.recettes = []; db.plan = []; db.courses = {};
      db.cycleNotes = {"Folliculaire":"","Ovulatoire":"","Lutéale":"","Menstruelle":""};
      save(); toast("Base effacée"); onglet("accueil");
      return;
  }

  // onglets du formulaire
  const ft = t.closest("[data-ftab]");
  if(ft){ if(state.formTab === "manuel") syncDraft(); state.formTab = ft.dataset.ftab; render(); return; }

  // étoiles
  const st = t.closest("[data-star]");
  if(st){
    syncDraft();
    const v = num(st.dataset.star);
    state.formDraft.note = (state.formDraft.note === v) ? 0 : v;
    $$("#starpick button").forEach(b => b.classList.toggle("on", num(b.dataset.star) <= state.formDraft.note));
    return;
  }
  // « ajouter à cette semaine » dans le formulaire d'une nouvelle recette
  if(id === "d-semaine"){
    syncDraft();
    state.formDraft.semaine = !state.formDraft.semaine;
    t.closest("button").classList.toggle("on");
    return;
  }

  // allergène / suppression de ligne d'ingrédient
  const alg = t.closest("[data-alg]");
  if(alg){ alg.classList.toggle("on"); return; }
  const dr = t.closest("[data-delrow]");
  if(dr){ const row = dr.closest(".ing-row"); if($$("#ings .ing-row").length > 1) row.remove(); else row.querySelector(".ing-txt").value = ""; return; }

  // cocher un ingrédient (fiche ou mode cuisine)
  const ing = t.closest("[data-ing]");
  if(ing){ const k = ridCourant() + "-" + ing.dataset.ing; state.checked[k] = !state.checked[k]; ing.classList.toggle("done"); return; }

  // phase courante depuis une page de phase
  const sp = t.closest("[data-setphase]");
  if(sp){
    const c = sp.dataset.setphase;
    db.phaseActuelle = (db.phaseActuelle === c) ? "" : c;
    save(); toast(db.phaseActuelle ? "Phase " + c.toLowerCase() + " activée" : "Phase désactivée");
    render();
    return;
  }

  // liste de courses : cocher ; un article du placard ouvre ses options
  const cc = t.closest("[data-course]");
  if(cc){
    const k = cc.dataset.course;
    if(cc.dataset.placard){ ouvrirFeuille({type:"article", cle:k, sem: state.semCourses}); return; }
    const C = coursesDe(state.semCourses);
    if(C.coches[k]) delete C.coches[k]; else C.coches[k] = true;
    cc.classList.toggle("done"); save();
    majProgressionCourses();
    return;
  }

  // page Aliments : ouvrir la carte d'édition
  const ae = t.closest("[data-aliedit]");
  if(ae){
    const cle = ae.dataset.aliedit;
    state.aliEdit = (state.aliEdit === cle) ? "" : cle;
    render();
    return;
  }
  // choix dans la carte (catégorie, IG, pesticides)
  const av = t.closest("[data-aeval]");
  if(av && av.parentElement && av.parentElement.dataset.aegroup){
    const champ = av.parentElement.dataset.aegroup;
    majAliment(state.aliEdit, {[champ]: av.dataset.aeval});
    render();
    return;
  }
  const as = t.closest("[data-addsyn]");
  if(as){
    const v = prompt("Texte à reconnaître comme cet aliment :");
    if(!v || !v.trim()) return;
    db.synonymes[v.trim()] = as.dataset.addsyn;
    IDX_ALI = null; save(); toast("Synonyme ajouté");
    render();
    return;
  }

  // éditeur d'aliments : rattacher / détacher une phase
  const ap = t.closest("[data-aliphase]");
  if(ap){
    const [cle, phase] = ap.dataset.aliphase.split("|");
    const a = ALIMENTS.find(x => x.en === cle);
    if(!a) return;
    const i = a.phases.indexOf(phase);
    if(i >= 0) a.phases.splice(i, 1); else a.phases.push(phase);
    if(a.phases.length) db.fc.assoc[cle] = a.phases.slice();
    else delete db.fc.assoc[cle];
    IDX_ALI = null; save();
    render();
    return;
  }
  const adl = t.closest("[data-alidel]");
  if(adl){
    const cle = adl.dataset.alidel;
    const a = ALIMENTS.find(x => x.en === cle);
    if(!confirm("Retirer « " + ((a && a.fr) || cle) + " » de ta liste d'aliments ?")) return;
    if(a && a.perso) db.aliments.perso = db.aliments.perso.filter(x => x.en !== cle);
    else if(db.aliments.masques.indexOf(cle) < 0) db.aliments.masques.push(cle);
    delete db.fc.assoc[cle];
    delete db.aliments.modifs[cle];
    Object.keys(db.synonymes).forEach(k => { if(db.synonymes[k] === cle) delete db.synonymes[k]; });
    state.aliEdit = "";
    construireAliments(); save(); toast("Aliment retiré"); render();
    return;
  }
  const fa = t.closest("[data-fali]");
  if(fa){ state.filtreAli = fa.dataset.fali; render(); return; }

  // retirer un tag (réglages)
  const rtg = t.closest("[data-rmtag]");
  if(rtg){
    const v = rtg.dataset.rmtag;
    if(!confirm("Retirer le tag « " + v + " » de la liste ?")) return;
    db.tags = db.tags.filter(x => x !== v); save(); render();
    return;
  }

  const rs = t.closest("[data-rmsyn]");
  if(rs){ delete db.synonymes[rs.dataset.rmsyn]; IDX_ALI = null; save(); render(); return; }

  const rc = t.closest("[data-rmcuisine]");
  if(rc){
    const v = rc.dataset.rmcuisine;
    if(!confirm("Retirer « " + v + " » de la liste ?")) return;
    db.cuisines = db.cuisines.filter(c => c !== v); save(); render();
    return;
  }
}

function onChip(chip, group){
  const val = chip.dataset.val;
  if(val === undefined) return;

  // groupes de filtres
  const fmap = {"f-cycle":"cycle","f-meal":"meal","f-cuisine":"cuisine","f-tags":"tags",
                "f-season":"season","f-diff":"diff","f-statut":"statut"};
  if(fmap[group]){
    const key = fmap[group];
    const list = state.filters[key];
    const i = list.indexOf(val);
    if(i >= 0) list.splice(i,1); else list.push(val);
    render();
    return;
  }

  // groupes du formulaire
  syncDraft();
  const d = state.formDraft;
  const single = {"d-statut":"statut","d-meal":"meal","d-diff":"diff"};
  const multi  = {"d-cuisines":"cuisines","d-tags":"tags","d-seasons":"seasons","d-cycles":"cycles"};
  if(single[group]){
    const key = single[group];
    d[key] = (d[key] === val && key !== "statut") ? "" : val;
    chip.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.val === d[key]));
  }else if(multi[group]){
    const key = multi[group];
    const i = d[key].indexOf(val);
    if(i >= 0) d[key].splice(i,1); else d[key].push(val);
    chip.classList.toggle("on");
  }
}

function onAppInput(e){
  const t = e.target;
  if(t.id === "q"){
    state.q = t.value;
    const pos = t.selectionStart;
    render();
    const q = $("#q"); if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} }
    return;
  }
  if(t.id === "q-ali"){
    state.qAli = t.value;
    const pos = t.selectionStart;
    render();
    const el = $("#q-ali"); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} }
    return;
  }
  if(t.id === "f-temps"){ state.filters.tempsMax = num(t.value); clearTimeout(notesT); notesT = setTimeout(render, 400); return; }
  if(t.id === "cycle-notes"){
    db.cycleNotes[state.cycle] = t.value;
    clearTimeout(notesT); notesT = setTimeout(() => { const ok = save(); const s = $("#notes-state"); if(s) s.textContent = ok ? "Enregistré ✓" : "⚠️ Non enregistré (mémoire pleine)"; }, 600);
    return;
  }
  if(t.id === "notes-perso"){
    const r = getRecette(ridCourant());
    if(!r) return;
    r.notesPerso = t.value;
    clearTimeout(notesPersoT);
    notesPersoT = setTimeout(() => { const ok = save(); const s = $("#np-state"); if(s) s.textContent = ok ? "Enregistré ✓" : "⚠️ Non enregistré (mémoire pleine)"; }, 600);
    return;
  }
  if(t.id === "in-prep" || t.id === "in-cuisson"){
    const h = $("#total-hint");
    if(h) h.textContent = "Temps total : " + fmtMin(num($("#in-prep").value) + num($("#in-cuisson").value)) +
      " · les portions servent à ajuster les quantités";
    return;
  }
}

function onAppChange(e){
  const t = e.target;
  if(t.id === "tri"){ state.tri = t.value; render(); return; }
  if(t.id === "f-note"){ state.filters.noteMin = num(t.value); render(); return; }
  if(t.id === "in-img" && t.files && t.files[0]){
    syncDraft();
    readImage(t.files[0], data => { state.formDraft.image = data; render(); toast("Photo ajoutée ✓"); });
    return;
  }
  if(t.id === "fc-file" && t.files && t.files[0]){
    const fr = new FileReader();
    fr.onload = ev => { if(fcImport(ev.target.result)) render(); };
    fr.readAsText(t.files[0]);
    return;
  }
  if((t.id === "json-file" || t.id === "set-import") && t.files && t.files[0]){
    const fr = new FileReader();
    fr.onload = ev => importJSON(ev.target.result, false);
    fr.readAsText(t.files[0]);
    return;
  }
}

/* ↵ dans un ingrédient ouvre la ligne suivante ; ↵ dans « ajouter un article » l'ajoute */
function onAppKeydown(e){
  if(e.key !== "Enter" || e.isComposing) return;
  const t = e.target;
  if(t.id === "course-new"){ e.preventDefault(); ajouterArticle(); return; }
  if(t.classList && t.classList.contains("ing-txt")){
    e.preventDefault();
    const row = t.closest(".ing-row");
    row.insertAdjacentHTML("afterend", ingRow({txt:"", alg:false}, $$("#ings .ing-row").length));
    row.nextElementSibling.querySelector(".ing-txt").focus();
  }
}

/* une liste entière collée dans un ingrédient : une ligne par ingrédient */
function onAppPaste(e){
  const t = e.target;
  if(!t.classList || !t.classList.contains("ing-txt")) return;
  const brut = (e.clipboardData || window.clipboardData).getData("text") || "";
  const lignes = brut.replace(/\r/g, "").split("\n").map(l => l.replace(/^[-•*·]\s*/, "").trim()).filter(Boolean);
  if(lignes.length < 2) return;
  e.preventDefault();
  let row = t.closest(".ing-row");
  if(!t.value.trim()) t.value = lignes.shift();
  lignes.forEach(l => {
    row.insertAdjacentHTML("afterend", ingRow({txt: l, alg:false}, $$("#ings .ing-row").length));
    row = row.nextElementSibling;
  });
  row.querySelector(".ing-txt").focus();
  toast(($$("#ings .ing-row").length) + " ingrédients ✓");
}

   9. DÉMARRAGE
