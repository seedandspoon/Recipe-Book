      '<div class="card-title">' + esc(r.nom) + '</div>' +
      (r.note ? '<div class="stars">' + stars(r.note) + '</div>' : "") +
      (tag || ph ? '<div class="fit">' + PHASES_BASE[db.phaseActuelle].emo + ' ' +
          (tag ? "De ta phase" + (ph ? " · " + ph + " ingr." : "") : ph + ' ingrédient' + (ph > 1 ? "s" : "") + ' de ta phase') + '</div>' : "") +
      (opts.badge || "") +
      (meta.length ? '<div class="card-meta">' + meta.map(m => "<span>" + m + "</span>").join("") + '</div>' : "") +
    '</div>' +
  '</article>';
}

function grille(list){
  if(!list.length) return '<div class="empty"><span class="big">🍋</span>Aucune recette ne correspond.</div>';
  return '<div class="grid">' + list.map(r => carte(r)).join("") + '</div>';
}

/* une rangée qui défile à l'horizontale, avec « Tout voir » vers la bibliothèque filtrée */
function rail(titre, list, voir){
  if(!list.length) return "";
  return '<div class="section"><div class="section-head"><h3>' + titre + '</h3>' +
    (voir ? '<button class="voir" data-voir="' + voir + '">Tout voir ›</button>' : "") + '</div>' +
    '<div class="rail">' + list.slice(0, 12).map(r => carte(r, {compact:true})).join("") + '</div></div>';
}

/* ---------- accueil ---------- */
function viewAccueil(){
  if(!db.recettes.length) return accueilVide();
  const h = new Date().getHours();
  const salut = h < 5 ? "Bonne nuit" : h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir";
  const vivantes = db.recettes.filter(r => r.statut !== ARCHIVE);
  const cur = semaineCourante();
  const nRepas = entreesSemaine(cur).length;
  const restants = articlesRestants(state.semCourses || cur);

  let html = '<div class="hello"><div class="hello-sub">' + salut + ' 👋</div><h1>Qu\'est-ce qu\'on mange ?</h1></div>' +
    '<button class="fakesearch" data-go="search">' + ico("loupe", "sm") + 'Rechercher une recette, un ingrédient…</button>';

  html += blocAujourdhui();

  html += '<div class="quick">' +
    tuile("planning", "🗓", "Planning", nRepas ? nRepas + " repas" : "à remplir") +
    tuile("courses", "🧺", "Courses", restants ? restants + " article" + (restants > 1 ? "s" : "") : "à jour") +
    tuile("surprise", "🎲", "Surprise", "une idée") +
    tuile("frigo", "🥕", "Mon frigo", "ce que j'ai") +
  '</div>';

  html += blocPhase(vivantes);

  const meilleures = trier(vivantes.filter(r => r.note >= 4 || estFavori(r)), "meilleures");
  html += rail("⭐ Tes meilleures recettes", meilleures, "meilleures");

  const rapides = trier(vivantes.filter(r => total(r) && total(r) <= 30), "meilleures");
  html += rail("⚡ Prêt en 30 min", rapides, "rapides");

  const saison = saisonActuelle();
  html += rail(SAISON_LBL[saison], trier(vivantes.filter(deSaison), "meilleures"), "saison");

  // bien aimées mais pas faites depuis un mois : seulement si l'historique a commencé
  if(db.recettes.some(r => r.derniereFois)){
    const loin = Date.now() - 30 * J_MS;
    const redecouvrir = vivantes.filter(r => (r.note >= 4 || estFavori(r)) && r.derniereFois && r.derniereFois < loin)
      .sort((a,b) => a.derniereFois - b.derniereFois);
    html += rail("💭 À refaire bientôt", redecouvrir, "");
  }
  html += rail("🧪 Pas encore testées", trier(vivantes.filter(r => !r.note), "recentes"), "tester");
  html += rail("🆕 Ajoutées récemment", trier(vivantes.slice(), "recentes"), "recentes");

  // mes collections = mes tags, illustrés par la première photo trouvée
  const colls = db.tags.map(t => ({t: t, rs: db.recettes.filter(r => r.tags.indexOf(t) >= 0)})).filter(x => x.rs.length);
  if(colls.length){
    html += '<div class="section"><div class="section-head"><h3>🏷 Mes collections</h3></div><div class="colls">' +
      colls.map(x => {
        const img = (x.rs.find(r => r.image) || {}).image;
        return '<button type="button" class="coll" data-coll="' + esc(x.t) + '">' +
          (img ? '<img src="' + esc(img) + '" alt="" loading="lazy">' : '<span class="coll-emo">🏷</span>') +
          '<span>' + esc(x.t) + '<small>' + x.rs.length + ' recette' + (x.rs.length > 1 ? "s" : "") + '</small></span></button>';
      }).join("") + '</div></div>';
  }

  const cats = MEALS.map(m => [m, db.recettes.filter(r => r.meal === m).length]).filter(x => x[1]);
  if(cats.length){
    html += '<div class="section"><div class="section-head"><h3>Par catégorie</h3></div><div class="chips">' +
      cats.map(([m, n]) => '<button type="button" class="chip" data-catmeal="' + esc(m) + '">' + (MEAL_EMO[m] || "") + " " +
        esc(m) + ' <span class="count">' + n + '</span></button>').join("") + '</div></div>';
  }
  return html + '<div style="height:24px"></div>';
}

/* Food Cycling : les recettes de ma phase en tête d'accueil — ou de quoi la choisir */
function blocPhase(vivantes){
  if(!db.fc.actif) return "";
  if(!db.phaseActuelle){
    return '<div class="section"><div class="section-head"><h3>🌗 Dans quelle phase es-tu ?</h3></div>' +
      '<div class="chips">' + CYCLES.map(c => '<button type="button" class="chip" data-setphase="' + esc(c) + '">' +
        PHASES_BASE[c].emo + ' ' + esc(c) + '</button>').join("") + '</div>' +
      '<p class="hint">Les recettes adaptées à ta phase apparaîtront ici.</p></div>';
  }
  const ph = db.phaseActuelle;
  const list = vivantes.filter(r => pertinencePhase(r) > 0)
    .sort((a,b) => (pertinencePhase(b) - pertinencePhase(a)) || (b.note - a.note) || a.nom.localeCompare(b.nom, "fr"));
  const titre = PHASES_BASE[ph].emo + " Pour ta phase " + ph.toLowerCase();
  if(list.length) return rail(titre, list, "phase");
  return '<div class="section"><div class="section-head"><h3>' + titre + '</h3></div>' +
    '<div class="panel"><p class="hint" style="margin:0 0 10px">Aucune recette rattachée à cette phase pour l\'instant. ' +
    'Coche la phase dans le champ « Cycle » d\'une recette (✎ Modifier), ou rattache des aliments à la phase : ' +
    'les recettes qui en contiennent remonteront ici.</p>' +
    '<div class="actions" style="margin:0"><button class="btn sm" data-tab-go="cycle">Ouvrir la phase</button></div></div></div>';
}

function tuile(go, emo, titre, sous){
  return '<button type="button" class="qt" data-go="' + go + '"><span class="qt-emo">' + emo + '</span>' +
    esc(titre) + '<small>' + esc(sous) + '</small></button>';
}

function blocAujourdhui(){
  const sem = semaineCourante(), j = indexJour();
  const entrees = entreesSemaine(sem);
  const auj = entrees.filter(e => e.jour === j);
  if(auj.length){
    const e = auj.find(x => !x.fait) || auj[0];
    const r = getRecette(e.rid);
    const autres = auj.filter(x => x !== e);
    const meta = [total(r) ? "⏱ " + fmtMin(total(r)) : "", r.kcal ? "🔥 " + r.kcal + " kcal" : "",
                  e.portions + " portion" + (e.portions > 1 ? "s" : "")].filter(Boolean);
    return '<div class="today">' +
      '<div class="today-img" data-open-entree="' + e.id + '">' +
        (r.image ? '<img src="' + esc(r.image) + '" alt="">' : (MEAL_EMO[r.meal] || "🍳")) + '</div>' +
      '<div class="today-body"><div class="kicker">' + (e.fait ? "✓ Cuisiné aujourd'hui" : "Au menu aujourd'hui") + '</div>' +
      '<div class="today-title" data-open-entree="' + e.id + '">' + esc(r.nom) + '</div>' +
      '<div class="card-meta">' + meta.map(m => "<span>" + m + "</span>").join("") + '</div>' +
      '<div class="actions">' +
        '<button class="btn primary" data-cook="' + r.id + '" data-entree="' + e.id + '">' + ico("play", "plein sm") + ' Cuisiner</button>' +
        '<button class="btn" data-open-entree="' + e.id + '">Voir la recette</button></div>' +
      (autres.length ? '<p class="hint">Aussi aujourd\'hui : ' + autres.map(x => esc(getRecette(x.rid).nom)).join(", ") + '</p>' : "") +
      '</div></div>';
  }
  const prochain = entrees.filter(e => e.jour > j && !e.fait).sort((a,b) => a.jour - b.jour)[0];
  return '<div class="today vide"><div class="today-body"><div class="kicker">Aujourd\'hui</div>' +
    '<div class="today-title">Rien de prévu pour l\'instant</div>' +
    '<p class="hint" style="margin:0">' + (prochain
      ? 'Prochain au menu : ' + JOURS[prochain.jour].toLowerCase() + ' — ' + esc(getRecette(prochain.rid).nom)
      : 'Laisse-toi inspirer, ou planifie ta semaine en deux minutes.') + '</p>' +
    '<div class="actions"><button class="btn primary" data-go="surprise">🎲 Une idée ?</button>' +
    '<button class="btn" data-go="planning">🗓 Planifier</button></div></div></div>';
}

function accueilVide(){
  return '<div class="onb"><div class="big">📒</div><h2>Ton livre de recettes</h2>' +
    '<p>Ajoute tes recettes, planifie ta semaine, et l\'app s\'occupe de la liste de courses.</p></div>' +
    '<div class="opts">' +

      opt("new-coller", "📋", "Coller le texte d'une recette", "L'app repère titre, ingrédients et étapes") +
      opt("new-json", "⇪", "Restaurer une sauvegarde", "Fichier JSON exporté depuis l'app") +

/* ---------- bibliothèque ---------- */
function viewGalerie(){
  let html = '<div class="page-head"><h2>Recettes</h2><span class="count">' + db.recettes.length + '</span></div>';
  if(!db.recettes.length) return html + accueilVide();
  html += barreRecherche();
  if(state.frigo) return html + resultatsFrigo();

  const list = filtrer(db.recettes);
  const n = list.length;
  html += '<div class="fbar" style="margin-top:14px"><span class="count">' + n + ' recette' + (n > 1 ? "s" : "") +
    (n !== db.recettes.length ? " sur " + db.recettes.length : "") + '</span>' +
    '<select class="tri-sel" id="tri" aria-label="Trier">' + TRIS.map(([v, l]) =>
      '<option value="' + v + '"' + (state.tri === v ? " selected" : "") + '>' + l + '</option>').join("") + '</select></div>';

  if(!n) return html + '<div class="empty"><span class="big">🍋</span>Aucune recette ne correspond.' +
    '<div class="actions" style="justify-content:center"><button class="btn sm" id="clear-filters">Tout effacer</button></div></div>';

  if(state.tri !== "categorie") return html + '<div style="margin-top:12px">' + grille(list) + '</div><div style="height:20px"></div>';

  // groupement par Meal Type
  const groupes = MEALS.map(m => [m, list.filter(r => r.meal === m)]);
  const sans = list.filter(r => !r.meal || MEALS.indexOf(r.meal) < 0);
  if(sans.length) groupes.push(["Sans catégorie", sans]);
  groupes.forEach(([m, rs]) => {
    if(!rs.length) return;
    html += '<div class="section"><div class="section-head"><h3>' + (MEAL_EMO[m] || "🍳") + " " + esc(m) +
      '</h3><span class="count">' + rs.length + '</span></div>' + grille(rs) + '</div>';
  });
  return html + '<div style="height:20px"></div>';
}

function resultatsFrigo(){
  const termes = termesFrigo(state.q);
  if(!termes.length){
    return '<div class="empty"><span class="big">🥕</span>Tape ce que tu as sous la main, séparé par des virgules.' +
      '<br><span class="hint">Les recettes qui en utilisent le plus remontent en premier.</span></div>';
  }
  const res = db.recettes.filter(r => r.statut !== ARCHIVE)
    .map(r => ({r: r, s: scoreFrigo(r, termes)})).filter(x => x.s.n > 0)
    .sort((a,b) => (b.s.n - a.s.n) || (a.s.autres - b.s.autres) || (b.r.note - a.r.note));
  if(!res.length) return '<div class="empty"><span class="big">🤷</span>Aucune recette n\'utilise ' + esc(termes.join(", ")) + '.</div>';
  return '<div class="fbar" style="margin-top:14px"><span class="count">' + res.length + ' recette' + (res.length > 1 ? "s" : "") +
    ' avec ' + esc(termes.join(", ")) + '</span></div>' +
    '<div class="grid" style="margin-top:12px">' + res.map(x => carte(x.r, {badge:
      '<div class="match' + (x.s.n < x.s.total ? " part" : "") + '">✓ ' + x.s.n + '/' + x.s.total +
      (x.s.autres ? ' · +' + x.s.autres + ' autre' + (x.s.autres > 1 ? "s" : "") : "") + '</div>'})).join("") +
    '</div><div style="height:20px"></div>';
}

/* ---------- planning ---------- */
function navSemaine(sem, attr){

  return '<div class="weeknav">' +
    '<button type="button" class="round" ' + attr + '="-1" title="Semaine précédente">' + ico("gauche") + '</button>' +

    '="0">Revenir à cette semaine</button></div>' : "");

function stepper(val, moins, plus, big){
  return '<div class="stepper' + (big ? " big" : "") + '"><button type="button" ' + moins + ' title="Moins">−</button>' +
    '<span class="stepper-val">' + val + '</span><button type="button" ' + plus + ' title="Plus">+</button></div>';
}

function viewPlanning(){
  const sem = state.semPlan || (state.semPlan = semaineCourante());
  const cur = semaineCourante(), auj = aujourdhui();
  const entrees = entreesSemaine(sem);
  const nPortions = entrees.reduce((t, e) => t + (e.portions || 0), 0);

  let html = '<div class="page-head"><h2>Planning</h2>' +
    '<button type="button" class="round" data-act="pl-menu" title="Options de la semaine">' + ico("plus3", "plein") + '</button></div>' +
    navSemaine(sem, "data-semnav");

  if(!entrees.length){
    html += '<div class="panel" style="margin-top:14px; text-align:center">' +
      '<div style="font-size:38px">🗓</div><b>Semaine vide pour l\'instant</b>' +
      '<p class="hint" style="margin:4px auto 14px; max-width:380px">Ajoute un repas jour par jour, ou laisse l\'app te proposer une semaine ' +
      'à partir de tes recettes préférées, de saison et pas faites récemment.</p>' +
      '<div class="actions" style="justify-content:center; margin:0">' +
        (sem >= cur ? '<button class="btn primary" data-act="pl-auto">✨ Proposer une semaine</button>' : "") +
        '<button class="btn" data-go="recettes">Parcourir mes recettes</button></div></div>';
  }else{
    const restants = articlesRestants(sem);
    html += '<div class="panel plan-sum">' +
      '<div style="flex:1 1 100%"><b>' + entrees.length + ' repas · ' + nPortions + ' portion' + (nPortions > 1 ? "s" : "") + '</b>' +
      '<div class="hint" style="margin:2px 0 0">' + (restants ? "🧺 " + restants + " article" + (restants > 1 ? "s" : "") + " à acheter"
        : "🧺 Liste de courses à jour") + '</div></div>' +
      '<button class="btn" data-act="pl-courses">🧺 Courses</button>' +
      (sem >= cur ? '<button class="btn" data-act="pl-auto" title="Remplir les jours vides">✨ Compléter</button>' : "") +
    '</div>';
  }

  for(let j = 0; j < 7; j++){
    const d = ajouterJours(sem, j);
    const es = entrees.filter(e => e.jour === j);
    const passe = d < auj;
    html += '<section class="day' + (passe ? " passe" : "") + (d === auj ? " auj" : "") + '">' +
      '<div class="day-head"><h4>' + JOURS[j] + '</h4><span class="date">' + dateCourte(d) + '</span>' +
        (d === auj ? '<span class="pill-auj">Aujourd\'hui</span>' : "") +
        (es.length || passe ? '<button type="button" class="voir" data-addday="' + j + '">+ Ajouter</button>' : "") + '</div>' +
      (es.length ? es.map(ligneRepas).join("")
        : passe ? '<div class="day-none">Rien de noté</div>'
        : '<button type="button" class="day-add" data-addday="' + j + '">+ Ajouter un repas</button>') +
    '</section>';
  }
  const sans = entrees.filter(e => e.jour < 0);
  html += '<section class="day"><div class="day-head"><h4>📌 Sans jour précis</h4><span class="date"></span>' +
    '<button type="button" class="voir" data-addday="-1">+ Ajouter</button></div>' +
    (sans.length ? sans.map(ligneRepas).join("")
      : '<p class="hint" style="margin:0">Pour les recettes à caser dans la semaine : leurs ingrédients vont quand même dans la liste de courses.</p>') +
    '</section>';
  return html + '<div style="height:24px"></div>';
}

function viewCycle(){
  const c = state.cycle;
  const P = phaseInfo(c);
  const notes = db.cycleNotes[c] || "";
  const ali = alimentsDeLaPhase(c);
  const list = db.recettes.filter(r => pertinencePhase(r, c) > 0)
    .sort((a,b) => pertinencePhase(b, c) - pertinencePhase(a, c) || a.nom.localeCompare(b.nom,"fr"));

  const fiche = [["Durée", P.duree], ["Hormones", P.hormones]]
    .concat(PHASE_CHAMPS.filter(([k]) => P[k]).map(([k, lbl]) => [lbl, P[k]]));

  let html = '<div class="page-head"><h2>Cycle</h2></div><div class="qchips" style="margin-top:8px">' +
    CYCLES.map(x => '<button type="button" class="chip' + (x === c ? " on" : "") + '" data-cycle="' + esc(x) + '">' +
      CYCLE_EMO[x] + " " + esc(x) + '</button>').join("") + '</div>' +
    '<div class="phase-hero" style="margin-top:18px">' +
      '<span class="cycle-emo">' + P.emo + '</span>' +
      '<div style="flex:1"><h2>Phase ' + esc(c.toLowerCase()) + '</h2>' +
      '<div class="hint" style="margin:2px 0 0">' + esc(P.duree) + ' · ' + esc(P.hormones) + '</div></div>' +
      '<button class="btn sm' + (actuelle ? " primary" : "") + '" data-setphase="' + esc(c) + '">' +
        (actuelle ? "✓ Ma phase" : "C'est ma phase") + '</button>' +
    '</div>';

  html += '<div class="panel" style="margin-top:14px"><div class="repere">' +
    fiche.map(([k,v]) => '<div><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>').join("") +
    '</div></div>';

  if(P.physio) html += '<div class="panel"><div class="section-head"><h3>Physiologie</h3></div>' +
    '<p class="txt">' + esc(P.physio) + '</p></div>';
  if(P.manger) html += '<div class="panel"><div class="section-head"><h3>Quoi manger</h3></div>' +
    '<p class="txt">' + esc(P.manger) + '</p></div>';
  if(!P.physio && !P.manger && !ali.length){
    html += '<div class="notice">Cette phase n\'a pas encore de contenu. ' +
      'Ajoute tes propres repères et rattache des aliments depuis ⚙ Réglages → Food Cycling.</div>';
  }

  // aliments à privilégier : uniquement ceux propres à la phase
  const parCat = {};
  ali.forEach(a => (parCat[a.cat] = parCat[a.cat] || []).push(a));
  html += '<div class="section"><div class="section-head"><h3>Aliments à privilégier</h3>' +
    '<span class="count">' + ali.length + '</span></div><div class="panel">' +
    Object.keys(CAT_LBL).filter(k => parCat[k]).map(k =>
      '<div class="field"><label>' + esc(CAT_LBL[k]) + '</label><div class="chips">' +
      parCat[k].sort((a,b) => a.fr.localeCompare(b.fr,"fr")).map(a => pastilleAliment(a)).join("") +
      '</div></div>').join("") +
    '<p class="hint">🟢 IG bas · 🟡 IG moyen · 🔴 IG élevé · 🌱 à acheter bio (Dirty Dozen) · ✓ ok non bio (Clean Fifteen)</p>' +
    '</div></div>';

  html += '<div class="panel"><div class="field" style="margin:0">' +
      '<label>Mes notes — quoi privilégier / éviter</label>' +
      '<textarea class="note-area" id="cycle-notes" placeholder="Ce que je veux manger pendant cette phase, ce qui me fait du bien, ce que j\'évite…">' + esc(notes) + '</textarea>' +
      '<div class="fbar"><span class="hint" id="notes-state">Enregistré automatiquement</span>' +
      '<button class="btn sm" id="save-notes">Enregistrer</button></div>' +

/* ---------- vue Courses ---------- */
function viewCourses(){
  const sem = state.semCourses || (state.semCourses = semaineCoursesParDefaut());
  const C = coursesDe(sem);
  const groupes = construireCourses(sem);
  const entrees = entreesSemaine(sem);
  const lignes = groupes.reduce((t, g) => t.concat(g.lignes), []);
  const nLignes = lignes.length;
  const nCochees = lignes.filter(L => C.coches[L.cle]).length;

  let html = '<div class="page-head"><h2>Courses</h2></div>' + navSemaine(sem, "data-semcourses");

  if(entrees.length){
    html += '<div class="pour">' + entrees.map(e => {
      const r = getRecette(e.rid);
      return '<span class="pour-r" data-open-entree="' + e.id + '">' + vignette(r, "pt") +
        '<span>' + esc(r.nom) + ' · ' + e.portions + ' p.</span></span>';
    }).join("") + '</div>';
  }

  if(nLignes) html += '<div id="courses-prog">' + progressionCourses(nCochees, nLignes) + '</div>';

  html += '<div class="addline"><input id="course-new" placeholder="Ajouter un article (ex. 2 citrons)" enterkeyhint="done" autocomplete="off">' +
    '<button type="button" class="btn" id="add-course">' + ico("plus", "sm") + '</button></div>';

  if(!nLignes && !groupes.placard.length){
    return html + '<div class="empty"><span class="big">🛒</span>' +
      (entrees.length ? 'Tout est retiré de la liste.' : 'Rien à acheter pour l\'instant.<br>Planifie des repas : leurs ingrédients arrivent ici, additionnés et rangés par rayon.') +
      '<div class="actions" style="justify-content:center"><button class="btn primary" data-go="planning">🗓 Ouvrir le planning</button></div></div>';
  }

  groupes.forEach(g => {
    // ce qui reste à prendre d'abord, le panier ensuite
    const ordre = g.lignes.filter(L => !C.coches[L.cle]).concat(g.lignes.filter(L => C.coches[L.cle]));
    html += '<div class="section"><div class="section-head"><h3>' + esc(g.rayon) + '</h3>' +
      '<span class="count">' + g.lignes.length + '</span></div><div class="panel"><ul class="ing">' +
      ordre.map(L => ligneCourse(L, C, false)).join("") + '</ul></div></div>';
  });

  if(groupes.placard.length){
    html += '<details class="placard"><summary>🏠 Dans mes placards (' + groupes.placard.length + ')</summary>' +
      '<p class="hint" style="margin:6px 0 10px">Ce que j\'ai toujours chez moi : pas compté dans la liste. Vérifie quand même qu\'il en reste.</p>' +
      '<div class="panel"><ul class="ing">' + groupes.placard.map(L => ligneCourse(L, C, true)).join("") + '</ul></div></details>';
  }

  html += '<div class="actions" style="margin-top:20px">' +
    '<button class="btn" id="share-courses">' + ico("partager", "sm") + ' Partager la liste</button>' +
    (nCochees ? '<button class="btn ghost" id="reset-courses">Tout décocher</button>' : "") + '</div>';
  return html + '<div style="height:30px"></div>';
}

function progressionCourses(n, total_){
  const fini = n === total_;
  return '<div class="prog-row"><span>' + (fini ? "<b>✓ Tout est dans le panier</b>" : "<b>" + n + "</b> sur " + total_ + " dans le panier") +
    '</span><span>' + Math.round(100 * n / total_) + ' %</span></div>' +
    '<div class="prog' + (fini ? " ok" : "") + '"><i style="width:' + (100 * n / total_) + '%"></i></div>';
}

function ligneCourse(L, C, placard){
  const q = afficheQte(L);
  const coche = !placard && !!C.coches[L.cle];
  return '<li data-course="' + esc(L.cle) + '" class="' + (coche ? "done" : "") + '"' + (placard ? ' data-placard="1"' : "") + '>' +
    (placard ? '<span class="box" style="border-style:dashed">🏠</span>' : '<span class="box">✓</span>') +
    '<span style="flex:1"><b>' + esc(L.nom) + '</b>' + (q ? ' <span class="qte">' + esc(q) + '</span>' : "") +
    (L.ali && L.ali.pest === "D" ? '<span class="tagali bio">bio</span>' : "") +
    (L.alg ? '<span class="alg" style="margin-left:6px">allergène</span>' : "") +
    (L.recettes.length ? '<span class="src">' + esc(L.recettes.join(" · ")) + '</span>' : "") +
    (L.details && L.details.length ? L.details.map(d =>
      '<span class="src-detail">' + esc(d.texte) + (d.qte ? " · " + esc(d.qte) : "") + " — " + esc(d.recette) + '</span>'
    ).join("") : "") +
    '</span>' +
    '<button class="mini" data-coursemenu="' + esc(L.cle) + '" title="Options">⋯</button>' +
    '</li>';
}

/* met à jour la progression sans tout redessiner : cocher un
   article ne doit pas faire sauter le défilement de la liste */
function majProgressionCourses(){
  const sem = state.semCourses;
  const C = coursesDe(sem);
  const lignes = construireCourses(sem).reduce((t, g) => t.concat(g.lignes), []);
  const n = lignes.filter(L => C.coches[L.cle]).length, tot = lignes.length;
  const box = document.getElementById("courses-prog");
  if(box && tot) box.innerHTML = progressionCourses(n, tot);
  renderTabbar();
}

function texteCourses(sem){
  const C = coursesDe(sem);
  const groupes = construireCourses(sem);
  const reste = L => !C.coches[L.cle];
  const tout = !groupes.some(g => g.lignes.some(reste));   // tout coché : on partage quand même la liste entière
  return "🧺 Courses — " + libSemaine(sem) + "\n\n" + groupes.map(g => {
    const ls = g.lignes.filter(L => tout || reste(L));
    if(!ls.length) return "";
    return g.rayon + "\n" + ls.map(L => { const q = afficheQte(L); return "• " + L.nom + (q ? " — " + q : ""); }).join("\n");
  }).filter(Boolean).join("\n\n");
}

function trouverLigneCourses(cle, sem){
  const g = construireCourses(sem);
  return g.reduce((f, x) => f || x.lignes.find(L => L.cle === cle), null) || g.placard.find(L => L.cle === cle) || null;
}

function libellePlacard(cle){
  if(db.placardNoms[cle]) return db.placardNoms[cle];
  if(cle.indexOf("a:") === 0){
    const a = ALIMENTS.find(x => x.en === cle.slice(2));
    return a ? (a.fr || a.en) : cle.slice(2);
  }
  return cle.slice(2);
}

const GI_CHOIX   = [["","Non renseigné"], ["L","🟢 IG bas"], ["M","🟡 IG moyen"], ["H","🔴 IG élevé"]];
const PEST_CHOIX = [["","Non renseigné"], ["D","🌱 À acheter bio"], ["C","✓ Ok non bio"]];

function viewAliments(){
  const q = (state.qAli || "").trim().toLowerCase();

  let liste = ALIMENTS.slice();

  if(f === "__perso")      liste = liste.filter(a => a.perso);
  else if(f === "__bio")   liste = liste.filter(a => a.pest === "D");

    '<p class="hint" style="margin:0 0 12px">Index glycémique, repère bio, catégorie, noms et synonymes. ' +
    'Touche un aliment pour le modifier.' +
    (db.fc.actif ? ' Les phases du cycle se règlent au même endroit.' : '') + '</p>';

  html += '<div class="searchbar" style="margin-top:0"><input id="q-ali" type="search" ' +
    'placeholder="Chercher un aliment…" value="' + esc(state.qAli || "") + '"></div>';

  const filtres = [["","Tous"]]
    .concat(Object.keys(CAT_LBL).map(k => [k, CAT_LBL[k]]))
    .concat([["__bio","🌱 Bio conseillé"], ["__sansIG","Sans IG"], ["__perso","Ajoutés par moi"]])
    .concat(db.fc.actif ? CYCLES.map(c => [c, PHASES_BASE[c].emo + " " + c]).concat([["__sansPhase","Sans phase"]]) : []);
  html += '<div class="chips" style="margin:10px 0 4px">' +

    '<span class="hint">' + liste.length + ' affiché' + (liste.length > 1 ? "s" : "") + '</span></div>';

  if(!liste.length) return html + '<div class="empty"><span class="big">🥬</span>Aucun aliment ne correspond.</div>';

  html += '<div class="panel" style="margin-top:10px">' +
    liste.slice(0, 250).map(a => ligneAliment(a)).join("") + '</div>';
  if(liste.length > 250) html += '<p class="hint">250 premiers affichés — affine la recherche.</p>';
  return html + '<div style="height:30px"></div>';
}

function viewFiche(){
  const r = getRecette(state.ficheId);
  if(!r) return '<div class="empty">Recette introuvable.<div class="actions" style="justify-content:center">' +
    '<button class="btn" id="back">‹ Retour</button></div></div>';

  const f = facteurFiche(r);
  const fav = estFavori(r);
  const cur = semaineCourante();
  const prevus = db.plan.filter(e => e.rid === r.id && e.sem >= cur)
    .sort((a,b) => (a.sem < b.sem ? -1 : a.sem > b.sem ? 1 : a.jour - b.jour));

  const pills = []
    .concat(r.statut ? ['<span class="pill">' + esc(r.statut) + '</span>'] : [])
    .concat(r.meal ? ['<span class="pill acc">' + (MEAL_EMO[r.meal]||"") + " " + esc(r.meal) + '</span>'] : [])
    .concat(r.cuisines.filter(c => normLibelle(c) !== "favorite").map(c => '<span class="pill">' + esc(c) + '</span>'))
    .concat(r.tags.map(c => '<span class="pill">🏷 ' + esc(c) + '</span>'))
    .concat(r.seasons.map(c => '<span class="pill">' + esc(c) + '</span>'))
    .concat(db.fc.actif ? r.cycles.map(c => '<span class="pill acc">' + (CYCLE_EMO[c]||"") + " " + esc(c) + '</span>') : []);

  let html = '<div class="fiche-hero">' +
    (r.image ? '<img src="' + esc(r.image) + '" alt="">' : '<span>' + (MEAL_EMO[r.meal] || "🍳") + '</span>') +
    '<div class="ov">' +
      '<button class="ov-btn" id="back" title="Retour" aria-label="Retour">' + ico("gauche") + '</button><span class="sp"></span>' +
      '<button class="ov-btn' + (fav ? " fav" : "") + '" data-fav="' + r.id + '" title="' + (fav ? "Retirer des favoris" : "Ajouter aux favoris") + '">' +
        ico("coeur", fav ? "rempli" : "") + '</button>' +
      '<button class="ov-btn" id="share" title="Partager">' + ico("partager") + '</button>' +
      '<button class="ov-btn" data-act="fi-menu" title="Plus d\'options">' + ico("plus3", "plein") + '</button>' +
    '</div></div>';

  html += '<div class="fiche-head">' +
    '<h1 class="fiche-title">' + esc(r.nom) + '</h1>' +
    '<div class="fiche-sub">' + noteCliquable(r, false) + '<span>' + esc(libCuisinee(r)) + '</span></div>';

  const metas = [];
  if(total(r)) metas.push("⏱ " + fmtMin(total(r)) + (r.prep && r.cuisson ? ' <span class="count">(' + fmtMin(r.prep) + ' + ' + fmtMin(r.cuisson) + ')</span>' : ""));
  if(r.diff) metas.push(esc(r.diff));
  if(r.kcal) metas.push("🔥 " + r.kcal + " kcal");
  if(r.prot) metas.push("💪 " + r.prot + " g prot.");
  if(metas.length) html += '<div class="metas">' + metas.map(m => '<span class="meta">' + m + '</span>').join("") + '</div>';

  html += '<div class="cta-row">' +
    '<button class="cta" id="cook">' + ico("play", "plein") + ' Commencer à cuisiner</button>' +
    '<button class="cta second' + (prevus.length ? " on" : "") + '" data-plan="' + r.id + '" title="Planifier" aria-label="Planifier">' + ico("calendrier") + '</button>' +
  '</div>';
  if(prevus.length){
    html += '<div class="plan-info">🗓 Au planning : ' + prevus.map(e =>
      (e.sem === cur ? "" : libRelatif(e.sem).toLowerCase() + ", ") + libJour(e.sem, e.jour).toLowerCase() +
      (e.fait ? " ✓" : "")).join(" · ") + '</div>';

  if(r.url) html += '<div style="margin-top:8px; font-size:14px"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">🔗 Voir la source</a></div>';
  if(pills.length) html += '<div style="margin-top:12px">' + pills.join("") + '</div>';
  html += '</div>';

  // ingrédients, à l'échelle des portions choisies + reconnaissance des aliments de la phase
  if(r.ingredients.length){
    const ph = db.fc.actif ? db.phaseActuelle : "";
    const trouves = alimentsDeRecette(r, ph);
    const parIng = {};
    trouves.forEach(t => parIng[t.k] = t);
    const n = ph ? trouves.filter(t => t.pertinent).length : 0;
    const rattachee = ph && r.cycles.indexOf(ph) >= 0;
    const coches = r.ingredients.some((i, k) => state.checked[r.id + "-" + k]);

    html += '<div class="section"><div class="section-head"><h3>Ingrédients</h3><span class="count">' +
      r.ingredients.length + '</span></div>' +
      (ph ? '<div class="notice" style="margin-bottom:12px">' + PHASES_BASE[ph].emo + ' ' +
        (rattachee ? '<b>Recette de ta phase ' + esc(ph.toLowerCase()) + '</b>' + (n ? ' · ' : '.') : "") +
        (n ? '<b>' + n + ' ingrédient' + (n>1?"s":"") + '</b> adapté' + (n>1?"s":"") + ' à ta phase' + (rattachee ? "" : " " + esc(ph.toLowerCase())) + '.'
           : rattachee ? "" : '<b>0 ingrédient</b> adapté à ta phase ' + esc(ph.toLowerCase()) + ' — cette recette n\'est pas particulièrement ciblée.') +
        '</div>' : "") +
      '<div class="panel">' + barrePortions(r) + '<ul class="ing">' +
      r.ingredients.map((i, k) => {
        const t = db.fc.actif ? parIng[k] : null;
        const a = t ? t.ali : null;
        let badges = "";
        if(a){
          const cible = ph && a.phases.indexOf(ph) >= 0;
          badges += '<span class="tagali' + (cible ? " cible" : "") + '" title="' + esc(a.en + " · " + CAT_LBL[a.cat]) + '">' +
            (cible ? PHASES_BASE[ph].emo + " " : "") + esc(a.fr) + '</span>';
          if(a.gi) badges += '<span class="tagali gi' + a.gi + '">' + esc(GI_LBL[a.gi]) + '</span>';
          if(a.pest === "D") badges += '<span class="tagali bio">bio conseillé</span>';
        }
        return '<li data-ing="' + k + '" class="' + (state.checked[r.id + "-" + k] ? "done" : "") + '">' +
          '<span class="box">✓</span><span>' + ligneIngHTML(i.txt, f) + badges + '</span>' +
          (i.alg ? '<span class="alg">allergène</span>' : "") + '</li>';
      }).join("") +
      '</ul><div class="actions" style="margin-top:12px">' +
        '<button class="btn sm" id="to-courses">🧺 Ajouter aux courses</button>' +
        (coches ? '<button class="btn sm ghost" id="uncheck-ings">Tout décocher</button>' : "") +

  // étapes
  if(r.etapes.length){
    html += '<div class="section"><div class="section-head"><h3>Préparation</h3><span class="count">' +

      '<div class="stat"><b>' + (r.kcal||0) + '</b><span>kcal</span></div>' +

      '<div class="stat"><b>' + (r.lip||0) + ' g</b><span>Lipides</span></div>' +
      '</div></div></div>';
  }

  // mes notes : ce que j'ai changé, pour la prochaine fois
  html += '<div class="section"><div class="section-head"><h3>📝 Mes notes</h3></div><div class="panel">' +
    '<textarea id="notes-perso" style="min-height:90px" placeholder="Mes ajustements : moins de sel, 5 min de cuisson en plus, à servir avec…">' +
      esc(r.notesPerso) + '</textarea>' +

      (r.allergenes ? '<div class="field"><label>Allergènes</label>' + esc(r.allergenes) + '</div>' : "") +

      (r.groupe ? '<div class="field" style="margin-bottom:0"><label>Groupe alimentaire</label>' + esc(r.groupe) + '</div>' : "") +

  html += '<div class="fiche-foot">' +
    '<button class="btn" id="edit">✎ Modifier</button>' +
    '<button class="btn" id="dup">⧉ Dupliquer</button>' +
    '<button class="btn danger" id="del">Supprimer</button>' +
  '</div>';
  return html + '<div style="height:30px"></div>';
}

/* étoiles qu'on touche pour noter, sur la fiche comme à la fin du mode cuisine */
function noteCliquable(r, grand){
  return '<span class="rate' + (grand ? " big" : "") + '" title="Ma note">' + [1,2,3,4,5].map(n =>
    '<button type="button" data-rate="' + n + '" class="' + (r.note >= n ? "on" : "") + '" aria-label="' + n + ' étoile' + (n>1?"s":"") + '">★</button>').join("") +

function barrePortions(r){
  if(r.portions){
    const p = portionsFiche(r);
    return '<div class="portions-bar"><div><b>' + p + ' portion' + (p > 1 ? "s" : "") + '</b>' +
      '<div class="hint-scale">' + (p !== r.portions
        ? 'Recette pour ' + r.portions + ' · <button type="button" class="voir" id="portions-reset">rétablir</button>'
        : 'Touche + ou − : les quantités suivent') + '</div></div>' +
      stepper(p, 'data-fp-moins="' + r.id + '"', 'data-fp-plus="' + r.id + '"', true) + '</div>';
  }
  const m = state.mult[r.id] || 1;
  return '<div class="portions-bar"><div><b>Quantités ×' + joliNombre(m) + '</b>' +
    '<div class="hint-scale">Indique les portions de la recette (✎ Modifier) pour ajuster par personne</div></div>' +
    stepper("×" + joliNombre(m), 'data-fm-moins="' + r.id + '"', 'data-fm-plus="' + r.id + '"', true) + '</div>';
}

/* la recette en texte, pour l'envoyer à quelqu'un (quantités à l'échelle choisie) */
function texteRecette(r){
  const f = facteurFiche(r);
  const lignes = [r.nom];
  if(r.portions) lignes.push("Pour " + portionsFiche(r) + " portion" + (portionsFiche(r) > 1 ? "s" : ""));
  if(total(r)) lignes.push("⏱ " + fmtMin(total(r)));
  if(r.ingredients.length) lignes.push("", "Ingrédients", ...r.ingredients.map(i => "• " + ajusterLigne(i.txt, f).txt));
  if(r.etapes.length) lignes.push("", "Préparation", ...r.etapes.map((e, k) => (k + 1) + ". " + e));
  if(r.url) lignes.push("", r.url);
  return lignes.join("\n");
}
function partager(titre, texte, msgCopie){
  if(navigator.share){
    navigator.share({title: titre, text: texte}).catch(e => { if(e && e.name !== "AbortError") copier(texte, msgCopie); });
  }else copier(texte, msgCopie);
}

  (local ? '<p class="hint" style="margin:0 0 30px">ℹ️ Cette app est ouverte depuis un fichier local : le bookmarklet copie la recette dans le presse-papiers plutôt que d\'ouvrir l\'app directement. ' +
    'Si tu l\'héberges un jour à une adresse http(s), l\'ouverture devient automatique.</p>' : '<div style="height:20px"></div>');
}

  d.kcal = num(v("in-kcal")); d.prot = num(v("in-prot")); d.gluc = num(v("in-gluc")); d.lip = num(v("in-lip"));
  d.allergenes = v("in-allergenes").trim();

  })).filter(i => i.txt);

function saveRecette(){
  syncDraft();
  const d = state.formDraft;
  if(!d.nom){ toast("Donne au moins un nom à la recette"); const el = $("#in-nom"); if(el) el.focus(); return; }
  const edition = !!d.id && !!getRecette(d.id);
  if(edition){
    const i = db.recettes.findIndex(r => r.id === d.id);
    db.recettes[i] = normalize(Object.assign({}, db.recettes[i], d, {maj: Date.now()}));
  }else{
    d.id = d.id || uid();
    db.recettes.push(normalize(Object.assign({}, d, {cree:Date.now(), maj:Date.now()})));
    if(d.semaine && !estPlanifiee(getRecette(d.id))) planifier(d.id, semaineCourante(), -1);
  }
  if(!save()) return;   // le bandeau explique ; on reste sur le formulaire
  toast("Recette enregistrée ✓");
  const id = d.id;
  state.formDraft = null;
  // modifiée depuis sa fiche : on y revient plutôt que d'empiler une seconde fiche
  const prec = pile[pile.length - 1];
  if(edition && prec && prec.view === "fiche" && prec.ficheId === id) retour();
  else remplacer("fiche", {ficheId: id});
}

/* ---------- parsing du texte collé ---------- */
function parseTexte(txt){
  const d = vide();
  const lines = txt.replace(/\r/g,"").split("\n").map(l => l.trim());
  const isIngHead = l => /^(ingr[ée]dients?|ingredients?)\b/i.test(l);
  const isStepHead = l => /^(pr[ée]paration|instructions?|[ée]tapes?|m[ée]thode|method|directions?|r[ée]alisation|pr[ée]parer)\b/i.test(l);

  let mode = "head", nom = "", ings = [], steps = [];
  for(let raw of lines){
    const l = raw;
    if(!l) continue;
    const url = l.match(/https?:\/\/\S+/);
    if(url && !d.url){ d.url = url[0]; if(/^https?:\/\/\S+$/.test(l)) continue; }

    let m = l.match(/pr[ée]paration\s*:?\s*(\d+)\s*(?:min|mn|minutes)/i);
    if(m){ d.prep = num(m[1]); continue; }
    m = l.match(/(?:cuisson|cook(?:ing)?\s*time)\s*:?\s*(\d+)\s*(?:min|mn|minutes)?/i);
    if(m){ d.cuisson = num(m[1]); continue; }
    m = l.match(/(?:pour|serves?|portions?|parts?)\s*:?\s*(\d+)\s*(?:personnes?|pers\.?|portions?|parts?)?/i);
    if(m && num(m[1]) > 0 && num(m[1]) < 30 && /personne|portion|part|serve|pour/i.test(l)){ d.portions = num(m[1]); continue; }

    if(isIngHead(l)){ mode = "ing"; continue; }
    if(isStepHead(l)){ mode = "step"; continue; }

    if(mode === "head"){
      if(!nom){ nom = l.replace(/^#+\s*/,""); continue; }
      // heuristique : ligne qui ressemble à un ingrédient
      if(/^[-•*·]|^\d+([.,]\d+)?\s*(g|kg|ml|cl|l|c\.|cs|cc|cuill|tbsp|tsp|oz|lb|pcs?)\b/i.test(l)){ mode = "ing"; ings.push(l); continue; }
      if(l.length > 90){ mode = "step"; steps.push(l); continue; }
      continue;
    }
    if(mode === "ing"){
      if(l.length > 140){ mode = "step"; steps.push(l); continue; }
      ings.push(l);
    }else{
      steps.push(l);
    }
  }
  // un « titre » de 200 caractères n'en est pas un (JSON collé, paragraphe entier…)
  d.nom = (nom && nom.length <= 160) ? nom : "Sans titre";
  d.ingredients = ings.map(t => ({ txt: t.replace(/^[-•*·]\s*/,"").trim(), alg:false })).filter(i => i.txt);
  if(!d.ingredients.length) d.ingredients = [{txt:"",alg:false}];
  d.etapes = steps.map(s => s.replace(/^\s*(?:\d+\s*[.)-]|[-•*·])\s*/,"").trim()).filter(Boolean);
  return d;
}

/* ---------- extraction schema.org / Recipe (JSON-LD) ---------- */
function ldFirst(x){ return (x && typeof x !== "string" && x.length) ? x[0] : x; }

function ldTexte(x){
  if(x == null) return "";
  if(typeof x === "string") return x.replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
  if(typeof x === "number") return String(x);
  if(Array.isArray(x)) return ldTexte(x[0]);
  if(x.text) return ldTexte(x.text);
  if(x.name) return ldTexte(x.name);
  return "";
}

/* comme ldTexte, mais conserve les retours à la ligne (une étape en contient souvent plusieurs) */
function ldTexteMulti(x){
  if(x == null) return "";
  if(typeof x === "number") return String(x);
  if(typeof x === "string"){
    return x.replace(/<br\s*\/?>/gi, "\n")
            .replace(/<\/(p|li|div|h[1-6])>/gi, "\n")
            .replace(/<[^>]*>/g, " ")
            .replace(/&nbsp;/g, " ")
            .replace(/[ \t ]+/g, " ")
            .replace(/ *\n+ */g, "\n")
            .trim();
  }
  if(Array.isArray(x)) return ldTexteMulti(x[0]);
  if(x.text != null) return ldTexteMulti(x.text);
  if(x.name) return ldTexteMulti(x.name);
  return "";
}
function ldLignes(s){ return String(s || "").split("\n").map(l => l.trim()).filter(Boolean); }
/* titre de section utile ? « Get started » oui, « Step 2 » non */
function ldTitre(n){
  const t = ldTexte(n);
  return (t && !/^(step|[ée]tape|instructions?)\s*\d*$/i.test(t)) ? t : "";
}

/* aplatit recipeInstructions : string | [string] | [HowToStep] | [HowToSection] */
function ldListe(x){
  if(!x) return [];
  if(typeof x === "string") return ldLignes(ldTexteMulti(x));
  if(!Array.isArray(x)) x = [x];
  let out = [];
  x.forEach(e => {
    let lignes, titre = "";
    if(e && e.itemListElement){ lignes = ldListe(e.itemListElement); titre = ldTitre(e.name); }
    else {
      lignes = ldLignes(ldTexteMulti(e && e.text != null ? e.text : e));
      titre = (e && typeof e === "object") ? ldTitre(e.name) : "";
    }
    if(!lignes.length && titre) lignes = [titre];
    else if(titre && lignes.length && lignes[0].toLowerCase() !== titre.toLowerCase()){
      lignes[0] = titre + " — " + lignes[0];
    }
    out = out.concat(lignes);
  });
  return out;
}

function ldImage(x){
  if(!x) return "";
  if(typeof x === "string") return x;
  if(Array.isArray(x)) return ldImage(x[0]);
  if(x.url) return ldImage(x.url);
  return "";
}

/* PT1H30M / PT45M → minutes */
function ldDuree(s){
  if(!s) return 0;
  if(typeof s === "number") return s;
  const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(String(s).trim());
  if(!m) return num(String(s).match(/\d+/));
  return num(m[1])*1440 + num(m[2])*60 + num(m[3]);
}
function ldNombre(x){
  if(x == null) return 0;
  const m = String(ldFirst(x)).replace(",", ".").match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}

/* cherche récursivement un objet @type Recipe (gère tableaux et @graph) */
function ldTrouverRecette(node, prof){
  prof = prof || 0;
  if(!node || prof > 8) return null;
  if(Array.isArray(node)){
    for(const n of node){ const r = ldTrouverRecette(n, prof+1); if(r) return r; }
    return null;
  }
  if(typeof node !== "object") return null;
  const t = node["@type"];
  if(t && (t === "Recipe" || (Array.isArray(t) && t.indexOf("Recipe") >= 0))) return node;
  if(node["@graph"]) return ldTrouverRecette(node["@graph"], prof+1);
  for(const k of ["mainEntity","mainEntityOfPage","itemListElement","hasPart"]){
    if(node[k]){ const r = ldTrouverRecette(node[k], prof+1); if(r) return r; }
  }
  return null;
}

/* objet Recipe (ou payload du bookmarklet) → brouillon de formulaire */
function ldVersDraft(R, urlPage){
  const d = vide();
  const nu = R.nutrition || {};
  d.nom      = ldTexte(R.nom || R.name) || "Sans titre";
  const idUrl = String(R["@id"] || "").split("#")[0];
  d.url      = R.url || (idUrl.indexOf("http") === 0 ? idUrl : "") || urlPage || "";
  d.image    = R.image ? ldImage(R.image) : "";
  d.prep     = R.prep != null ? num(R.prep) : ldDuree(R.prepTime);
  d.cuisson  = R.cuisson != null ? num(R.cuisson) : ldDuree(R.cookTime);
  const totalSrc = ldDuree(R.totalTime);

  // Mindful Chef publie son temps TOTAL dans le champ « cookTime » : on rétablit
  if(/mindfulchef\./i.test(d.url) && d.cuisson){
    const vraiTotal = d.cuisson;
    d.cuisson = Math.max(0, vraiTotal - d.prep);
  }
  // garde-fou général : prep + cuisson ne peut pas dépasser un total explicite
  else if(totalSrc && d.prep && d.cuisson && d.prep + d.cuisson > totalSrc && d.prep < totalSrc){
    d.cuisson = totalSrc - d.prep;
  }
  // un seul temps disponible → c'est le temps total, et il ne va jamais dans « cuisson »
  if(!d.prep && !d.cuisson) d.prep = totalSrc;
  d.portions = R.portions != null ? num(R.portions) : ldNombre(R.recipeYield);
  d.kcal = R.kcal != null ? num(R.kcal) : ldNombre(nu.calories);
  d.prot = R.prot != null ? num(R.prot) : ldNombre(nu.proteinContent);
  d.gluc = R.gluc != null ? num(R.gluc) : ldNombre(nu.carbohydrateContent);
  d.lip  = R.lip  != null ? num(R.lip)  : ldNombre(nu.fatContent);

  const ing = R.ingredients || R.recipeIngredient;
  d.ingredients = (Array.isArray(ing) ? ing : ldListe(ing))
    .map(i => typeof i === "string" ? {txt: ldTexte(i), alg:false} : {txt: ldTexte(i.txt || i), alg: !!i.alg})
    .filter(i => i.txt);
  if(!d.ingredients.length) d.ingredients = [{txt:"", alg:false}];

  d.etapes = Array.isArray(R.etapes) ? R.etapes.map(ldTexte).filter(Boolean) : ldListe(R.recipeInstructions);

  // Meal Type depuis recipeCategory
  const cat = ldTexte(ldFirst(R.cat || R.recipeCategory));
  if(cat){
    const hit = MEALS.find(m => m.toLowerCase() === cat.toLowerCase());
    if(hit) d.meal = hit;
    else if(/dessert|sweet/i.test(cat)) d.meal = "Dessert";
    else if(/breakfast|petit.d[ée]j/i.test(cat)) d.meal = "Breakfast";
    else if(/entertain|group|party|f[êe]te|convivial|partager/i.test(cat)) d.meal = "Entertaining";
    else if(/plat|main|dinner|lunch/i.test(cat)) d.meal = "Main course";
    else if(/boisson|drink|beverage|cocktail/i.test(cat)) d.meal = "Beverages";
    else if(/snack|go[ûu]ter|ap[ée]ritif/i.test(cat)) d.meal = "Snacks";
    else if(/accompagnement|side|salade|entr[ée]e/i.test(cat)) d.meal = "Side dish";
  }
  // Cuisine depuis recipeCuisine
  const cui = ldTexte(ldFirst(R.cuis || R.recipeCuisine));
  if(cui){
    const hit = db.cuisines.find(c => normLibelle(c) === normLibelle(cui));
    if(hit) d.cuisines = [hit];
    else { const v = cui.charAt(0).toUpperCase() + cui.slice(1); db.cuisines.push(v); d.cuisines = [v]; save(); }
  }

  d.description = ldTexte(R.desc || R.description);

  // mots-clés, auteur et catégorie → on ne retient que ce qui existe déjà dans mes listes
  const mots = [];
  const kw = R.kw || R.keywords;
  if(kw) String(Array.isArray(kw) ? kw.join(",") : kw).split(/[,;|]/).forEach(k => mots.push(k.trim()));
  const auteur = ldTexte(R.auteur || (R.author && (R.author.name || R.author)));
  if(auteur) mots.push(auteur);
  if(cat && !d.meal) mots.push(cat);   // « Italian » rangé dans Cuisine plutôt que perdu
  mots.filter(Boolean).forEach(m => {
    const t = db.tags.find(x => normLibelle(x) === normLibelle(m));
    if(t && d.tags.indexOf(t) < 0) d.tags.push(t);
    const c = db.cuisines.find(x => normLibelle(x) === normLibelle(m));
    if(c && d.cuisines.indexOf(c) < 0) d.cuisines.push(c);
    const s = SEASONS.find(x => normLibelle(x) === normLibelle(m));
    if(s && d.seasons.indexOf(s) < 0) d.seasons.push(s);
  });
  return d;
}

/* compare des libellés en ignorant casse, emoji et ponctuation : « ❤️ Favorite » ≡ « favorite » */
function normLibelle(s){
  let t = String(s || "").toLowerCase();
  try{ t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
  return t.replace(/[^a-z0-9]+/g, " ").trim();
}

/* point d'entrée unique : JSON-LD, payload bookmarklet, ou texte brut */
function importerContenu(txt){
  const t = (txt || "").trim();
  if(!t) return null;

  // du JSON ne doit JAMAIS finir dans le champ « nom » : on préfère un message clair
  if(t.charAt(0) === "{" || t.charAt(0) === "["){
    let p = null;
    try{ p = JSON.parse(t); }catch(e){ state.erreurImport = "Ce texte ressemble à du JSON mais il est incomplet ou abîmé."; return null; }
    const rec = ldTrouverRecette(p);
    if(rec) return fusionner(ldVersDraft(rec, ""));
    if(Array.isArray(p)){
      state.erreurImport = "On dirait un lot de recettes : utilise plutôt l'onglet ⇪ Import JSON.";
      return null;
    }
    if(p && (p.nom || p.name || p.texte || p.ld)) return payloadVersDraft(p);
    state.erreurImport = "JSON lu, mais aucune recette reconnue dedans.";
    return null;
  }
  // essai : extraire un <script type="application/ld+json"> collé avec du HTML autour
  const m = t.match(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/i);
  if(m){
    try{
      const rec = ldTrouverRecette(JSON.parse(m[1]));
      if(rec) return ldVersDraft(rec, "");
    }catch(e){}
  }
  return parseTexte(t);
}

/* ---------- rattrapage des étapes collées bout à bout ----------
   Les anciennes versions du bookmarklet écrasaient les retours à la ligne :
   « …Drain the prawns Heat the large frying pan… ». On recoupe uniquement là où
   un mot en minuscule est suivi d'un verbe d'action capitalisé — pas au hasard. */
const VERBES_ETAPE = [
"Heat","Meanwhile","When","While","Once","Stir","Add","Cook","Serve","Share","Season","Check",
"Place","Remove","Drain","Mix","Bring","Preheat","Pour","Transfer","In","Roughly","Finely",
"Thinly","Set","Divide","Sprinkle","Garnish","Top","Reduce","Simmer","Boil","Whisk","Fold",
"Chop","Slice","Cut","Peel","Rinse","Cover","Leave","Allow","Repeat","Enjoy","Return","Spoon",
"Scatter","Toss","Taste","Next","Then","Finally","Turn","Lower","Increase","Continue","Warm",
"Melt","Combine","Blend","Crush","Grate","Squeeze","Trim","Quarter","Halve","Dice","Tip","Wash",
"Discard","Reserve","Keep","Make","Prepare","Assemble","Fill","Line","Bake","Roast","Grill",
"Fry","Steam","Blanch","Marinate","Chill","Rest",
"Ajouter","Mélanger","Verser","Cuire","Faire","Laisser","Servir","Réserver","Retirer","Égoutter",
"Saler","Poivrer","Chauffer","Préchauffer","Incorporer","Déposer","Couvrir","Pendant","Ensuite",
"Puis","Enfin","Éplucher","Émincer","Couper","Hacher","Rincer","Battre","Fouetter","Parsemer",
"Assaisonner","Goûter","Dresser","Enfourner","Remuer","Porter","Baisser","Répéter","Décorer"
].join("|");

function reparerEtapesFusionnees(etapes){
  const re = new RegExp("([a-zà-ÿ0-9\\)\\]]) (" + VERBES_ETAPE + ")\\b", "g");
  const out = [];
  (etapes || []).forEach(e => {
    String(e).replace(re, "$1\n$2").split("\n").forEach(x => {
      x = x.trim();
      if(x) out.push(x);
    });
  });
  return out;
}

/* payload reçu du bookmarklet / du Raccourci iOS ; « texte » = repli sans JSON-LD */
function payloadVersDraft(o){
  // bookmarklet périmé : il envoyait des champs déjà mâchés au lieu des données brutes
  state.vieuxBM = !!(o && !o.v && (o.etapes || o.ingredients || o.cat));
  state.etapesReparees = 0;

  if(o && o.ld){
    const rec = ldTrouverRecette(o.ld) || o.ld;
    const d = ldVersDraft(rec, o.url || "");
    if((!d.nom || d.nom === "Sans titre") && o.titre){
      d.nom = String(o.titre).split(/\s+[|·—–-]\s+/)[0].trim();
    }
    return fusionner(d);
  }
  const rec = ldTrouverRecette(o);
  if(rec) return fusionner(ldVersDraft(rec, o.url || ""));

  // payload d'un ancien bookmarklet : étapes déjà (mal) découpées → on rattrape
  if(state.vieuxBM && Array.isArray(o.etapes) && o.etapes.length){
    const d = ldVersDraft(o, o.url || "");
    const avant = d.etapes.length;
    d.etapes = reparerEtapesFusionnees(d.etapes);
    state.etapesReparees = d.etapes.length > avant ? d.etapes.length : 0;
    return fusionner(d);
  }
  if(o && o.texte && !(o.ingredients && o.ingredients.length)){
    const d = parseTexte(o.texte);
    // titre de page « Ma recette — Nom du site » → on garde la partie utile,
    // et seulement si elle apparaît vraiment dans le début de la page
    const titre = String(o.nom || "").split(/\s+[|·—–-]\s+/)[0].trim();
    const debut = String(o.texte).slice(0, 400).toLowerCase();
    if(titre && debut.indexOf(titre.toLowerCase()) >= 0) d.nom = titre;
    else if(titre && (!d.nom || d.nom === "Sans titre")) d.nom = titre;
    if(o.url) d.url = o.url;
    return fusionner(d);
  }
  return fusionner(ldVersDraft(o, o.url || ""));
}

/* même URL déjà en base ? on met à jour au lieu de créer un doublon,
   et surtout on ne piétine pas ce qui a été rempli à la main */
function fusionner(d){
  state.majExistante = false;
  if(!d.url) return d;
  const clef = u => String(u || "").replace(/[?#].*$/, "").replace(/\/+$/, "").toLowerCase();
  const ex = db.recettes.find(r => r.url && clef(r.url) === clef(d.url));
  if(!ex) return d;

  d.id = ex.id;
  state.majExistante = true;
  // champs personnels : ils gagnent toujours
  d.statut  = ex.statut;
  d.note    = ex.note;
  d.notesPerso   = ex.notesPerso;
  d.cuisinee     = ex.cuisinee;
  d.derniereFois = ex.derniereFois;
  d.cycles  = ex.cycles.slice();
  d.diff    = ex.diff || d.diff;
  d.meal    = ex.meal || d.meal;
  d.portions = ex.portions || d.portions;
  d.allergenes    = ex.allergenes || d.allergenes;
  d.ingredientCle = ex.ingredientCle || d.ingredientCle;
  d.groupe        = ex.groupe || d.groupe;
  d.image         = d.image || ex.image;
  d.description   = d.description || ex.description;
  d.tags     = Array.from(new Set(ex.tags.concat(d.tags)));
  d.cuisines = Array.from(new Set(ex.cuisines.concat(d.cuisines)));
  d.seasons  = ex.seasons.length ? ex.seasons.slice() : d.seasons;
  // les allergènes cochés à la main sur les ingrédients sont reportés
  const alg = {};
  ex.ingredients.forEach(i => { if(i.alg) alg[i.txt.toLowerCase()] = true; });
  d.ingredients.forEach(i => { if(alg[i.txt.toLowerCase()]) i.alg = true; });
  return d;
}

/* ---------- import « en un clic » : #import=... ---------- */
function lireHashImport(){
  const h = location.hash || "";
  const i = h.indexOf("import=");
  if(i < 0) return false;
  let payload = h.slice(i + 7);
  try{
    payload = decodeURIComponent(payload);
    const o = JSON.parse(payload);
    state.formDraft = payloadVersDraft(o);
    state.formTab = "manuel";
    state.view = "form";
    nettoyerHash();
    setTimeout(() => toast("Recette importée — vérifie puis enregistre"), 300);
    return true;
  }catch(e){
    nettoyerHash();
    setTimeout(() => toast("Données d'import illisibles"), 300);
    return false;
  }
}
function nettoyerHash(){
  try{ history.replaceState(null, "", location.pathname + location.search); }
  catch(e){ location.hash = ""; }
}

/* ---------- bookmarklet ---------- */
/* ---------- bookmarklet (v2) ----------
   Il ne fait qu'une chose : trouver le bloc schema.org/Recipe de la page et le
   transmettre TEL QUEL. Toute l'interprétation se fait dans l'app, pour ne plus
   jamais avoir à remplacer le bouton dans la barre de favoris. */
const BM_VERSION = 2;
const BM_TROUVE = [
"var R=null;",
"function W(n,p){if(!n||R||p>8)return;",
"if(n instanceof Array){for(var i=0;i<n.length;i++)W(n[i],p+1);return}",
"if(typeof n!=='object')return;var t=n['@type'];",
"if(t&&(t==='Recipe'||(t instanceof Array&&t.indexOf('Recipe')>=0))){R=n;return}",

function fcExport(){

  }, null, 2);

function fcImport(texte){
  let p;
  try{ p = JSON.parse(texte); }
  catch(e){ toast("Fichier illisible"); return false; }
  if(!p || (!p.assoc && !p.phases && !p.aliments)){
    toast("Ce fichier ne contient pas de données Food Cycling");
    return false;
  }
  const avant = JSON.stringify({fc: db.fc, perso: db.aliments.perso});
  const n = fusionnerFC(p);
  db.fc.actif = true;
  construireAliments();
  if(!save()) return true;
  toast(n + " rattachement" + (n>1?"s":"") + " ajouté" + (n>1?"s":"") + " à tes associations · Food Cycling activé ✓", () => {
    const a = JSON.parse(avant);
    db.fc = a.fc; db.aliments.perso = a.perso;
    construireAliments(); save(); render();
  });
  return true;
}

/* ajoute un fichier Food Cycling à ce que j'ai déjà : rien de ce que j'ai saisi n'est écrasé.
   Renvoie le nombre de rattachements (aliment, phase) nouveaux. */
function fusionnerFC(p){
  let n = 0;
  // notes des phases : un champ que j'ai rempli garde ma version
  CYCLES.forEach(c => {
    const src = p.phases && p.phases[c];
    if(!src || typeof src !== "object") return;
    const loc = db.fc.phases[c] = Object.assign({}, db.fc.phases[c]);
    Object.keys(src).forEach(k => { if(!loc[k] && src[k]) loc[k] = String(src[k]); });
  });
  // les phases inconnues sont ignorées plutôt que d'introduire des libellés fantômes
  const rattacher = (en, phases) => {
    arr(phases).filter(x => CYCLES.indexOf(x) >= 0).forEach(ph => {
      const l = db.fc.assoc[en] = db.fc.assoc[en] || [];
      if(l.indexOf(ph) < 0){ l.push(ph); n++; }
    });
  };
  Object.keys(p.assoc || {}).forEach(k => rattacher(k, p.assoc[k]));
  // aliments personnalisés du fichier : rejoignent mon catalogue directement,
  // plutôt qu'une couche à part que rien ne relit (voir construireAliments)
  (Array.isArray(p.aliments) ? p.aliments : []).forEach(a => {
    if(!a || typeof a !== "object") return;
    const en = String(a.en || a.fr || "").trim();
    if(!en) return;
    const connu = db.aliments.perso.find(x => normLibelle(x.en) === normLibelle(en)) ||
                  ALIMENTS_BASE.find(x => normLibelle(x[0] || x[1]) === normLibelle(en));
    if(!connu){
      db.aliments.perso.push({
        en: en, fr: String(a.fr || en).trim(),
        cat: CAT_LBL[a.cat] ? a.cat : "O",
        gi: GI_LBL[a.gi] ? a.gi : "",
        pest: (a.pest === "D" || a.pest === "C") ? a.pest : ""
      });
    }
    rattacher(en, a.phases);
  });
  return n;
}

function importJSON(text, remplacer){
  let p;
  try{ p = JSON.parse(text); }
  catch(e){ toast("JSON invalide"); return; }
  const list = Array.isArray(p) ? p : (p && Array.isArray(p.recettes) ? p.recettes : null);
  if(!list){ toast("Aucune recette trouvée dans ce fichier"); return; }
  const brutes = list.filter(b => b && typeof b === "object" && !Array.isArray(b));
  if(list.length && !brutes.length){ toast("Aucune recette lisible dans ce fichier"); return; }

  if(remplacer) db.recettes = [];
  const clef = u => String(u || "").replace(/[?#].*$/, "").replace(/\/+$/, "").toLowerCase();
  const memeNom = (a, b) => normLibelle(a.nom) === normLibelle(b.nom);
  const idsFichier = {};   // id dans le fichier → id dans ma base, pour raccrocher le planning
  const sem = semaineCourante();
  let n = 0, maj = 0, planif = 0;
  brutes.forEach(brute => {
    const rec = normalize(brute);
    // ma propre sauvegarde (même identifiant, même recette) : la version la plus récente gagne,
    // et réimporter deux fois le même fichier ne crée jamais de doublon
    const j = db.recettes.findIndex(x => x.id === rec.id &&
      (memeNom(x, rec) || x.cree === rec.cree || (x.url && clef(x.url) === clef(rec.url))));
    // même URL déjà en base → mise à jour plutôt que doublon
    const i = j >= 0 ? -1 : rec.url ? db.recettes.findIndex(x => x.url && clef(x.url) === clef(rec.url)) : -1;
    if(j >= 0){
      const anc = db.recettes[j];
      const neuf = (rec.maj || 0) >= (anc.maj || 0) ? rec : anc, vieux = neuf === rec ? anc : rec;
      const r = Object.assign({}, neuf, {id: anc.id});
      r.note = neuf.note || vieux.note;
      r.tags = Array.from(new Set(neuf.tags.concat(vieux.tags)));
      r.cuisines = Array.from(new Set(neuf.cuisines.concat(vieux.cuisines)));
      r.notesPerso = neuf.notesPerso || vieux.notesPerso;
      r.cuisinee = Math.max(rec.cuisinee, anc.cuisinee);
      r.derniereFois = Math.max(rec.derniereFois, anc.derniereFois);
      db.recettes[j] = r; maj++;
      rec.id = anc.id;
    }else if(i >= 0){
      const anc = db.recettes[i];
      rec.id = anc.id;
      rec.note = rec.note || anc.note;
      rec.statut = anc.statut;
      rec.cycles = rec.cycles.length ? rec.cycles : anc.cycles;
      rec.tags = Array.from(new Set(anc.tags.concat(rec.tags)));
      rec.cuisines = Array.from(new Set(anc.cuisines.concat(rec.cuisines)));
      rec.notesPerso = rec.notesPerso || anc.notesPerso;
      rec.cuisinee = Math.max(rec.cuisinee, anc.cuisinee);
      rec.derniereFois = Math.max(rec.derniereFois, anc.derniereFois);
      db.recettes[i] = rec; maj++;
    }else{
      if(getRecette(rec.id)) rec.id = uid();
      db.recettes.push(rec); n++;
    }
    if(brute.id != null) idsFichier[brute.id] = rec.id;
    // sauvegarde d'avant la v3 : « cette semaine » était un drapeau sur la recette
    if(brute && brute.semaine && !estPlanifiee(rec, sem)){
      db.plan.push({id: uid(), rid: rec.id, sem: sem, jour: -1,
        portions: num(brute.semainePortions) || rec.portions || 4, fait: false});
      planif++;
    }
  });
  if(!Array.isArray(p)){
    if(Array.isArray(p.cuisines) && p.cuisines.length) db.cuisines = Array.from(new Set(db.cuisines.concat(p.cuisines)));
    if(p.cycleNotes) CYCLES.forEach(c => { if(p.cycleNotes[c]) db.cycleNotes[c] = p.cycleNotes[c]; });
    restaurerReglages(p);
    // planning d'une sauvegarde v3 : seules la semaine en cours et les suivantes voyagent
    if(Array.isArray(p.plan)) p.plan.map(normEntree).filter(Boolean).forEach(e => {
      const rid = idsFichier[e.rid];
      if(!rid || e.sem < sem) return;
      if(db.plan.some(x => x.rid === rid && x.sem === e.sem && x.jour === e.jour)) return;
      e.rid = rid; e.id = uid();
      db.plan.push(e); planif++;
    });
  }
  // enrichit les listes de cuisines et de collections avec celles trouvées
  db.recettes.forEach(r => r.cuisines.forEach(c => { if(db.cuisines.indexOf(c) < 0) db.cuisines.push(c); }));
  db.recettes.forEach(r => r.tags.forEach(t => { if(db.tags.indexOf(t) < 0) db.tags.push(t); }));
  if(!save()){ state.formDraft = null; onglet("galerie"); return; }
  toast((n ? (n + " recette" + (n>1?"s":"") + " importée" + (n>1?"s":"") + (maj ? ", " + maj + " mise" + (maj>1?"s":"") + " à jour" : ""))
           : (maj + " recette" + (maj>1?"s":"") + " mise" + (maj>1?"s":"") + " à jour")) +
        (planif ? " · " + planif + " au planning" : "") + " ✓");
  state.formDraft = null;
  onglet("galerie");
}

/* sauvegarde complète : tout ce qui n'est pas une recette revient aussi (Mac ↔ iPhone).
   On complète, on n'écrase jamais ce qui existe déjà ici. */
function restaurerReglages(p){
  const objet = x => x && typeof x === "object" && !Array.isArray(x);
  arr(p.tags).forEach(t => { if(!db.tags.some(x => normLibelle(x) === normLibelle(t))) db.tags.push(t); });
  if(objet(p.fc)){
    fusionnerFC(p.fc);
    if(p.fc.actif) db.fc.actif = true;
  }
  if(objet(p.aliments)){
    fusionnerFC({aliments: Array.isArray(p.aliments.perso) ? p.aliments.perso : []});
    if(objet(p.aliments.modifs)) Object.keys(p.aliments.modifs).forEach(k => {
      if(!db.aliments.modifs[k] && objet(p.aliments.modifs[k])) db.aliments.modifs[k] = p.aliments.modifs[k];
    });
    arr(p.aliments.masques).forEach(k => { if(db.aliments.masques.indexOf(k) < 0) db.aliments.masques.push(k); });
  }
  if(objet(p.synonymes)) Object.keys(p.synonymes).forEach(k => { if(!(k in db.synonymes)) db.synonymes[k] = String(p.synonymes[k]); });
  if(objet(p.rayons)) Object.keys(p.rayons).forEach(k => {
    if(!(k in db.rayons) && RAYONS.indexOf(p.rayons[k]) >= 0) db.rayons[k] = p.rayons[k];
  });
  arr(p.placard).forEach(k => { if(db.placard.indexOf(k) < 0) db.placard.push(k); });
  if(objet(p.placardNoms)) Object.keys(p.placardNoms).forEach(k => { if(!db.placardNoms[k]) db.placardNoms[k] = String(p.placardNoms[k]); });
  if(objet(p.prefs)){
    if(!db.prefs.portions && num(p.prefs.portions) > 0) db.prefs.portions = num(p.prefs.portions);
    if((db.prefs.theme || "auto") === "auto" && (p.prefs.theme === "clair" || p.prefs.theme === "sombre")) db.prefs.theme = p.prefs.theme;
  }
  if(!db.phaseActuelle && CYCLES.indexOf(p.phaseActuelle) >= 0) db.phaseActuelle = p.phaseActuelle;
  // listes de courses en cours et à venir, si je n'en ai pas déjà une pour ces semaines
  const cur = semaineCourante();
  const listes = objet(p.courses) ? p.courses
    : (p.coursesCoches || p.coursesAjouts) ? {[cur]: {coches: p.coursesCoches, ajouts: p.coursesAjouts, retires: p.coursesRetires}} : {};
  Object.keys(listes).forEach(s => {
    const ici = db.courses[s];
    const occupee = ici && (Object.keys(ici.coches || {}).length || (ici.ajouts || []).length || (ici.retires || []).length);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s) || s < cur || occupee || !objet(listes[s])) return;
    const L = listes[s];
    db.courses[s] = {coches: objet(L.coches) ? L.coches : {},
      ajouts: (Array.isArray(L.ajouts) ? L.ajouts : []).filter(objet).map(a => ({id: idSur(a.id), txt: String(a.txt || ""), rayon: RAYONS.indexOf(a.rayon) >= 0 ? a.rayon : ""})).filter(a => a.txt),
      retires: arr(L.retires)};
  });
  construireAliments();
  appliquerTheme();
}

/* Safari garde environ 5 Mo par site ; les photos en prennent l'essentiel */
function placeUtilisee(){
  const Mo = n => (n * 2 / 1e6).toLocaleString("fr-FR", {maximumFractionDigits: 1}) + " Mo";   // UTF-16 : 2 octets par caractère
  const tout = JSON.stringify(db).length;
  const photos = db.recettes.reduce((t, r) => t + (/^data:/.test(r.image) ? r.image.length : 0), 0);
  const pct = Math.round(100 * tout * 2 / 5e6);
  return '<p class="hint"' + (pct >= 70 ? ' style="color:var(--danger)"' : '') + '>Espace utilisé : ' + Mo(tout) +
    (photos ? ' (photos : ' + Mo(photos) + ')' : '') + ' sur environ 5 Mo' +
    (pct >= 70 ? ' — bientôt plein : exporte une sauvegarde et allège quelques photos.' : '.') + '</p>';
}

function copier(txt, msg){
  const ok = () => toast(msg || "Copié ✓");
  const secours = () => {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }
    catch(e){ toast("Copie impossible — sélectionne le texte à la main"); }
    ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, secours);
  }else secours();
}

function marquerCuisinee(r, entreeId){
  // le repas qu'on vient de faire : celui d'aujourd'hui, sinon celui « sans jour », sinon le plus proche
  const cands = db.plan.filter(x => x.rid === r.id && x.sem === semaineCourante() && !x.fait).sort((a,b) => a.jour - b.jour);
  const e = (entreeId && entree(entreeId)) || cands.find(x => x.jour === indexJour()) || cands.find(x => x.jour < 0) || cands[0];
  if(e) e.fait = true;
  r.cuisinee = (r.cuisinee || 0) + 1;
  r.derniereFois = Date.now();
  save();
}

/* mots qui ne disent rien de l'ingrédient : « 2 c. à soupe d'huile d'olive » → huile, olive */
const MOTS_VIDES = (" de du des la le les un une et au aux en pour avec sans ou of the and or an to for with" +
  " fresh frais fraiche chopped finely roughly sliced diced large small medium grated peeled minced cut into" +
  " piece morceau tin can boite gousse clove cuillere soupe cafe tbsp tsp pinch pincee handful poignee bunch botte" +
  " hache emince rape coupe gros grosse petit petite moyen bio extra virgin vierge cuit cooked dried sec seche" +
  " ground moulu tranche slice optional facultatif environ about").split(" ").filter(Boolean).map(normAli);

function clesIngredient(txt){
  const p = parseIngredient(txt);
  const mots = normAli(p.nom).split(" ").filter(w => w.length > 2 && MOTS_VIDES.indexOf(w) < 0);
  const cles = [];
  if(mots.length) cles.push(mots.join(" "));
  const ali = aliDeLigne(txt);
  if(ali){ cles.push(normAli(ali.en)); cles.push(normAli(ali.fr)); }
  if(mots.length > 1){ cles.push(mots[0]); cles.push(mots[mots.length - 1]); }
  return cles.filter((c, i) => c && c.length > 2 && cles.indexOf(c) === i);
}
function ingredientsEtape(r, etape){
  const s = " " + normAli(etape) + " ";
  const out = [];
  r.ingredients.forEach((ing, k) => {
    if(clesIngredient(ing.txt).some(c => s.indexOf(" " + c + " ") >= 0)) out.push(k);
  });
  return out;
}

/* « 20-25 minutes », « 1 h 30 », « 45 sec » → minuteurs ; pour une plage, la borne basse :
   on vérifie la cuisson plutôt que de la rater */
const RE_DUREE = /(\d+(?:[.,]\d+)?)(?:\s*(?:-|–|à|to|ou|or)\s*(\d+(?:[.,]\d+)?))?\s*(heures?|hours?|hrs?|minutes?|mins?|mn|secondes?|seconds?|secs?|h(?=\s*\d)|h\b|s\b)(?:\s*(\d{1,2})\b(?!\s*[°%]))?/gi;
function minuteursEtape(txt){
  const vus = {}, out = [];
  let m;
  RE_DUREE.lastIndex = 0;
  while((m = RE_DUREE.exec(String(txt)))){
    const u = m[3].toLowerCase();
    const mult = /^h/.test(u) ? 3600 : /^s/.test(u) ? 1 : 60;
    let sec = Math.round(num(m[1].replace(",", ".")) * mult);
    if(mult === 3600 && m[4]) sec += num(m[4]) * 60;
    if(sec < 5 || sec > 86400 || vus[sec]) continue;
    vus[sec] = 1;
    const max = m[2] ? Math.round(num(m[2].replace(",", ".")) * mult) : 0;
    out.push({sec: sec, lib: fmtDuree(sec), plage: max > sec ? fmtDuree(sec) + " à " + fmtDuree(max) : ""});
  }
  return out;
}
function fmtDuree(sec){
  if(sec < 60) return sec + " s";
  if(sec < 3600){ const m = Math.floor(sec / 60), s = sec % 60; return m + " min" + (s ? " " + pad2(s) : ""); }
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  return h + " h" + (m ? " " + pad2(m) : "");
}

/* écran allumé tant qu'on cuisine (Safari 16.4+), sans erreur ailleurs */
let veille = null;
async function garderEcranAllume(oui){
  try{
    if(oui && !veille && navigator.wakeLock && document.visibilityState === "visible"){
      veille = await navigator.wakeLock.request("screen");
      veille.addEventListener("release", () => { veille = null; });
    }else if(!oui && veille){
      const v = veille; veille = null; await v.release();
    }
  }catch(e){ veille = null; }
}

/* =========================================================
   8e. MINUTEURS
   Ils continuent quand on change d'écran ; une pastille les rappelle.
   ========================================================= */
let minuteurs = [], tickT = null, audioCtx = null;

function initAudio(){
  // iOS n'autorise le son qu'après un geste : on prépare le contexte au toucher
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
function bip(){
  try{
    if(audioCtx){
      const t0 = audioCtx.currentTime;
      [0, 0.28, 0.56].forEach(d => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0 + d); o.stop(t0 + d + 0.25);
      });
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200, 100, 200]); }catch(e){}
}
function lancerMinuteur(sec, lib, rid, etape){
  initAudio();
  minuteurs.push({id: uid(), lib: lib || fmtDuree(sec), rid: rid, etape: etape, fin: Date.now() + sec * 1000, fini: false, alertes: 0, derniere: 0});
  if(!tickT) tickT = setInterval(tic, 1000);
  renderMinuteurs();
  toast("⏱ Minuteur lancé : " + fmtDuree(sec));
}
function tic(){
  const now = Date.now();
  minuteurs.forEach(m => {
    if(!m.fini && now >= m.fin){
      m.fini = true; m.derniere = now; m.alertes = 1;
      bip(); toast("⏰ " + m.lib + " — c'est l'heure !");
    }else if(m.fini && m.alertes < 6 && now - m.derniere >= 10000){
      m.derniere = now; m.alertes++; bip();   // rappel toutes les 10 s, une minute au plus
    }
  });
  if(!minuteurs.length){ clearInterval(tickT); tickT = null; }
  renderMinuteurs();
}
function arreterMinuteur(id){
  minuteurs = minuteurs.filter(m => m.id !== id);
  renderMinuteurs();
}
function fmtRebours(ms){
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ":" + pad2(m) : m) + ":" + pad2(ss);
}
function renderMinuteurs(){
  const now = Date.now();
  document.body.classList.toggle("a-minuteurs", minuteurs.length > 0);
  $("#timers").innerHTML = minuteurs.map(m =>
    '<div class="timer' + (m.fini ? " fini" : "") + '" data-timergo="' + m.id + '" title="' + esc(m.lib) + '">' +
      '<span>' + (m.fini ? "⏰ Fini" : fmtRebours(m.fin - now)) + '</span><small>' + esc(m.lib) + '</small>' +
      '<button type="button" data-timerstop="' + m.id + '" aria-label="Arrêter le minuteur">' + ico("x") + '</button></div>').join("");
}
function allerAuMinuteur(id){
  const m = minuteurs.find(x => x.id === id);
  if(!m) return;
  if(m.fini){ arreterMinuteur(id); return; }
  if(state.view === "cuisine" || !getRecette(m.rid)) return;
  if(!state.cuisine || state.cuisine.rid !== m.rid) state.cuisine = {rid: m.rid, etape: m.etape, entree: null, marque: false};
  go("cuisine");
}
