<meta name="apple-mobile-web-app-title" content="Recipe book">
<style>
:root{
  --bg:#faf8f5;
  --card:#ffffff;
  --ink:#2b2622;
  --muted:#8b8177;
  --line:#e9e3db;
  --line2:#f2ede6;
  --accent:#c0703f;
  --accent-d:#a25b2e;
  --soft:#f7ece3;
  --ok:#4f8a5b;
  --warn:#c9a227;
  --danger:#b4453a;
  --r:14px;
  --shadow:0 1px 2px rgba(43,38,34,.05), 0 6px 18px rgba(43,38,34,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.01em}
a{color:var(--accent-d)}
button,input,select,textarea{font:inherit; color:inherit}
input,select,textarea{
  width:100%; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; outline:none;
}
input:focus,select,textarea:focus{border-color:var(--accent)}
select{-webkit-appearance:none; appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238b8177' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center; padding-right:32px}
textarea{min-height:110px; resize:vertical; line-height:1.55}
.wrap{max-width:980px; margin:0 auto; padding:0 16px}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:40; background:rgba(250,248,245,.92);
  backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.top-row{display:flex; align-items:center; gap:10px; padding:12px 0 10px}
.brand{font-size:19px; font-weight:700; letter-spacing:-.02em; flex:1; cursor:pointer}
.brand span{color:var(--accent)}
.ver{font-size:11px; font-weight:600; color:var(--muted); background:var(--line2);
  border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:middle}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--muted);
  padding:7px 14px; border-radius:999px; font-size:14px; font-weight:550; cursor:pointer;
}
.tab.on{background:var(--ink); border-color:var(--ink); color:#fff}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 14px; border-radius:10px; font-size:14px; font-weight:550; cursor:pointer;
  white-space:nowrap;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger); border-color:#ecd6d3}
.btn.sm{padding:6px 10px; font-size:13px}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;
}
.fab{
  position:fixed; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:50;
  width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:#fff;
  font-size:30px; line-height:1; box-shadow:0 6px 20px rgba(192,112,63,.4); cursor:pointer;
}

/* ---------- Chips ---------- */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  padding:6px 12px; border-radius:999px; font-size:13.5px; cursor:pointer; user-select:none;
}
.chip.on{background:var(--soft); border-color:var(--accent); color:var(--accent-d); font-weight:600}
.chip.add{border-style:dashed; color:var(--muted)}

/* ---------- Cartes ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px}
@media(max-width:520px){ .grid{grid-template-columns:1fr 1fr; gap:11px} }
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; cursor:pointer; box-shadow:var(--shadow); position:relative;
  display:flex; flex-direction:column;
}
.card:active{transform:scale(.985)}
.thumb{
  aspect-ratio:4/3; width:100%; background:var(--soft); display:flex; align-items:center;
  justify-content:center; font-size:34px; overflow:hidden;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.card-body{padding:10px 11px 12px; display:flex; flex-direction:column; gap:5px; flex:1}
.card-title{font-size:14.5px; font-weight:640; line-height:1.3}
.card-meta{font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px}
.week-btn{
  position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  border:none; background:rgba(255,255,255,.9); backdrop-filter:blur(6px);
  font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 5px rgba(0,0,0,.14);
}
.week-btn.on{background:var(--accent); color:#fff}
.stars{color:var(--warn); font-size:12.5px; letter-spacing:1px}
.portions-row{
  display:flex; align-items:center; justify-content:space-between; gap:7px;
  margin-top:2px; padding-top:9px; border-top:1px solid var(--line2);
}
.portions-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.stepper{
  display:inline-flex; align-items:stretch; border:1px solid var(--line); border-radius:9px;
  overflow:hidden;
}
.stepper button{
  width:28px; border:none; background:var(--card); color:var(--accent-d);
  font-size:15px; line-height:1; cursor:pointer;
}
.stepper button:active{background:var(--soft)}
.stepper-val{
  min-width:26px; display:flex; align-items:center; justify-content:center;
  font-size:13.5px; font-weight:650; color:var(--ink); background:var(--line2);
}

/* ---------- Sections ---------- */
.section{margin:26px 0 0}
.section-head{
  display:flex; align-items:baseline; gap:9px; margin:0 0 11px;
}
.section-head h3{font-size:16px}
.count{font-size:12.5px; color:var(--muted)}
.panel{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; box-shadow:var(--shadow);
}
.panel + .panel{margin-top:14px}
.field{margin:0 0 14px}
.field > label{display:block; font-size:12.5px; font-weight:640; color:var(--muted); margin:0 0 6px; letter-spacing:.02em; text-transform:uppercase}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1 1 130px; min-width:0}
.hint{font-size:12.5px; color:var(--muted); margin:6px 0 0}
.empty{text-align:center; color:var(--muted); padding:44px 16px; font-size:14.5px}
.empty .big{font-size:38px; display:block; margin-bottom:10px}
hr.sep{border:none; border-top:1px solid var(--line2); margin:18px 0}

/* ---------- Filtres ---------- */
.searchbar{display:flex; gap:9px; margin:16px 0 0}
.searchbar input{flex:1}
.filters{margin-top:12px}
.filters .field{margin-bottom:12px}
.fbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap}
.badge{background:var(--soft); color:var(--accent-d); border-radius:999px; padding:2px 9px; font-size:12px; font-weight:640}

/* ---------- Fiche ---------- */
.hero{
  width:100%; aspect-ratio:16/9; background:var(--soft); border-radius:var(--r); overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:54px; margin-bottom:14px;
}
.hero img{width:100%; height:100%; object-fit:cover}
.pill{display:inline-block; background:var(--line2); color:var(--muted); border-radius:999px; padding:3px 10px; font-size:12.5px; margin:0 5px 5px 0}
.pill.acc{background:var(--soft); color:var(--accent-d)}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; text-align:center}
@media(max-width:520px){ .stat-grid{grid-template-columns:repeat(2,1fr)} }
.stat{background:var(--line2); border-radius:10px; padding:10px 6px}
.stat b{display:block; font-size:17px}
.stat span{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
ul.ing{list-style:none; margin:0; padding:0}
ul.ing li{
  display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line2);
  cursor:pointer; font-size:15px;
}
ul.ing li:last-child{border-bottom:none}
ul.ing li.done{color:var(--muted); text-decoration:line-through}
.box{width:19px; height:19px; border:1.6px solid var(--line); border-radius:6px; flex:0 0 auto; margin-top:2px;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff}
li.done .box{background:var(--accent); border-color:var(--accent)}
.alg{font-size:11px; background:#fdeeec; color:var(--danger); border-radius:6px; padding:1px 6px; margin-left:auto; flex:0 0 auto}
ol.steps{margin:0; padding:0 0 0 4px; list-style:none; counter-reset:s}
ol.steps li{counter-increment:s; display:flex; gap:12px; padding:9px 0; font-size:15px}
ol.steps li::before{
  content:counter(s); flex:0 0 auto; width:25px; height:25px; border-radius:50%;
  background:var(--soft); color:var(--accent-d); font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px}

/* ---------- Formulaire dynamique ---------- */
.ing-row{display:flex; gap:7px; align-items:center; margin-bottom:7px}
.ing-row input{flex:1}
.mini{width:34px; height:34px; flex:0 0 auto; border-radius:9px; border:1px solid var(--line);
  background:var(--card); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center}
.mini.on{background:#fdeeec; border-color:#e9c3bd}
.starpick{display:flex; gap:5px}
.starpick button{border:none; background:none; font-size:25px; color:var(--line); cursor:pointer; padding:0}
.starpick button.on{color:var(--warn)}
.subtabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom));
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:14px;
  z-index:90; opacity:0; pointer-events:none; transition:opacity .22s;
}
.toast.show{opacity:1}
.note-area{min-height:150px}

/* ---------- import web ---------- */
.bmbox{
  display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center;
  background:var(--soft); border:1px dashed var(--accent); border-radius:12px; padding:18px 14px; margin-bottom:14px;
}
.bmlink{
  display:inline-block; background:var(--accent); color:#fff !important; text-decoration:none;
  padding:11px 20px; border-radius:10px; font-weight:640; font-size:15px; cursor:grab;
}
.bmbox .hint{margin:0}
details{border-top:1px solid var(--line2); padding:11px 0 4px}
summary{cursor:pointer; font-size:14px; font-weight:600; color:var(--accent-d); list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"› "; display:inline-block; transition:transform .15s}
details[open] summary::before{content:"⌄ "}
textarea.code{
  font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; min-height:120px;
  background:#fbf9f7; margin:10px 0 8px; word-break:break-all;
}
ol.howto{margin:12px 0; padding-left:22px; font-size:14.5px; line-height:1.6}
ol.howto li{margin-bottom:7px}
code{background:var(--line2); border-radius:5px; padding:1px 5px; font-size:12.5px; word-break:break-all}
.cycle-head{display:flex; align-items:center; gap:12px; margin-bottom:4px}
.cycle-emo{font-size:32px}
.desc{margin:9px 0 0; color:var(--muted); font-size:14.5px; line-height:1.55}
.notice{
  background:var(--soft); border:1px solid var(--accent); border-radius:12px;
  padding:13px 15px; margin:0 0 14px; font-size:14px; line-height:1.55; color:var(--accent-d);
}
.notice.warn{background:#fdf6e3; border-color:#e2c563; color:#7a5c11}
.notice b{color:inherit}
.bmver{font-size:12px; color:var(--muted); margin-left:auto}

/* ---------- cycle & courses ---------- */
.phase-sel{
  width:auto; max-width:150px; padding:7px 30px 7px 11px; font-size:13.5px; font-weight:550;
  border-radius:999px; background-color:var(--card);
}
.phase-sel.on{background-color:var(--soft); border-color:var(--accent); color:var(--accent-d)}
@media(max-width:430px){
  .brand{font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .phase-sel{max-width:112px; font-size:12.5px; padding:6px 26px 6px 9px}
}
.phase-hero{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.phase-hero h2{font-size:22px}
.repere{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media(max-width:560px){ .repere{grid-template-columns:1fr 1fr} }
.repere > div{background:var(--line2); border-radius:10px; padding:10px 11px}
.repere span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:3px}
.repere b{font-size:13.5px; font-weight:600; line-height:1.35}
p.txt{margin:0; font-size:15px; line-height:1.62}
.chip.ali{cursor:default; font-size:13px}
.fit{font-size:11.5px; color:var(--accent-d); background:var(--soft); border-radius:6px; padding:2px 6px; align-self:flex-start}
.tagali{
  display:inline-block; font-size:11px; font-weight:600; border-radius:6px; padding:1px 7px;
  margin-left:6px; background:var(--line2); color:var(--muted); vertical-align:middle; white-space:nowrap;
}
.tagali.cible{background:var(--soft); color:var(--accent-d)}
.tagali.giL{background:#e8f3ea; color:#3f7a4d}
.tagali.giM{background:#fbf1d8; color:#8a6d18}
.tagali.giH{background:#fbe6e3; color:#a8443a}
.tagali.bio{background:#eaf4e9; color:#4a7c43}
li.done .tagali{opacity:.5}
.qte{font-size:13px; color:var(--accent-d); font-weight:600; margin-left:6px; white-space:nowrap}
.src{display:block; font-size:11.5px; color:var(--muted); margin-top:2px}
ul.ing li .mini{width:30px; height:30px; font-size:13px; margin-top:-2px}

/* ---------- éditeur d'aliments ---------- */
.ali-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:11px 0; border-bottom:1px solid var(--line2); cursor:pointer;
}
.ali-row.ouvert{border-bottom:none; font-weight:600}
.ali-edit{
  background:var(--line2); border-radius:12px; padding:15px 15px 4px;
  margin:0 0 12px; border-bottom:1px solid transparent;
}
.ali-edit .field{margin-bottom:12px}
.ali-edit input[disabled]{opacity:.55}
.ali-row:last-child{border-bottom:none}
.ali-nom{flex:1; min-width:150px; font-size:14.5px; line-height:1.35}
.ali-en{color:var(--muted); font-size:12.5px; margin-left:7px}
.ali-meta{display:block; font-size:11.5px; color:var(--muted); margin-top:2px}
.ali-phases{flex:0 0 auto; gap:5px}
.mini-chip{
  min-width:34px; padding:5px 8px; font-size:14px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
}
</style>

/* Le catalogue vit en mémoire ; les phases viennent des données utilisateur.
   On le reconstruit à chaque changement plutôt que de le figer. */
let ALIMENTS = [];

function construireAliments(){
  const assoc = (db.fc && db.fc.assoc) || {};
  const mod = (db.aliments && db.aliments.modifs) || {};
  const masques = (db.aliments && db.aliments.masques) || [];

  const construire = (en, fr, cat, gi, pest, perso) => {
    const m = mod[en] || {};
    return {
      en: en, fr: m.fr !== undefined ? m.fr : fr,
      cat: m.cat !== undefined ? m.cat : cat,
      gi: m.gi !== undefined ? m.gi : gi,
      pest: m.pest !== undefined ? m.pest : pest,
      phases: (assoc[en] || []).slice(),
      perso: perso
    };
  };

  ALIMENTS = ALIMENTS_BASE
    .filter(a => masques.indexOf(a[0]) < 0)
    .map(a => construire(a[0] || a[1] || "", a[1] || a[0] || "", a[2], a[3], a[4], false));

  ((db.aliments && db.aliments.perso) || []).forEach(a => {
    const en = a.en || a.fr || "";
    if(!en || ALIMENTS.find(x => normLibelle(x.en) === normLibelle(en))) return;
    ALIMENTS.push(construire(en, a.fr || en, a.cat || "O", a.gi || "", a.pest || "", true));
  });

  IDX_ALI = null;
  return ALIMENTS;
}

/* enregistre une correction sur un aliment, qu'il vienne du catalogue ou de moi */

  if(perso){ Object.assign(perso, champs); }
  else{ db.aliments.modifs[en] = Object.assign({}, db.aliments.modifs[en], champs); }
  construireAliments(); save();
}

/* forme « souche » commune au singulier et au pluriel, en français comme en anglais :
   pluriel enlevé, puis « e » final enlevé — pois chiches → poi chich ← pois chiche */
function singulier(w){
  if(w.length < 4) return w;
  if(/ies$/.test(w)) w = w.slice(0,-3) + "y";
  else if(/s$/.test(w) && !/ss$/.test(w)) w = w.slice(0,-1);
  if(w.length > 3 && /e$/.test(w)) w = w.slice(0,-1);
  return w;
}

/* variantes courantes absentes de la liste Notion, vérifiées une à une */
const SYN_INTERNES = {
  "prawn":"Shrimp", "king prawn":"Shrimp", "gambas":"Shrimp", "scampi":"Shrimp",
  "peas":"Green peas", "petits pois":"Green peas", "garden peas":"Green peas",
  "cilantro":"Coriander", "spring onions":"Spring onion", "scallion":"Spring onion",
  "aubergine":"Eggplant", "courgette":"Zucchini", "chickpeas":"Chickpea",
  "linseed":"Flaxseeds", "graines de lin":"Flaxseeds", "flax seeds":"Flaxseeds",
  "sweet potatoes":"Sweet potato", "patates douces":"Sweet potato"
};
function normAli(s){
  let t = String(s == null ? "" : s).toLowerCase();
  try{ t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
  t = t.replace(/œ/g, "oe").replace(/æ/g, "ae")
       .replace(/[’']/g, " ").replace(/[^a-z0-9]+/g, " ").replace(/\b\d+[a-z]*\b/g, " ");
  return t.split(" ").filter(Boolean).map(singulier).join(" ");
}

/* index des noms, du plus long au plus court : on garde la correspondance la plus précise */
let IDX_ALI = null;
function indexAliments(){
  if(IDX_ALI) return IDX_ALI;
  const idx = [];
  const pousser = (mot, ali) => { const m = normAli(mot); if(m && m.length > 2) idx.push({mot:m, ali:ali}); };
  ALIMENTS.forEach(a => {
    pousser(a.en, a); pousser(a.fr, a);
    // « Banana (ripe) » → on indexe aussi « banana », en second choix
    const be = a.en.split("(")[0], bf = a.fr.split("(")[0];
    if(be !== a.en) pousser(be, a);
    if(bf !== a.fr) pousser(bf, a);
  });
  Object.keys(SYN_INTERNES).forEach(syn => {
    const cible = ALIMENTS.find(a => a.en === SYN_INTERNES[syn]);
    if(cible) pousser(syn, cible);
  });
  Object.keys(db.synonymes || {}).forEach(syn => {
    const cible = ALIMENTS.find(a => a.en === db.synonymes[syn]);
    if(cible) pousser(syn, cible);
  });
  idx.sort((a,b) => b.mot.length - a.mot.length);

  // dernier recours : le nom de tête (« green pea » → « pea »), testé seulement si rien d'autre ne colle.
  // Exception : un dernier mot précédé de « non »/« sans » est nié par la phrase (« lait non sucré »
  // ne parle pas de sucre) et ne doit surtout pas devenir un synonyme de cet aliment.
  const tetes = [];
  const vus = {};
  const NEGATIONS = ["non", "sans"];
  ALIMENTS.forEach(a => {
    [a.en, a.fr].forEach(nom => {
      const mots = normAli(nom).split(" ");
      const tete = mots[mots.length - 1];
      const precedent = mots[mots.length - 2];
      if(tete && tete.length > 3 && !vus[tete] && NEGATIONS.indexOf(precedent) < 0){
        vus[tete] = 1; tetes.push({mot:tete, ali:a});
      }
    });
  });
  IDX_ALI = {plein: idx, tetes: tetes.sort((a,b) => b.mot.length - a.mot.length)};
  return IDX_ALI;
}

function trouverAliment(txt){
  const s = " " + normAli(txt) + " ";
  if(s.trim().length < 3) return null;
  const idx = indexAliments();
  for(let i = 0; i < idx.plein.length; i++){
    if(s.indexOf(" " + idx.plein[i].mot + " ") >= 0) return idx.plein[i].ali;
  }
  for(let i = 0; i < idx.tetes.length; i++){
    if(s.indexOf(" " + idx.tetes[i].mot + " ") >= 0) return idx.tetes[i].ali;
  }
  return null;
}

/* aliments d'une recette rattachés à une phase donnée */
function alimentsDeRecette(r, phase){
  const out = [];
  (r.ingredients || []).forEach((ing, k) => {
    // on cherche d'abord sur le nom seul : « 1 c. à café d'ail » ne doit pas devenir du café
    const a = trouverAliment(parseIngredient(ing.txt).nom) || trouverAliment(ing.txt);
    if(!a) return;
    const pertinent = alimentEstDeLaPhase(a, phase);
    out.push({k:k, ali:a, pertinent:pertinent});
  });
  return out;
}
function scorePhase(r, phase){
  if(!phase || !db.fc.actif) return 0;
  return alimentsDeRecette(r, phase).filter(x => x.ali.phases.indexOf(phase) >= 0).length;
}

/* pour les unités on ne singularise pas : on compare des libellés, pas des aliments */
function normUniteTxt(u){
  let t = String(u == null ? "" : u).toLowerCase();
  try{ t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
  return t.replace(/[’']/g, " ").replace(/\s+/g, " ").trim();
}
function normUnite(u){
  const t = normUniteTxt(u);
  if(!t) return null;
  for(const x of UNITES){ if(x.re.test(t)) return x; }
  return null;
}

/* « 1 1/2 kg », « 2,5 l », « 400 ml », « ½ citron » → nombre */
function lireNombre(s){
  s = String(s).replace(",", ".").trim();
  const frac = {"½":0.5,"¼":0.25,"¾":0.75,"⅓":1/3,"⅔":2/3};
  if(frac[s] !== undefined) return frac[s];
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);        // 1 1/2
  if(m) return +m[1] + (+m[2]) / (+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/);                     // 3/4
  if(m) return (+m[1]) / (+m[2]);
  m = s.match(/^(\d+(?:\.\d+)?)$/);
  return m ? +m[1] : null;
}

/* découpe « 150g tomatoes speciality vine » → {qte:150, unite:g, nom:"tomatoes…"} */
function parseIngredient(ligne){
  let t = String(ligne || "").trim().replace(/^[-•*·]\s*/, "");
  const res = {qte:null, unite:null, nom:t, brut:t, note:""};

  // note entre parenthèses en fin de ligne : « (use half) »
  const par = t.match(/\s*\(([^)]*)\)\s*$/);
  if(par){ res.note = par[1].trim(); t = t.slice(0, par.index).trim(); }

  // 1. quantité en tête
  const m = t.match(/^(\d+(?:[.,]\d+)?\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if(!m){ res.nom = nettoyerNom(t) || t; return res; }
  const q = lireNombre(m[1]);
  if(q === null){ res.nom = nettoyerNom(t) || t; return res; }
  res.qte = q;
  let reste = m[2];

  // 2. unité éventuelle : on essaie les 3 premiers mots, puis 2, puis 1 (« c. à soupe » avant « c »)
  const mots = reste.split(/\s+/).filter(Boolean);
  for(let n = Math.min(3, mots.length); n >= 1; n--){
    const cand = mots.slice(0, n).join(" ");
    const u = normUnite(cand);
    if(u){ res.unite = u; reste = mots.slice(n).join(" "); break; }
  }
  res.nom = nettoyerNom(reste) || nettoyerNom(t) || t;
  return res;
}

/* retire les mots de liaison en tête : « de », « of », « d' »… */
function nettoyerNom(t){
  return String(t || "").replace(/^(de la |de l['’]|du |des |de |d['’]|of the |of |the )/i, "").trim();
}

/* rayon d'un ingrédient : ma correction > catégorie de l'aliment > mots-clés > Autres */
function rayonDe(nom, ali){
  const cle = normAli(nom);
  if(db.rayons[cle]) return db.rayons[cle];
  if(ali && RAYON_PAR_CAT[ali.cat]) return RAYON_PAR_CAT[ali.cat];
  const n = " " + cle + " ";
  for(const [rayon, mots] of RAYON_MOTS){
    const parts = mots.split("|");
    for(let i = 0; i < parts.length; i++){
      const p = normAli(parts[i]);
      if(p && n.indexOf(" " + p + " ") >= 0) return rayon;
    }
  }
  return RAYONS[RAYONS.length - 1];
}

/* construit la liste agrégée à partir des recettes « cette semaine » */
function construireCourses(){
  const recettes = db.recettes.filter(r => r.semaine);
  const lignes = {};   // clé → { nom, ali, rayon, parts:{fam:{qte,aff}}, sansQte:[], recettes:[] }

  recettes.forEach(r => {
    // portions choisies cette semaine vs. portions de base de la recette :
    // sans base connue, impossible de savoir à quoi rapporter le nombre choisi,
    // donc on ne touche pas aux quantités telles qu'écrites.
    const echelle = (r.portions && r.semainePortions) ? (r.semainePortions / r.portions) : 1;
    (r.ingredients || []).forEach(ing => {
      const p = parseIngredient(ing.txt);
      const ali = trouverAliment(p.nom) || trouverAliment(ing.txt);
      const cle = ali ? ("a:" + ali.en) : ("t:" + normAli(p.nom));
      if(!cle || cle === "t:") return;
      if(db.coursesRetires.indexOf(cle) >= 0) return;

      if(!lignes[cle]){
        lignes[cle] = {
          cle: cle,
          nom: ali ? (ali.fr || ali.en) : p.nom,
          ali: ali,
          rayon: rayonDe((ali ? ali.fr + " " + ali.en + " " : "") + p.nom, ali),
          parts: {},
          sansQte: 0,
          alg: false,
          recettes: []
        };
      }
      const L = lignes[cle];
      if(L.recettes.indexOf(r.nom) < 0) L.recettes.push(r.nom);
      if(ing.alg) L.alg = true;

      if(p.qte !== null && p.unite){
        const f = p.unite.fam;
        if(!L.parts[f]) L.parts[f] = {qte:0, aff:p.unite.aff};
        L.parts[f].qte += p.qte * p.unite.vers * echelle;
      }else if(p.qte !== null){
        if(!L.parts["piece"]) L.parts["piece"] = {qte:0, aff:""};
        L.parts["piece"].qte += p.qte * echelle;
      }else{
        L.sansQte++;
      }
    });
  });

  // lignes ajoutées à la main
  db.coursesAjouts.forEach((a, i) => {
    const p = parseIngredient(a.txt);
    const cle = "m:" + i;
    lignes[cle] = {cle:cle, nom:a.txt, ali:null, rayon:a.rayon || rayonDe(p.nom, null),
                   parts:{}, sansQte:0, alg:false, recettes:[], manuel:true};
  });

  // regroupement par rayon, dans l'ordre du magasin
  const parRayon = {};
  Object.keys(lignes).forEach(k => {
    const L = lignes[k];
    (parRayon[L.rayon] = parRayon[L.rayon] || []).push(L);
  });
  return RAYONS.filter(r => parRayon[r]).map(r => ({
    rayon: r,
    lignes: parRayon[r].sort((a,b) => a.nom.localeCompare(b.nom, "fr"))
  }));
}

/* « 1,5 kg » plutôt que « 1500 g » */
function afficheQte(L){
  const bouts = [];
  Object.keys(L.parts).forEach(f => {
    const p = L.parts[f];
    let q = p.qte, aff = p.aff;
    if(aff === "g" && q >= 1000){ q = q / 1000; aff = "kg"; }
    else if(aff === "ml" && q >= 1000){ q = q / 1000; aff = "l"; }
    // un ingrédient compté à la pièce ne s'achète pas en fraction : la mise à
    // l'échelle par portions peut produire « 4.5 œufs », qu'on arrondit au-dessus
    q = (f === "piece") ? Math.ceil(q - 1e-9) : Math.round(q * 100) / 100;
    bouts.push(aff ? (q + " " + aff) : String(q));
  });
  if(!bouts.length && L.sansQte) return L.sansQte > 1 ? "×" + L.sansQte : "";
  if(L.sansQte) bouts.push("+ " + L.sansQte + " sans quantité");
  return bouts.join(" + ");
}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(db));
    return true;
  }catch(e){
    toast("⚠️ Sauvegarde impossible (mémoire pleine ?)");
    return false;
  }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    db.recettes   = Array.isArray(parsed.recettes) ? parsed.recettes.map(normalize) : [];
    db.cuisines   = Array.isArray(parsed.cuisines) && parsed.cuisines.length ? parsed.cuisines : CUISINES_DEF.slice();
    db.tags       = Array.isArray(parsed.tags) && parsed.tags.length ? parsed.tags : TAGS_DEF.slice();
    // les tags déjà utilisés dans les recettes rejoignent la liste
    db.recettes.forEach(r => r.tags.forEach(t => { if(db.tags.indexOf(t) < 0) db.tags.push(t); }));
    db.cycleNotes = Object.assign({ "Folliculaire":"","Ovulatoire":"","Lutéale":"","Menstruelle":"" }, parsed.cycleNotes || {});
    db.phaseActuelle  = CYCLES.indexOf(parsed.phaseActuelle) >= 0 ? parsed.phaseActuelle : "";
    const al = parsed.aliments || {};
    db.aliments = {
      modifs: al.modifs || {},
      perso: Array.isArray(al.perso) ? al.perso : [],
      masques: Array.isArray(al.masques) ? al.masques : []
    };
    const fc = parsed.fc || {};
    db.fc = { actif: !!fc.actif, phases: fc.phases || {}, assoc: fc.assoc || {} };
    // reprise d'une version antérieure où les aliments perso vivaient dans fc
    if(Array.isArray(fc.aliments) && fc.aliments.length && !db.aliments.perso.length){
      db.aliments.perso = fc.aliments.map(a => ({en:a.en, fr:a.fr, cat:a.cat, gi:a.gi, pest:a.pest}));
      fc.aliments.forEach(a => { if(a.phases && a.phases.length) db.fc.assoc[a.en] = a.phases; });
    }
    db.synonymes      = parsed.synonymes || {};
    db.rayons         = parsed.rayons || {};
    db.coursesCoches  = parsed.coursesCoches || {};
    db.coursesAjouts  = Array.isArray(parsed.coursesAjouts) ? parsed.coursesAjouts : [];
    db.coursesRetires = Array.isArray(parsed.coursesRetires) ? parsed.coursesRetires : [];
  }catch(e){ console.warn("Lecture impossible", e); }
}

/* seuls http(s) sont acceptés : une recette importée ou partagée ne doit
   jamais pouvoir stocker un lien "javascript:" exécuté au clic */
function urlSure(u){ return /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : ""; }

function normalize(r){
  return {
    id: r.id || uid(),
    nom: r.nom || "Sans titre",
    url: urlSure(r.url),
    description: r.description || "",
    image: r.image || "",
    statut: STATUTS.includes(r.statut) ? r.statut : "🟡 Brouillon",
    cuisines: arr(r.cuisines),
    meal: r.meal || "",
    tags: arr(r.tags),
    seasons: arr(r.seasons),
    cycles: arr(r.cycles),
    diff: r.diff || "",
    note: num(r.note),
    prep: num(r.prep),
    cuisson: num(r.cuisson),
    portions: num(r.portions),
    semaine: !!r.semaine,
    semainePortions: num(r.semainePortions),
    kcal: num(r.kcal), prot: num(r.prot), gluc: num(r.gluc), lip: num(r.lip),
    ingredients: Array.isArray(r.ingredients)
      ? r.ingredients.map(i => typeof i === "string" ? {txt:i, alg:false} : {txt:(i.txt||""), alg:!!i.alg}).filter(i=>i.txt.trim())
      : [],
    etapes: arr(r.etapes),
    allergenes: r.allergenes || "",
    ingredientCle: r.ingredientCle || "",
    groupe: r.groupe || "",
    cree: r.cree || Date.now(),
    maj: r.maj || Date.now()
  };
}

/* =========================================================
   3. UTILITAIRES
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const arr = v => Array.isArray(v) ? v.filter(x => x !== null && x !== undefined && String(x).trim() !== "").map(String) : (v ? [String(v)] : []);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const uid = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function total(r){ return num(r.prep) + num(r.cuisson); }
function fmtMin(m){
  m = num(m); if(!m) return "—";
  if(m < 60) return m + " min";
  const h = Math.floor(m/60), r = m%60;
  return r ? h + " h " + r : h + " h";
}
function stars(n){ n = Math.round(num(n)); return n ? "★".repeat(n) + "☆".repeat(5-n) : ""; }
function getRecette(id){ return db.recettes.find(r => r.id === id); }

/* lecture + compression d'une image */
function readImage(file, cb){
  const fr = new FileReader();
  fr.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 700;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => toast("Image illisible");
    img.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

/* =========================================================
   4. FILTRAGE
   ========================================================= */
function matchAny(sel, vals){ return !sel.length || sel.some(s => vals.indexOf(s) >= 0); }

function filtrer(list){
  const f = state.filters;
  const q = state.q.trim().toLowerCase();
  return list.filter(r => {
    if(q){
      const hay = (r.nom + " " + r.cuisines.join(" ") + " " + r.tags.join(" ") + " " +
        r.ingredients.map(i=>i.txt).join(" ") + " " + r.ingredientCle).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    if(!matchAny(f.cycle, r.cycles)) return false;
    if(!matchAny(f.meal, r.meal ? [r.meal] : [])) return false;
    if(!matchAny(f.cuisine, r.cuisines)) return false;
    if(!matchAny(f.tags, r.tags)) return false;
    if(!matchAny(f.season, r.seasons)) return false;
    if(!matchAny(f.diff, r.diff ? [r.diff] : [])) return false;
    if(!matchAny(f.statut, [r.statut])) return false;
    if(f.noteMin && num(r.note) < f.noteMin) return false;
    if(f.tempsMax && (total(r) === 0 || total(r) > f.tempsMax)) return false;
    if(f.semaine && !r.semaine) return false;
    if(f.maPhase && scorePhase(r, db.phaseActuelle) === 0) return false;
    return true;
  }).sort((a,b) => {
    if(f.maPhase && db.phaseActuelle){
      const d = scorePhase(b, db.phaseActuelle) - scorePhase(a, db.phaseActuelle);
      if(d) return d;
    }
    return a.nom.localeCompare(b.nom, "fr");
  });
}

function nbFiltresActifs(){
  const f = state.filters;
  return f.cycle.length + f.meal.length + f.cuisine.length + f.tags.length +
    f.season.length + f.diff.length + f.statut.length +
    (f.noteMin ? 1 : 0) + (f.tempsMax ? 1 : 0) + (f.semaine ? 1 : 0) + (f.maPhase ? 1 : 0);
}
function resetFiltres(){
  state.filters = { cycle:[], meal:[], cuisine:[], tags:[], season:[], diff:[], statut:[], noteMin:0, tempsMax:0, semaine:false, maPhase:false };
  state.q = "";
}

      '<h3 style="margin-bottom:8px">Aïe, un souci d\'affichage</h3>' +

      '<button class="btn" id="do-export">⇩ Exporter mes données</button></div></div>';
    try{ bind(); }catch(e){}

/* =========================================================
   6. VUES LISTE
   ========================================================= */
function carte(r, opts){
  opts = opts || {};
  const meta = [];
  if(total(r)) meta.push("⏱ " + fmtMin(total(r)));
  if(r.portions && !opts.hidePortions) meta.push("👥 " + r.portions);
  if(r.diff) meta.push(esc(r.diff));
  const img = r.image
    ? '<img src="' + esc(r.image) + '" alt="" loading="lazy">'
    : (MEAL_EMO[r.meal] || "🍳");
  return '' +
  '<article class="card" data-open="' + r.id + '">' +
    '<div class="thumb">' + img + '</div>' +
    '<button class="week-btn' + (r.semaine ? " on" : "") + '" data-week="' + r.id + '" title="Cette semaine">' +
      (r.semaine ? "✓" : "＋") + '</button>' +
    '<div class="card-body">' +
      '<div class="card-title">' + esc(r.nom) + '</div>' +
      (r.note ? '<div class="stars">' + stars(r.note) + '</div>' : "") +
      (db.fc.actif && db.phaseActuelle && scorePhase(r, db.phaseActuelle)
        ? '<div class="fit">' + PHASES_BASE[db.phaseActuelle].emo + ' ' + scorePhase(r, db.phaseActuelle) + ' ingrédient' +
          (scorePhase(r, db.phaseActuelle) > 1 ? "s" : "") + ' de ta phase</div>' : "") +
      (meta.length ? '<div class="card-meta">' + meta.map(m => "<span>" + m + "</span>").join("") + '</div>' : "") +
      (opts.footer || "") +
    '</div>' +
  '</article>';
}

function grille(list){
  if(!list.length) return '<div class="empty"><span class="big">🍋</span>Aucune recette ne correspond.</div>';
  return '<div class="grid">' + list.map(carte).join("") + '</div>';
}

/* carte + réglage du nombre de personnes pour cette semaine (page « Cette semaine » uniquement) :
   remplace le badge portions générique de la carte plutôt que de le doubler */

function viewGalerie(){

  }

}

function viewCycle(){
  const c = state.cycle;
  const P = phaseInfo(c);
  const notes = db.cycleNotes[c] || "";
  const ali = alimentsDeLaPhase(c);
  const list = db.recettes.filter(r => r.cycles.indexOf(c) >= 0)
    .sort((a,b) => scorePhase(b,c) - scorePhase(a,c) || a.nom.localeCompare(b.nom,"fr"));
  const actuelle = db.phaseActuelle === c;

  const fiche = [["Durée", P.duree], ["Hormones", P.hormones]]
    .concat(PHASE_CHAMPS.filter(([k]) => P[k]).map(([k, lbl]) => [lbl, P[k]]));

  let html = '<div class="phase-hero" style="margin-top:18px">' +
      '<span class="cycle-emo">' + P.emo + '</span>' +
      '<div style="flex:1"><h2>Phase ' + esc(c.toLowerCase()) + '</h2>' +
      '<div class="hint" style="margin:2px 0 0">' + esc(P.duree) + ' · ' + esc(P.hormones) + '</div></div>' +
      '<button class="btn sm' + (actuelle ? " primary" : "") + '" data-setphase="' + esc(c) + '">' +
        (actuelle ? "✓ Ma phase" : "C'est ma phase") + '</button>' +
    '</div>';

  html += '<div class="panel" style="margin-top:14px"><div class="repere">' +
    fiche.map(([k,v]) => '<div><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>').join("") +
    '</div></div>';

  if(P.physio) html += '<div class="panel"><div class="section-head"><h3>Physiologie</h3></div>' +
    '<p class="txt">' + esc(P.physio) + '</p></div>';
  if(P.manger) html += '<div class="panel"><div class="section-head"><h3>Quoi manger</h3></div>' +
    '<p class="txt">' + esc(P.manger) + '</p></div>';
  if(!P.physio && !P.manger && !ali.length){
    html += '<div class="notice">Cette phase n\'a pas encore de contenu. ' +
      'Ajoute tes propres repères et rattache des aliments depuis ⚙ Réglages → Food Cycling.</div>';
  }

  // aliments à privilégier : uniquement ceux propres à la phase
  const parCat = {};
  ali.forEach(a => (parCat[a.cat] = parCat[a.cat] || []).push(a));
  html += '<div class="section"><div class="section-head"><h3>Aliments à privilégier</h3>' +
    '<span class="count">' + ali.length + '</span></div><div class="panel">' +
    Object.keys(CAT_LBL).filter(k => parCat[k]).map(k =>
      '<div class="field"><label>' + esc(CAT_LBL[k]) + '</label><div class="chips">' +
      parCat[k].sort((a,b) => a.fr.localeCompare(b.fr,"fr")).map(a => pastilleAliment(a)).join("") +
      '</div></div>').join("") +
    '<p class="hint">🟢 IG bas · 🟡 IG moyen · 🔴 IG élevé · 🌱 à acheter bio (Dirty Dozen) · ✓ ok non bio (Clean Fifteen)</p>' +
    '</div></div>';

  html += '<div class="panel"><div class="field" style="margin:0">' +
      '<label>Mes notes — quoi privilégier / éviter</label>' +
      '<textarea class="note-area" id="cycle-notes" placeholder="Ce que je veux manger pendant cette phase, ce qui me fait du bien, ce que j\'évite…">' + esc(notes) + '</textarea>' +
      '<div class="fbar"><span class="hint" id="notes-state">Enregistré automatiquement</span>' +
      '<button class="btn sm" id="save-notes">Enregistrer</button></div>' +
    '</div></div>';

  html += '<div class="section"><div class="section-head"><h3>Recettes de cette phase</h3><span class="count">' + list.length + '</span></div>' +
    (list.length ? grille(list) :
      '<div class="empty"><span class="big">🌾</span>Aucune recette rattachée à la phase ' + esc(c.toLowerCase()) + '.</div>') +
    '</div><div style="height:26px"></div>';
  return html;
}

function pastilleAliment(a){
  const gi = a.gi === "L" ? "🟢" : a.gi === "M" ? "🟡" : a.gi === "H" ? "🔴" : "";
  const pe = a.pest === "D" ? "🌱" : a.pest === "C" ? "✓" : "";
  return '<span class="chip ali" title="' + esc(a.en + (a.gi ? " · " + GI_LBL[a.gi] : "") +
    (a.pest === "D" ? " · à acheter bio" : a.pest === "C" ? " · ok non bio" : "")) + '">' +
    esc(a.fr) + (gi ? ' ' + gi : "") + (pe ? ' ' + pe : "") + '</span>';
}

/* ---------- vue Courses ---------- */
function viewCourses(){
  const groupes = construireCourses();
  const nRec = db.recettes.filter(r => r.semaine).length;
  const nLignes = groupes.reduce((t,g) => t + g.lignes.length, 0);
  const nCochees = groupes.reduce((t,g) => t + g.lignes.filter(L => db.coursesCoches[L.cle]).length, 0);
  const termine = nLignes > 0 && nCochees === nLignes;

  let html = '<div class="section-head" style="margin-top:20px; justify-content:space-between">' +
    '<div style="display:flex; align-items:baseline; gap:9px"><h3>🧺 Liste de courses</h3>' +
    '<span class="count">' + nLignes + ' ligne' + (nLignes>1?"s":"") + ' · ' + nRec + ' recette' + (nRec>1?"s":"") + '</span></div>' +
    (nLignes ? '<span class="badge" id="courses-badge"' + (termine ? ' style="background:#e8f3ea; color:#3f7a4d"' : '') + '">' +
      (termine ? '✓ Terminée' : nCochees + ' / ' + nLignes) + '</span>' : '') +
  '</div>';

  if(!nLignes){
    return html + '<div class="empty"><span class="big">🛒</span>Aucune recette cochée « cette semaine ».<br>' +
      'Appuie sur <b>＋</b> en haut d\'une vignette pour commencer.</div>';
  }

  html += '<div class="fbar" style="margin-bottom:6px">' +
    '<button class="btn sm" id="add-course">+ Ajouter un article</button>' +
    '<span style="display:flex; gap:8px">' +
    '<button class="btn sm ghost" id="copy-courses">Copier</button>' +
    '<button class="btn sm ghost" id="reset-courses">Tout décocher</button></span></div>';

  groupes.forEach(g => {
    html += '<div class="section"><div class="section-head"><h3>' + esc(g.rayon) + '</h3>' +
      '<span class="count">' + g.lignes.length + '</span></div><div class="panel"><ul class="ing">' +
      g.lignes.map(L => {
        const q = afficheQte(L);
        const coche = !!db.coursesCoches[L.cle];
        return '<li data-course="' + esc(L.cle) + '" class="' + (coche ? "done" : "") + '">' +
          '<span class="box">✓</span>' +
          '<span style="flex:1"><b>' + esc(L.nom) + '</b>' + (q ? ' <span class="qte">' + esc(q) + '</span>' : "") +
          (L.ali && L.ali.pest === "D" ? '<span class="tagali bio">bio</span>' : "") +
          (L.alg ? '<span class="alg" style="margin-left:6px">allergène</span>' : "") +
          (L.recettes.length ? '<span class="src">' + esc(L.recettes.join(" · ")) + '</span>' : "") +

  });
  return html + '<div style="height:30px"></div>';
}

/* met à jour le badge de progression sans tout redessiner : cocher un
   article ne doit pas faire sauter le défilement de la liste */
function majBadgeCourses(){
  const b = document.getElementById("courses-badge");
  if(!b) return;
  const groupes = construireCourses();
  const nLignes = groupes.reduce((t,g) => t + g.lignes.length, 0);
  const nCochees = groupes.reduce((t,g) => t + g.lignes.filter(L => db.coursesCoches[L.cle]).length, 0);
  const termine = nLignes > 0 && nCochees === nLignes;
  b.textContent = termine ? "✓ Terminée" : (nCochees + " / " + nLignes);
  b.style.background = termine ? "#e8f3ea" : "";
  b.style.color = termine ? "#3f7a4d" : "";
}

/* ---------- page Aliments : le catalogue, toujours accessible ----------
   L'index glycémique, le repère bio, la catégorie et les synonymes sont
   des informations générales. Les phases du cycle ne s'affichent que si
   Food Cycling est activé. */
const GI_CHOIX   = [["","Non renseigné"], ["L","🟢 IG bas"], ["M","🟡 IG moyen"], ["H","🔴 IG élevé"]];
const PEST_CHOIX = [["","Non renseigné"], ["D","🌱 À acheter bio"], ["C","✓ Ok non bio"]];

function viewAliments(){
  const q = (state.qAli || "").trim().toLowerCase();
  const f = state.filtreAli || "";
  let liste = ALIMENTS.slice();
  if(q) liste = liste.filter(a => (a.fr + " " + a.en).toLowerCase().indexOf(q) >= 0);
  if(f === "__perso")      liste = liste.filter(a => a.perso);
  else if(f === "__bio")   liste = liste.filter(a => a.pest === "D");
  else if(f === "__sansIG")liste = liste.filter(a => !a.gi);
  else if(f === "__sansPhase") liste = liste.filter(a => !a.phases.length);
  else if(f && CAT_LBL[f]) liste = liste.filter(a => a.cat === f);
  else if(f)               liste = liste.filter(a => a.phases.indexOf(f) >= 0);
  liste.sort((a,b) => a.fr.localeCompare(b.fr, "fr"));

  let html = '<div style="margin-top:16px"><button class="btn sm ghost" id="back">‹ Retour</button></div>' +
    '<div class="section-head" style="margin-top:12px"><h3>Aliments</h3>' +
    '<span class="count">' + ALIMENTS.length + '</span></div>' +
    '<p class="hint" style="margin:0 0 12px">Index glycémique, repère bio, catégorie, noms et synonymes. ' +
    'Touche un aliment pour le modifier.' +
    (db.fc.actif ? ' Les phases du cycle se règlent au même endroit.' : '') + '</p>';

  html += '<div class="searchbar" style="margin-top:0"><input id="q-ali" type="search" ' +
    'placeholder="Chercher un aliment…" value="' + esc(state.qAli || "") + '"></div>';

  const filtres = [["","Tous"]]
    .concat(Object.keys(CAT_LBL).map(k => [k, CAT_LBL[k]]))
    .concat([["__bio","🌱 Bio conseillé"], ["__sansIG","Sans IG"], ["__perso","Ajoutés par moi"]])
    .concat(db.fc.actif ? CYCLES.map(c => [c, PHASES_BASE[c].emo + " " + c]).concat([["__sansPhase","Sans phase"]]) : []);
  html += '<div class="chips" style="margin:10px 0 4px">' +
    filtres.map(([v,l]) => '<button type="button" class="chip' + (f === v ? " on" : "") +
      '" data-fali="' + esc(v) + '">' + esc(l) + '</button>').join("") + '</div>';

  html += '<div class="fbar"><button class="btn sm" id="ali-new">+ Nouvel aliment</button>' +
    '<span class="hint">' + liste.length + ' affiché' + (liste.length > 1 ? "s" : "") + '</span></div>';

  if(!liste.length) return html + '<div class="empty"><span class="big">🥬</span>Aucun aliment ne correspond.</div>';

  html += '<div class="panel" style="margin-top:10px">' +
    liste.slice(0, 250).map(a => ligneAliment(a)).join("") + '</div>';
  if(liste.length > 250) html += '<p class="hint">250 premiers affichés — affine la recherche.</p>';
  return html + '<div style="height:30px"></div>';
}

function ligneAliment(a){
  const ouvert = state.aliEdit === a.en;
  const syn = Object.keys(db.synonymes || {}).filter(k => db.synonymes[k] === a.en);

  let html = '<div class="ali-row' + (ouvert ? " ouvert" : "") + '">' +
    '<div class="ali-nom" data-aliedit="' + esc(a.en) + '"><b>' + esc(a.fr) + '</b>' +
      (a.fr !== a.en ? '<span class="ali-en">' + esc(a.en) + '</span>' : "") +
      '<span class="ali-meta">' + esc(CAT_LBL[a.cat] || "") +
        (a.gi ? ' · ' + esc(GI_LBL[a.gi]) : "") +
        (a.pest === "D" ? ' · 🌱 bio' : a.pest === "C" ? ' · ✓ non bio ok' : "") +
        (syn.length ? ' · ' + syn.length + ' synonyme' + (syn.length>1?"s":"") : "") +
        (a.perso ? ' · ajouté par moi' : "") +
      '</span></div>';

  if(db.fc.actif){
    html += '<div class="chips ali-phases">' + CYCLES.map(c =>
      '<button type="button" class="chip mini-chip' + (a.phases.indexOf(c) >= 0 ? " on" : "") +
      '" data-aliphase="' + esc(a.en) + '|' + esc(c) + '" title="' + esc(c) + '">' +
      PHASES_BASE[c].emo + '</button>').join("") + '</div>';
  }
  html += '<button class="mini" data-aliedit="' + esc(a.en) + '" title="Modifier">' + (ouvert ? "▾" : "✎") + '</button>';
  html += '</div>';

  if(!ouvert) return html;

  // carte d'édition dépliée
  html += '<div class="ali-edit">' +
    '<div class="row">' +
      '<div class="field"><label>Nom (français)</label><input id="ae-fr" value="' + esc(a.fr) + '"></div>' +
      '<div class="field"><label>Nom (anglais)</label><input id="ae-en" value="' + esc(a.en) + '"' +
        (a.perso ? '' : ' disabled title="Le nom anglais sert de clé pour les aliments du catalogue"') + '></div>' +
    '</div>' +
    '<div class="field"><label>Catégorie</label><div class="chips" data-aegroup="cat">' +
      Object.keys(CAT_LBL).map(k => '<button type="button" class="chip' + (a.cat === k ? " on" : "") +
        '" data-aeval="' + k + '">' + esc(CAT_LBL[k]) + '</button>').join("") + '</div></div>' +
    '<div class="field"><label>Index glycémique</label><div class="chips" data-aegroup="gi">' +
      GI_CHOIX.map(([v,l]) => '<button type="button" class="chip' + (a.gi === v ? " on" : "") +
        '" data-aeval="' + v + '">' + esc(l) + '</button>').join("") + '</div></div>' +
    '<div class="field"><label>Pesticides</label><div class="chips" data-aegroup="pest">' +
      PEST_CHOIX.map(([v,l]) => '<button type="button" class="chip' + (a.pest === v ? " on" : "") +
        '" data-aeval="' + v + '">' + esc(l) + '</button>').join("") + '</div></div>' +
    (db.fc.actif
      ? '<div class="field"><label>Phases du cycle</label><div class="chips">' +
        CYCLES.map(c => '<button type="button" class="chip' + (a.phases.indexOf(c) >= 0 ? " on" : "") +
          '" data-aliphase="' + esc(a.en) + '|' + esc(c) + '">' + PHASES_BASE[c].emo + ' ' + esc(c) + '</button>').join("") +
        '</div></div>'
      : '') +
    '<div class="field"><label>Synonymes reconnus dans mes recettes</label><div class="chips">' +
      syn.map(k => '<button type="button" class="chip" data-rmsyn="' + esc(k) + '">' + esc(k) + ' ✕</button>').join("") +
      '<button type="button" class="chip add" data-addsyn="' + esc(a.en) + '">+ ajouter</button>' +
    '</div><p class="hint" style="margin:6px 0 0">Ex. « patate douce rôtie » pour retrouver cet aliment.</p></div>' +
    '<div class="actions" style="margin:14px 0 0">' +
      '<button class="btn primary" id="ae-save">Enregistrer</button>' +
      '<button class="btn ghost" id="ae-close">Fermer</button>' +
      '<button class="btn danger" data-alidel="' + esc(a.en) + '">' + (a.perso ? "Supprimer" : "Retirer de ma liste") + '</button>' +
    '</div></div>';
  return html;
}

/* =========================================================
   7. FICHE RECETTE
   ========================================================= */
function viewFiche(){
  const r = getRecette(state.ficheId);
  if(!r) return '<div class="empty">Recette introuvable.</div>';

  const pills = []
    .concat(r.statut ? ['<span class="pill">' + esc(r.statut) + '</span>'] : [])
    .concat(r.meal ? ['<span class="pill acc">' + (MEAL_EMO[r.meal]||"") + " " + esc(r.meal) + '</span>'] : [])
    .concat(r.cuisines.map(c => '<span class="pill">' + esc(c) + '</span>'))
    .concat(r.tags.map(c => '<span class="pill">' + esc(c) + '</span>'))
    .concat(r.seasons.map(c => '<span class="pill">' + esc(c) + '</span>'))
    .concat(db.fc.actif ? r.cycles.map(c => '<span class="pill acc">' + (CYCLE_EMO[c]||"") + " " + esc(c) + '</span>') : [])
    .concat(r.diff ? ['<span class="pill">' + esc(r.diff) + '</span>'] : []);

  let html = '<div style="margin-top:16px">' +
    '<button class="btn sm ghost" id="back">‹ Retour</button></div>';

  html += '<div class="hero" style="margin-top:12px">' +
    (r.image ? '<img src="' + esc(r.image) + '" alt="">' : (MEAL_EMO[r.meal] || "🍳")) + '</div>';

  html += '<h2 style="font-size:23px">' + esc(r.nom) + '</h2>';
  if(r.note) html += '<div class="stars" style="font-size:16px; margin-top:5px">' + stars(r.note) + '</div>';
  if(r.description) html += '<p class="desc">' + esc(r.description) + '</p>';
  if(r.url) html += '<div style="margin-top:7px; font-size:14px"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">🔗 Voir la source</a></div>';
  html += '<div style="margin-top:11px">' + pills.join("") + '</div>';

  html += '<div class="actions">' +
    '<button class="btn' + (r.semaine ? " primary" : "") + '" data-week="' + r.id + '">' +
      (r.semaine ? "✓ Dans ma semaine" : "＋ Cette semaine") + '</button>' +
    '<button class="btn" id="edit">✎ Modifier</button>' +
    '<button class="btn" id="dup">⧉ Dupliquer</button>' +
    '<button class="btn danger" id="del">Supprimer</button>' +
  '</div>';

  // temps / portions
  html += '<div class="panel" style="margin-top:18px"><div class="stat-grid">' +
    '<div class="stat"><b>' + fmtMin(r.prep) + '</b><span>Préparation</span></div>' +
    '<div class="stat"><b>' + fmtMin(r.cuisson) + '</b><span>Cuisson</span></div>' +
    '<div class="stat"><b>' + fmtMin(total(r)) + '</b><span>Total</span></div>' +
    '<div class="stat"><b>' + (r.portions || "—") + '</b><span>Portions</span></div>' +
  '</div></div>';

  // nutrition
  if(r.kcal || r.prot || r.gluc || r.lip){
    html += '<div class="section"><div class="section-head"><h3>Nutrition</h3><span class="count">par portion</span></div>' +
      '<div class="panel"><div class="stat-grid">' +
      '<div class="stat"><b>' + (r.kcal||0) + '</b><span>kcal</span></div>' +
      '<div class="stat"><b>' + (r.prot||0) + ' g</b><span>Protéines</span></div>' +
      '<div class="stat"><b>' + (r.gluc||0) + ' g</b><span>Glucides</span></div>' +
      '<div class="stat"><b>' + (r.lip||0) + ' g</b><span>Lipides</span></div>' +
      '</div></div></div>';
  }

  // ingrédients + reconnaissance des aliments de la phase
  if(r.ingredients.length){
    const ph = db.fc.actif ? db.phaseActuelle : "";
    const trouves = alimentsDeRecette(r, ph);
    const parIng = {};
    trouves.forEach(t => parIng[t.k] = t);
    const n = ph ? trouves.filter(t => t.pertinent).length : 0;

    html += '<div class="section"><div class="section-head"><h3>Ingrédients</h3><span class="count">' +
      r.ingredients.length + '</span></div>' +
      (ph ? '<div class="notice" style="margin-bottom:12px">' + PHASES_BASE[ph].emo + ' <b>' + n + ' ingrédient' +
        (n>1?"s":"") + '</b> adapté' + (n>1?"s":"") + ' à ta phase ' + esc(ph.toLowerCase()) +
        (n ? "." : " — cette recette n'est pas particulièrement ciblée.") + '</div>' : "") +
      '<div class="panel"><ul class="ing">' +
      r.ingredients.map((i, k) => {
        const t = db.fc.actif ? parIng[k] : null;
        const a = t ? t.ali : null;
        let badges = "";
        if(a){
          const cible = ph && a.phases.indexOf(ph) >= 0;
          badges += '<span class="tagali' + (cible ? " cible" : "") + '" title="' + esc(a.en + " · " + CAT_LBL[a.cat]) + '">' +
            (cible ? PHASES_BASE[ph].emo + " " : "") + esc(a.fr) + '</span>';
          if(a.gi) badges += '<span class="tagali gi' + a.gi + '">' + esc(GI_LBL[a.gi]) + '</span>';
          if(a.pest === "D") badges += '<span class="tagali bio">bio conseillé</span>';
        }
        return '<li data-ing="' + k + '" class="' + (state.checked[r.id + "-" + k] ? "done" : "") + '">' +
          '<span class="box">✓</span><span>' + esc(i.txt) + badges + '</span>' +
          (i.alg ? '<span class="alg">allergène</span>' : "") + '</li>';
      }).join("") +
      '</ul></div></div>';
  }

  // étapes
  if(r.etapes.length){
    html += '<div class="section"><div class="section-head"><h3>Préparation</h3><span class="count">' +
      r.etapes.length + ' étapes</span></div><div class="panel"><ol class="steps">' +
      r.etapes.map(e => '<li><span>' + esc(e) + '</span></li>').join("") + '</ol></div></div>';
  }

  // infos complémentaires
  if(r.allergenes || r.ingredientCle || r.groupe){
    html += '<div class="section"><div class="section-head"><h3>Informations</h3></div><div class="panel">' +
      (r.allergenes ? '<div class="field"><label>Allergènes</label>' + esc(r.allergenes) + '</div>' : "") +
      (r.ingredientCle ? '<div class="field"><label>Ingrédient clé</label>' + esc(r.ingredientCle) + '</div>' : "") +
      (r.groupe ? '<div class="field" style="margin-bottom:0"><label>Groupe alimentaire</label>' + esc(r.groupe) + '</div>' : "") +
    '</div></div>';
  }
  return html + '<div style="height:30px"></div>';
}

/* ---------- parsing du texte collé ---------- */
function parseTexte(txt){
  const d = vide();
  const lines = txt.replace(/\r/g,"").split("\n").map(l => l.trim());
  const isIngHead = l => /^(ingr[ée]dients?|ingredients?)\b/i.test(l);
  const isStepHead = l => /^(pr[ée]paration|instructions?|[ée]tapes?|m[ée]thode|method|directions?|r[ée]alisation|pr[ée]parer)\b/i.test(l);

  let mode = "head", nom = "", ings = [], steps = [];
  for(let raw of lines){
    const l = raw;
    if(!l) continue;
    const url = l.match(/https?:\/\/\S+/);
    if(url && !d.url){ d.url = url[0]; if(/^https?:\/\/\S+$/.test(l)) continue; }

    let m = l.match(/pr[ée]paration\s*:?\s*(\d+)\s*(?:min|mn|minutes)/i);
    if(m){ d.prep = num(m[1]); continue; }
    m = l.match(/(?:cuisson|cook(?:ing)?\s*time)\s*:?\s*(\d+)\s*(?:min|mn|minutes)?/i);
    if(m){ d.cuisson = num(m[1]); continue; }
    m = l.match(/(?:pour|serves?|portions?|parts?)\s*:?\s*(\d+)\s*(?:personnes?|pers\.?|portions?|parts?)?/i);
    if(m && num(m[1]) > 0 && num(m[1]) < 30 && /personne|portion|part|serve|pour/i.test(l)){ d.portions = num(m[1]); continue; }

    if(isIngHead(l)){ mode = "ing"; continue; }
    if(isStepHead(l)){ mode = "step"; continue; }

    if(mode === "head"){
      if(!nom){ nom = l.replace(/^#+\s*/,""); continue; }
      // heuristique : ligne qui ressemble à un ingrédient
      if(/^[-•*·]|^\d+([.,]\d+)?\s*(g|kg|ml|cl|l|c\.|cs|cc|cuill|tbsp|tsp|oz|lb|pcs?)\b/i.test(l)){ mode = "ing"; ings.push(l); continue; }
      if(l.length > 90){ mode = "step"; steps.push(l); continue; }
      continue;
    }
    if(mode === "ing"){
      if(l.length > 140){ mode = "step"; steps.push(l); continue; }
      ings.push(l);
    }else{
      steps.push(l);
    }
  }
  // un « titre » de 200 caractères n'en est pas un (JSON collé, paragraphe entier…)
  d.nom = (nom && nom.length <= 160) ? nom : "Sans titre";
  d.ingredients = ings.map(t => ({ txt: t.replace(/^[-•*·]\s*/,"").trim(), alg:false })).filter(i => i.txt);
  if(!d.ingredients.length) d.ingredients = [{txt:"",alg:false}];
  d.etapes = steps.map(s => s.replace(/^\s*(?:\d+\s*[.)-]|[-•*·])\s*/,"").trim()).filter(Boolean);
  return d;
}

/* ---------- extraction schema.org / Recipe (JSON-LD) ---------- */
function ldFirst(x){ return (x && typeof x !== "string" && x.length) ? x[0] : x; }

function ldTexte(x){
  if(x == null) return "";
  if(typeof x === "string") return x.replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
  if(typeof x === "number") return String(x);
  if(Array.isArray(x)) return ldTexte(x[0]);
  if(x.text) return ldTexte(x.text);
  if(x.name) return ldTexte(x.name);
  return "";
}

/* comme ldTexte, mais conserve les retours à la ligne (une étape en contient souvent plusieurs) */
function ldTexteMulti(x){
  if(x == null) return "";
  if(typeof x === "number") return String(x);
  if(typeof x === "string"){
    return x.replace(/<br\s*\/?>/gi, "\n")
            .replace(/<\/(p|li|div|h[1-6])>/gi, "\n")
            .replace(/<[^>]*>/g, " ")
            .replace(/&nbsp;/g, " ")
            .replace(/[ \t ]+/g, " ")
            .replace(/ *\n+ */g, "\n")
            .trim();
  }
  if(Array.isArray(x)) return ldTexteMulti(x[0]);
  if(x.text != null) return ldTexteMulti(x.text);
  if(x.name) return ldTexteMulti(x.name);
  return "";
}
function ldLignes(s){ return String(s || "").split("\n").map(l => l.trim()).filter(Boolean); }
/* titre de section utile ? « Get started » oui, « Step 2 » non */
function ldTitre(n){
  const t = ldTexte(n);
  return (t && !/^(step|[ée]tape|instructions?)\s*\d*$/i.test(t)) ? t : "";
}

/* aplatit recipeInstructions : string | [string] | [HowToStep] | [HowToSection] */
function ldListe(x){
  if(!x) return [];
  if(typeof x === "string") return ldLignes(ldTexteMulti(x));
  if(!Array.isArray(x)) x = [x];
  let out = [];
  x.forEach(e => {
    let lignes, titre = "";
    if(e && e.itemListElement){ lignes = ldListe(e.itemListElement); titre = ldTitre(e.name); }
    else {
      lignes = ldLignes(ldTexteMulti(e && e.text != null ? e.text : e));
      titre = (e && typeof e === "object") ? ldTitre(e.name) : "";
    }
    if(!lignes.length && titre) lignes = [titre];
    else if(titre && lignes.length && lignes[0].toLowerCase() !== titre.toLowerCase()){
      lignes[0] = titre + " — " + lignes[0];
    }
    out = out.concat(lignes);
  });
  return out;
}

function ldImage(x){
  if(!x) return "";
  if(typeof x === "string") return x;
  if(Array.isArray(x)) return ldImage(x[0]);
  if(x.url) return ldImage(x.url);
  return "";
}

/* PT1H30M / PT45M → minutes */
function ldDuree(s){
  if(!s) return 0;
  if(typeof s === "number") return s;
  const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(String(s).trim());
  if(!m) return num(String(s).match(/\d+/));
  return num(m[1])*1440 + num(m[2])*60 + num(m[3]);
}
function ldNombre(x){
  if(x == null) return 0;
  const m = String(ldFirst(x)).replace(",", ".").match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}

/* cherche récursivement un objet @type Recipe (gère tableaux et @graph) */
function ldTrouverRecette(node, prof){
  prof = prof || 0;
  if(!node || prof > 8) return null;
  if(Array.isArray(node)){
    for(const n of node){ const r = ldTrouverRecette(n, prof+1); if(r) return r; }
    return null;
  }
  if(typeof node !== "object") return null;
  const t = node["@type"];
  if(t && (t === "Recipe" || (Array.isArray(t) && t.indexOf("Recipe") >= 0))) return node;
  if(node["@graph"]) return ldTrouverRecette(node["@graph"], prof+1);
  for(const k of ["mainEntity","mainEntityOfPage","itemListElement","hasPart"]){
    if(node[k]){ const r = ldTrouverRecette(node[k], prof+1); if(r) return r; }
  }
  return null;
}

/* objet Recipe (ou payload du bookmarklet) → brouillon de formulaire */
function ldVersDraft(R, urlPage){
  const d = vide();
  const nu = R.nutrition || {};
  d.nom      = ldTexte(R.nom || R.name) || "Sans titre";
  const idUrl = String(R["@id"] || "").split("#")[0];
  d.url      = R.url || (idUrl.indexOf("http") === 0 ? idUrl : "") || urlPage || "";
  d.image    = R.image ? ldImage(R.image) : "";
  d.prep     = R.prep != null ? num(R.prep) : ldDuree(R.prepTime);
  d.cuisson  = R.cuisson != null ? num(R.cuisson) : ldDuree(R.cookTime);
  const totalSrc = ldDuree(R.totalTime);

  // Mindful Chef publie son temps TOTAL dans le champ « cookTime » : on rétablit
  if(/mindfulchef\./i.test(d.url) && d.cuisson){
    const vraiTotal = d.cuisson;
    d.cuisson = Math.max(0, vraiTotal - d.prep);
  }
  // garde-fou général : prep + cuisson ne peut pas dépasser un total explicite
  else if(totalSrc && d.prep && d.cuisson && d.prep + d.cuisson > totalSrc && d.prep < totalSrc){
    d.cuisson = totalSrc - d.prep;
  }
  // un seul temps disponible → c'est le temps total, et il ne va jamais dans « cuisson »
  if(!d.prep && !d.cuisson) d.prep = totalSrc;
  d.portions = R.portions != null ? num(R.portions) : ldNombre(R.recipeYield);
  d.kcal = R.kcal != null ? num(R.kcal) : ldNombre(nu.calories);
  d.prot = R.prot != null ? num(R.prot) : ldNombre(nu.proteinContent);
  d.gluc = R.gluc != null ? num(R.gluc) : ldNombre(nu.carbohydrateContent);
  d.lip  = R.lip  != null ? num(R.lip)  : ldNombre(nu.fatContent);

  const ing = R.ingredients || R.recipeIngredient;
  d.ingredients = (Array.isArray(ing) ? ing : ldListe(ing))
    .map(i => typeof i === "string" ? {txt: ldTexte(i), alg:false} : {txt: ldTexte(i.txt || i), alg: !!i.alg})
    .filter(i => i.txt);
  if(!d.ingredients.length) d.ingredients = [{txt:"", alg:false}];

  d.etapes = Array.isArray(R.etapes) ? R.etapes.map(ldTexte).filter(Boolean) : ldListe(R.recipeInstructions);

  // Meal Type depuis recipeCategory
  const cat = ldTexte(ldFirst(R.cat || R.recipeCategory));
  if(cat){
    const hit = MEALS.find(m => m.toLowerCase() === cat.toLowerCase());
    if(hit) d.meal = hit;
    else if(/dessert|sweet/i.test(cat)) d.meal = "Dessert";
    else if(/breakfast|petit.d[ée]j/i.test(cat)) d.meal = "Breakfast";
    else if(/entertain|group|party|f[êe]te|convivial|partager/i.test(cat)) d.meal = "Entertaining";
    else if(/plat|main|dinner|lunch/i.test(cat)) d.meal = "Main course";
    else if(/boisson|drink|beverage|cocktail/i.test(cat)) d.meal = "Beverages";
    else if(/snack|go[ûu]ter|ap[ée]ritif/i.test(cat)) d.meal = "Snacks";
    else if(/accompagnement|side|salade|entr[ée]e/i.test(cat)) d.meal = "Side dish";
  }
  // Cuisine depuis recipeCuisine
  const cui = ldTexte(ldFirst(R.cuis || R.recipeCuisine));
  if(cui){
    const hit = db.cuisines.find(c => normLibelle(c) === normLibelle(cui));
    if(hit) d.cuisines = [hit];
    else { const v = cui.charAt(0).toUpperCase() + cui.slice(1); db.cuisines.push(v); d.cuisines = [v]; save(); }
  }

  d.description = ldTexte(R.desc || R.description);

  // mots-clés, auteur et catégorie → on ne retient que ce qui existe déjà dans mes listes
  const mots = [];
  const kw = R.kw || R.keywords;
  if(kw) String(Array.isArray(kw) ? kw.join(",") : kw).split(/[,;|]/).forEach(k => mots.push(k.trim()));
  const auteur = ldTexte(R.auteur || (R.author && (R.author.name || R.author)));
  if(auteur) mots.push(auteur);
  if(cat && !d.meal) mots.push(cat);   // « Italian » rangé dans Cuisine plutôt que perdu
  mots.filter(Boolean).forEach(m => {
    const t = db.tags.find(x => normLibelle(x) === normLibelle(m));
    if(t && d.tags.indexOf(t) < 0) d.tags.push(t);
    const c = db.cuisines.find(x => normLibelle(x) === normLibelle(m));
    if(c && d.cuisines.indexOf(c) < 0) d.cuisines.push(c);
    const s = SEASONS.find(x => normLibelle(x) === normLibelle(m));
    if(s && d.seasons.indexOf(s) < 0) d.seasons.push(s);
  });
  return d;
}

/* compare des libellés en ignorant casse, emoji et ponctuation : « ❤️ Favorite » ≡ « favorite » */
function normLibelle(s){
  let t = String(s || "").toLowerCase();
  try{ t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
  return t.replace(/[^a-z0-9]+/g, " ").trim();
}

/* point d'entrée unique : JSON-LD, payload bookmarklet, ou texte brut */
function importerContenu(txt){
  const t = (txt || "").trim();
  if(!t) return null;

  // du JSON ne doit JAMAIS finir dans le champ « nom » : on préfère un message clair
  if(t.charAt(0) === "{" || t.charAt(0) === "["){
    let p = null;
    try{ p = JSON.parse(t); }catch(e){ state.erreurImport = "Ce texte ressemble à du JSON mais il est incomplet ou abîmé."; return null; }
    const rec = ldTrouverRecette(p);
    if(rec) return fusionner(ldVersDraft(rec, ""));
    if(Array.isArray(p)){
      state.erreurImport = "On dirait un lot de recettes : utilise plutôt l'onglet ⇪ Import JSON.";
      return null;
    }
    if(p && (p.nom || p.name || p.texte || p.ld)) return payloadVersDraft(p);
    state.erreurImport = "JSON lu, mais aucune recette reconnue dedans.";
    return null;
  }
  // essai : extraire un <script type="application/ld+json"> collé avec du HTML autour
  const m = t.match(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/i);
  if(m){
    try{
      const rec = ldTrouverRecette(JSON.parse(m[1]));
      if(rec) return ldVersDraft(rec, "");
    }catch(e){}
  }
  return parseTexte(t);
}

/* ---------- rattrapage des étapes collées bout à bout ----------
   Les anciennes versions du bookmarklet écrasaient les retours à la ligne :
   « …Drain the prawns Heat the large frying pan… ». On recoupe uniquement là où
   un mot en minuscule est suivi d'un verbe d'action capitalisé — pas au hasard. */
const VERBES_ETAPE = [
"Heat","Meanwhile","When","While","Once","Stir","Add","Cook","Serve","Share","Season","Check",
"Place","Remove","Drain","Mix","Bring","Preheat","Pour","Transfer","In","Roughly","Finely",
"Thinly","Set","Divide","Sprinkle","Garnish","Top","Reduce","Simmer","Boil","Whisk","Fold",
"Chop","Slice","Cut","Peel","Rinse","Cover","Leave","Allow","Repeat","Enjoy","Return","Spoon",
"Scatter","Toss","Taste","Next","Then","Finally","Turn","Lower","Increase","Continue","Warm",
"Melt","Combine","Blend","Crush","Grate","Squeeze","Trim","Quarter","Halve","Dice","Tip","Wash",
"Discard","Reserve","Keep","Make","Prepare","Assemble","Fill","Line","Bake","Roast","Grill",
"Fry","Steam","Blanch","Marinate","Chill","Rest",
"Ajouter","Mélanger","Verser","Cuire","Faire","Laisser","Servir","Réserver","Retirer","Égoutter",
"Saler","Poivrer","Chauffer","Préchauffer","Incorporer","Déposer","Couvrir","Pendant","Ensuite",
"Puis","Enfin","Éplucher","Émincer","Couper","Hacher","Rincer","Battre","Fouetter","Parsemer",
"Assaisonner","Goûter","Dresser","Enfourner","Remuer","Porter","Baisser","Répéter","Décorer"
].join("|");

function reparerEtapesFusionnees(etapes){
  const re = new RegExp("([a-zà-ÿ0-9\\)\\]]) (" + VERBES_ETAPE + ")\\b", "g");
  const out = [];
  (etapes || []).forEach(e => {
    String(e).replace(re, "$1\n$2").split("\n").forEach(x => {
      x = x.trim();
      if(x) out.push(x);
    });
  });
  return out;
}

/* payload reçu du bookmarklet / du Raccourci iOS ; « texte » = repli sans JSON-LD */
function payloadVersDraft(o){
  // bookmarklet périmé : il envoyait des champs déjà mâchés au lieu des données brutes
  state.vieuxBM = !!(o && !o.v && (o.etapes || o.ingredients || o.cat));
  state.etapesReparees = 0;

  if(o && o.ld){
    const rec = ldTrouverRecette(o.ld) || o.ld;
    const d = ldVersDraft(rec, o.url || "");
    if((!d.nom || d.nom === "Sans titre") && o.titre){
      d.nom = String(o.titre).split(/\s+[|·—–-]\s+/)[0].trim();
    }
    return fusionner(d);
  }
  const rec = ldTrouverRecette(o);
  if(rec) return fusionner(ldVersDraft(rec, o.url || ""));

  // payload d'un ancien bookmarklet : étapes déjà (mal) découpées → on rattrape
  if(state.vieuxBM && Array.isArray(o.etapes) && o.etapes.length){
    const d = ldVersDraft(o, o.url || "");
    const avant = d.etapes.length;
    d.etapes = reparerEtapesFusionnees(d.etapes);
    state.etapesReparees = d.etapes.length > avant ? d.etapes.length : 0;
    return fusionner(d);
  }
  if(o && o.texte && !(o.ingredients && o.ingredients.length)){
    const d = parseTexte(o.texte);
    // titre de page « Ma recette — Nom du site » → on garde la partie utile,
    // et seulement si elle apparaît vraiment dans le début de la page
    const titre = String(o.nom || "").split(/\s+[|·—–-]\s+/)[0].trim();
    const debut = String(o.texte).slice(0, 400).toLowerCase();
    if(titre && debut.indexOf(titre.toLowerCase()) >= 0) d.nom = titre;
    else if(titre && (!d.nom || d.nom === "Sans titre")) d.nom = titre;
    if(o.url) d.url = o.url;
    return fusionner(d);
  }
  return fusionner(ldVersDraft(o, o.url || ""));
}

/* même URL déjà en base ? on met à jour au lieu de créer un doublon,
   et surtout on ne piétine pas ce qui a été rempli à la main */
function fusionner(d){
  state.majExistante = false;
  if(!d.url) return d;
  const clef = u => String(u || "").replace(/[?#].*$/, "").replace(/\/+$/, "").toLowerCase();
  const ex = db.recettes.find(r => r.url && clef(r.url) === clef(d.url));
  if(!ex) return d;

  d.id = ex.id;
  state.majExistante = true;
  // champs personnels : ils gagnent toujours
  d.statut  = ex.statut;
  d.note    = ex.note;
  d.semaine = ex.semaine;
  d.semainePortions = ex.semainePortions;
  d.cycles  = ex.cycles.slice();
  d.diff    = ex.diff || d.diff;
  d.meal    = ex.meal || d.meal;
  d.portions = ex.portions || d.portions;
  d.allergenes    = ex.allergenes || d.allergenes;
  d.ingredientCle = ex.ingredientCle || d.ingredientCle;
  d.groupe        = ex.groupe || d.groupe;
  d.image         = d.image || ex.image;
  d.description   = d.description || ex.description;
  d.tags     = Array.from(new Set(ex.tags.concat(d.tags)));
  d.cuisines = Array.from(new Set(ex.cuisines.concat(d.cuisines)));
  d.seasons  = ex.seasons.length ? ex.seasons.slice() : d.seasons;
  // les allergènes cochés à la main sur les ingrédients sont reportés
  const alg = {};
  ex.ingredients.forEach(i => { if(i.alg) alg[i.txt.toLowerCase()] = true; });
  d.ingredients.forEach(i => { if(alg[i.txt.toLowerCase()]) i.alg = true; });
  return d;
}

/* ---------- import « en un clic » : #import=... ---------- */
function lireHashImport(){
  const h = location.hash || "";
  const i = h.indexOf("import=");
  if(i < 0) return false;
  let payload = h.slice(i + 7);
  try{
    payload = decodeURIComponent(payload);
    const o = JSON.parse(payload);
    state.formDraft = payloadVersDraft(o);
    state.formTab = "manuel";
    state.view = "form";
    nettoyerHash();
    setTimeout(() => toast("Recette importée — vérifie puis enregistre"), 300);
    return true;
  }catch(e){
    nettoyerHash();
    setTimeout(() => toast("Données d'import illisibles"), 300);
    return false;
  }
}
function nettoyerHash(){
  try{ history.replaceState(null, "", location.pathname + location.search); }
  catch(e){ location.hash = ""; }
}

/* =========================================================
   4d. COUCHE FOOD CYCLING : import, export, édition
   Aucune de ces données ne vit dans le code : elles arrivent d'un
   fichier ou de la saisie, et restent dans le navigateur.
   ========================================================= */
function fcExport(){
  const data = JSON.stringify({
    schemaVersion: 1,
    kind: "recipe-book-foodcycling",
    exportedAt: new Date().toISOString().slice(0,10),
    phases: db.fc.phases,
    assoc: db.fc.assoc,
    aliments: db.aliments.perso
  }, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "foodcycling.private.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast("Couche Food Cycling exportée ✓");
}

function fcImport(texte){
  let p;
  try{ p = JSON.parse(texte); }
  catch(e){ toast("Fichier illisible"); return false; }
  if(!p || (!p.assoc && !p.phases && !p.aliments)){
    toast("Ce fichier ne contient pas de données Food Cycling");
    return false;
  }
  // les phases inconnues sont ignorées plutôt que d'introduire des libellés fantômes
  const phases = {};
  CYCLES.forEach(c => { if(p.phases && p.phases[c]) phases[c] = p.phases[c]; });

  const assoc = {};
  Object.keys(p.assoc || {}).forEach(k => {
    const liste = arr(p.assoc[k]).filter(x => CYCLES.indexOf(x) >= 0);
    if(liste.length) assoc[k] = liste;
  });

  // aliments personnalisés du fichier : rejoignent mon catalogue directement,
  // plutôt qu'une couche à part que rien ne relit (voir construireAliments)
  (Array.isArray(p.aliments) ? p.aliments : []).forEach(a => {
    const en = String(a.en || a.fr || "").trim();
    if(!en) return;
    const connu = db.aliments.perso.find(x => normLibelle(x.en) === normLibelle(en)) ||
                  ALIMENTS_BASE.find(x => normLibelle(x[0] || x[1]) === normLibelle(en));
    if(!connu){
      db.aliments.perso.push({
        en: en, fr: String(a.fr || en).trim(),
        cat: CAT_LBL[a.cat] ? a.cat : "O",
        gi: GI_LBL[a.gi] ? a.gi : "",
        pest: (a.pest === "D" || a.pest === "C") ? a.pest : ""
      });
    }
    const ph = arr(a.phases).filter(x => CYCLES.indexOf(x) >= 0);
    if(ph.length) assoc[en] = ph;
  });

  db.fc = {actif: true, phases: phases, assoc: assoc};
  construireAliments();
  save();
  const n = Object.keys(assoc).length;
  toast(n + " aliment" + (n>1?"s":"") + " rattaché" + (n>1?"s":"") + " · Food Cycling activé ✓");
  return true;
}

function importJSON(text, remplacer){
  let p;
  try{ p = JSON.parse(text); }
  catch(e){ toast("JSON invalide"); return; }
  const list = Array.isArray(p) ? p : (Array.isArray(p.recettes) ? p.recettes : null);
  if(!list){ toast("Aucune recette trouvée dans ce fichier"); return; }

  if(remplacer) db.recettes = [];
  const existants = {};
  db.recettes.forEach(r => existants[r.id] = true);
  const clef = u => String(u || "").replace(/[?#].*$/, "").replace(/\/+$/, "").toLowerCase();
  let n = 0, maj = 0;
  list.forEach(r => {
    const rec = normalize(r);
    // même URL déjà en base → mise à jour plutôt que doublon
    const i = rec.url ? db.recettes.findIndex(x => x.url && clef(x.url) === clef(rec.url)) : -1;
    if(i >= 0){
      const anc = db.recettes[i];
      rec.id = anc.id;
      rec.note = rec.note || anc.note;
      rec.statut = anc.statut;
      rec.semaine = anc.semaine || rec.semaine;
      rec.cycles = rec.cycles.length ? rec.cycles : anc.cycles;
      rec.tags = Array.from(new Set(anc.tags.concat(rec.tags)));
      rec.cuisines = Array.from(new Set(anc.cuisines.concat(rec.cuisines)));
      db.recettes[i] = rec; maj++;
      return;
    }
    if(existants[rec.id]) rec.id = uid();
    db.recettes.push(rec); existants[rec.id] = true; n++;
  });
  if(!Array.isArray(p)){
    if(Array.isArray(p.cuisines) && p.cuisines.length) db.cuisines = Array.from(new Set(db.cuisines.concat(p.cuisines)));
    if(p.cycleNotes) CYCLES.forEach(c => { if(p.cycleNotes[c]) db.cycleNotes[c] = p.cycleNotes[c]; });
  }
  // enrichit la liste des cuisines avec celles trouvées
  db.recettes.forEach(r => r.cuisines.forEach(c => { if(db.cuisines.indexOf(c) < 0) db.cuisines.push(c); }));
  save();
  toast(n ? (n + " recette" + (n>1?"s":"") + " importée" + (n>1?"s":"") + (maj ? ", " + maj + " mise" + (maj>1?"s":"") + " à jour" : "") + " ✓")
          : (maj + " recette" + (maj>1?"s":"") + " mise" + (maj>1?"s":"") + " à jour ✓"));
  state.formDraft = null;
  go("galerie");
}

/* ---------- helpers import web ---------- */
function appliquerImport(txt){
  if(!txt || !txt.trim()){ toast("Colle d'abord quelque chose"); return; }
  state.vieuxBM = false; state.majExistante = false; state.etapesReparees = 0;
  state.erreurImport = "";
  const d = importerContenu(txt);
  if(!d){ toast(state.erreurImport || "Contenu non reconnu"); return; }
  state.formDraft = d;
  state.formTab = "manuel";
  toast(state.majExistante ? "Recette déjà connue — prête à être mise à jour"
                           : "Recette pré-remplie — vérifie puis enregistre");
  render();
}

function copier(txt, msg){
  const ok = () => toast(msg || "Copié ✓");
  const secours = () => {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }
    catch(e){ toast("Copie impossible — sélectionne le texte à la main"); }
    ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, secours);
  }else secours();
}

let bound = false;
let notesT;

function bind(){
  if(bound) return;
  bound = true;

  $("#brand").onclick = () => { resetFiltres(); go("galerie"); };
  $("#btn-search").onclick = () => {
    if(state.view !== "galerie") { state.showSearch = true; go("galerie"); }
    else { state.showSearch = !state.showSearch; if(!state.showSearch) state.q = ""; render(); }
    const q = $("#q"); if(q) q.focus();
  };
  $("#btn-settings").onclick = () => go("reglages");
  $("#phase-sel").onchange = e => {
    db.phaseActuelle = e.target.value || "";
    if(db.phaseActuelle) state.cycle = db.phaseActuelle;
    save(); render();
  };
  $("#fab").onclick = () => {
    state.formDraft = vide(); state.formTab = "manuel";
    state.vieuxBM = false; state.majExistante = false; state.etapesReparees = 0;
