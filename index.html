html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.01em}
a{color:var(--accent-d)}
button,input,select,textarea{font:inherit; color:inherit}
input,select,textarea{
  width:100%; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; outline:none;
}
input:focus,select,textarea:focus{border-color:var(--accent)}
select{-webkit-appearance:none; appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238b8177' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center; padding-right:32px}
textarea{min-height:110px; resize:vertical; line-height:1.55}
.wrap{max-width:980px; margin:0 auto; padding:0 16px}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:40; background:var(--bg-glass);
  backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.top-row{display:flex; align-items:center; gap:10px; padding:12px 0 10px}
.brand{font-size:19px; font-weight:700; letter-spacing:-.02em; flex:1; cursor:pointer}
.brand span{color:var(--accent)}
.ver{font-size:11px; font-weight:600; color:var(--muted); background:var(--line2);
  border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:middle}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--muted);
  padding:7px 14px; border-radius:999px; font-size:14px; font-weight:550; cursor:pointer;
}
.tab.on{background:var(--ink); border-color:var(--ink); color:var(--on-ink)}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 14px; border-radius:10px; font-size:14px; font-weight:550; cursor:pointer;
  white-space:nowrap;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger); border-color:var(--danger-line)}
.btn.sm{padding:6px 10px; font-size:13px}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--card);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;
}
.fab{
  position:fixed; right:18px; bottom:calc(80px + env(safe-area-inset-bottom)); z-index:50;
  width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:#fff;
  font-size:30px; line-height:1; box-shadow:0 6px 20px rgba(192,112,63,.4); cursor:pointer;
}

/* ---------- Chips ---------- */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  padding:6px 12px; border-radius:999px; font-size:13.5px; cursor:pointer; user-select:none;
}
.chip.on{background:var(--soft); border-color:var(--accent); color:var(--accent-d); font-weight:600}
.chip.add{border-style:dashed; color:var(--muted)}

/* ---------- Cartes ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px}
@media(max-width:520px){ .grid{grid-template-columns:1fr 1fr; gap:11px} }
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; cursor:pointer; box-shadow:var(--shadow); position:relative;
  display:flex; flex-direction:column;
}
.card:active{transform:scale(.985)}
.thumb{
  aspect-ratio:4/3; width:100%; background:var(--soft); display:flex; align-items:center;
  justify-content:center; font-size:34px; overflow:hidden;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.card-body{padding:10px 11px 12px; display:flex; flex-direction:column; gap:5px; flex:1}
.card-title{font-size:14.5px; font-weight:640; line-height:1.3}
.card-meta{font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px}
.week-btn{
  position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
  border:none; background:var(--glass); backdrop-filter:blur(6px); color:var(--ink);
  font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 5px rgba(0,0,0,.14);
}
.week-btn.on{background:var(--accent); color:#fff}
.stars{color:var(--warn); font-size:12.5px; letter-spacing:1px}
.portions-row{
  display:flex; align-items:center; justify-content:space-between; gap:7px;
  margin-top:2px; padding-top:9px; border-top:1px solid var(--line2);
}
.portions-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
.stepper{
  display:inline-flex; align-items:stretch; border:1px solid var(--line); border-radius:9px;
  overflow:hidden;
}
.stepper button{
  width:28px; border:none; background:var(--card); color:var(--accent-d);
  font-size:15px; line-height:1; cursor:pointer;
}
.stepper button:active{background:var(--soft)}
.stepper-val{
  min-width:26px; display:flex; align-items:center; justify-content:center;
  font-size:13.5px; font-weight:650; color:var(--ink); background:var(--line2);
}

/* ---------- Sections ---------- */
.section{margin:26px 0 0}
.section-head{
  display:flex; align-items:baseline; gap:9px; margin:0 0 11px;
}
.section-head h3{font-size:16px}
.count{font-size:12.5px; color:var(--muted)}
.panel{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; box-shadow:var(--shadow);
}
.panel + .panel{margin-top:14px}
.field{margin:0 0 14px}
.field > label{display:block; font-size:12.5px; font-weight:640; color:var(--muted); margin:0 0 6px; letter-spacing:.02em; text-transform:uppercase}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1 1 130px; min-width:0}
.hint{font-size:12.5px; color:var(--muted); margin:6px 0 0}
.empty{text-align:center; color:var(--muted); padding:44px 16px; font-size:14.5px}
.empty .big{font-size:38px; display:block; margin-bottom:10px}
hr.sep{border:none; border-top:1px solid var(--line2); margin:18px 0}

/* ---------- Filtres ---------- */
.searchbar{display:flex; gap:9px; margin:16px 0 0}
.searchbar input{flex:1}
.filters{margin-top:12px}
.filters .field{margin-bottom:12px}
.fbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap}
.badge{background:var(--soft); color:var(--accent-d); border-radius:999px; padding:2px 9px; font-size:12px; font-weight:640}

/* ---------- Fiche ---------- */
.hero{
  width:100%; aspect-ratio:16/9; background:var(--soft); border-radius:var(--r); overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:54px; margin-bottom:14px;
}
.hero img{width:100%; height:100%; object-fit:cover}
.pill{display:inline-block; background:var(--line2); color:var(--muted); border-radius:999px; padding:3px 10px; font-size:12.5px; margin:0 5px 5px 0}
.pill.acc{background:var(--soft); color:var(--accent-d)}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; text-align:center}
@media(max-width:520px){ .stat-grid{grid-template-columns:repeat(2,1fr)} }
.stat{background:var(--line2); border-radius:10px; padding:10px 6px}
.stat b{display:block; font-size:17px}
.stat span{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
ul.ing{list-style:none; margin:0; padding:0}
ul.ing li{
  display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line2);
  cursor:pointer; font-size:15px;
}
ul.ing li:last-child{border-bottom:none}
ul.ing li.done{color:var(--muted); text-decoration:line-through}
.box{width:19px; height:19px; border:1.6px solid var(--line); border-radius:6px; flex:0 0 auto; margin-top:2px;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff}
li.done .box{background:var(--accent); border-color:var(--accent)}
.alg{font-size:11px; background:var(--danger-soft); color:var(--danger); border-radius:6px; padding:1px 6px; margin-left:auto; flex:0 0 auto}
ol.steps{margin:0; padding:0 0 0 4px; list-style:none; counter-reset:s}
ol.steps li{counter-increment:s; display:flex; gap:12px; padding:9px 0; font-size:15px}
ol.steps li::before{
  content:counter(s); flex:0 0 auto; width:25px; height:25px; border-radius:50%;
  background:var(--soft); color:var(--accent-d); font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px}

/* ---------- Formulaire dynamique ---------- */
.ing-row{display:flex; gap:7px; align-items:center; margin-bottom:7px}
.ing-row input{flex:1}
.mini{width:34px; height:34px; flex:0 0 auto; border-radius:9px; border:1px solid var(--line);
  background:var(--card); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center}
.mini.on{background:var(--danger-soft); border-color:var(--danger-line)}
.starpick{display:flex; gap:5px}
.starpick button{border:none; background:none; font-size:25px; color:var(--line); cursor:pointer; padding:0}
.starpick button.on{color:var(--warn)}
.subtabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--ink); color:var(--on-ink); max-width:calc(100vw - 32px); text-align:center; padding:11px 18px; border-radius:999px; font-size:14px;
  z-index:90; opacity:0; pointer-events:none; transition:opacity .22s;
}
.toast.show{opacity:1}
.note-area{min-height:150px}

/* ---------- import web ---------- */
.bmbox{
  display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center;
  background:var(--soft); border:1px dashed var(--accent); border-radius:12px; padding:18px 14px; margin-bottom:14px;
}
.bmlink{
  display:inline-block; background:var(--accent); color:#fff !important; text-decoration:none;
  padding:11px 20px; border-radius:10px; font-weight:640; font-size:15px; cursor:grab;
}
.bmbox .hint{margin:0}
details{border-top:1px solid var(--line2); padding:11px 0 4px}
summary{cursor:pointer; font-size:14px; font-weight:600; color:var(--accent-d); list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"› "; display:inline-block; transition:transform .15s}
details[open] summary::before{content:"⌄ "}
textarea.code{
  font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; min-height:120px;
  background:var(--code-bg); margin:10px 0 8px; word-break:break-all;
}
ol.howto{margin:12px 0; padding-left:22px; font-size:14.5px; line-height:1.6}
ol.howto li{margin-bottom:7px}
code{background:var(--line2); border-radius:5px; padding:1px 5px; font-size:12.5px; word-break:break-all}
.cycle-head{display:flex; align-items:center; gap:12px; margin-bottom:4px}
.cycle-emo{font-size:32px}
.desc{margin:9px 0 0; color:var(--muted); font-size:14.5px; line-height:1.55}
.notice{
  background:var(--soft); border:1px solid var(--accent); border-radius:12px;
  padding:13px 15px; margin:0 0 14px; font-size:14px; line-height:1.55; color:var(--accent-d);
}
.notice.warn{background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn-ink)}
.notice b{color:inherit}
.bmver{font-size:12px; color:var(--muted); margin-left:auto}

/* ---------- cycle & courses ---------- */
.phase-sel{
  width:auto; max-width:150px; padding:7px 30px 7px 11px; font-size:13.5px; font-weight:550;
  border-radius:999px; background-color:var(--card);
}
.phase-sel.on{background-color:var(--soft); border-color:var(--accent); color:var(--accent-d)}
@media(max-width:430px){
  .brand{font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .phase-sel{max-width:112px; font-size:12.5px; padding:6px 26px 6px 9px}
}
.phase-hero{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.phase-hero h2{font-size:22px}
.repere{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media(max-width:560px){ .repere{grid-template-columns:1fr 1fr} }
.repere > div{background:var(--line2); border-radius:10px; padding:10px 11px}
.repere span{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:3px}
.repere b{font-size:13.5px; font-weight:600; line-height:1.35}
p.txt{margin:0; font-size:15px; line-height:1.62}
.chip.ali{cursor:default; font-size:13px}
.fit{font-size:11.5px; color:var(--accent-d); background:var(--soft); border-radius:6px; padding:2px 6px; align-self:flex-start}
.tagali{
  display:inline-block; font-size:11px; font-weight:600; border-radius:6px; padding:1px 7px;
  margin-left:6px; background:var(--line2); color:var(--muted); vertical-align:middle; white-space:nowrap;
}
.tagali.cible{background:var(--soft); color:var(--accent-d)}
.tagali.giL{background:var(--ok-soft); color:var(--ok-ink)}
.tagali.giM{background:var(--gim-bg); color:var(--gim)}
.tagali.giH{background:var(--gih-bg); color:var(--gih)}
.tagali.bio{background:var(--bio-bg); color:var(--bio)}
li.done .tagali{opacity:.5}
.qte{font-size:13px; color:var(--accent-d); font-weight:600; margin-left:6px; white-space:nowrap}
.src{display:block; font-size:11.5px; color:var(--muted); margin-top:2px}
.src-detail{display:block; font-size:11px; color:var(--muted); margin-top:1px; padding-left:9px; opacity:.85}
ul.ing li .mini{width:30px; height:30px; font-size:13px; margin-top:-2px}

/* ---------- éditeur d'aliments ---------- */
.ali-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:11px 0; border-bottom:1px solid var(--line2); cursor:pointer;
}
.ali-row.ouvert{border-bottom:none; font-weight:600}
.ali-edit{
  background:var(--line2); border-radius:12px; padding:15px 15px 4px;
  margin:0 0 12px; border-bottom:1px solid transparent;
}
.ali-edit .field{margin-bottom:12px}
.ali-edit input[disabled]{opacity:.55}
.ali-row:last-child{border-bottom:none}
.ali-nom{flex:1; min-width:150px; font-size:14.5px; line-height:1.35}
.ali-en{color:var(--muted); font-size:12.5px; margin-left:7px}
.ali-meta{display:block; font-size:11.5px; color:var(--muted); margin-top:2px}
.ali-phases{flex:0 0 auto; gap:5px}
.mini-chip{
  min-width:34px; padding:5px 8px; font-size:14px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
}

/* =========================================================
   v3 — l'app de poche
   ========================================================= */
.ico{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; display:block}
.ico.sm{width:17px; height:17px}
.ico.plein{fill:currentColor; stroke:none}
.ico.rempli{fill:currentColor}
.icon-btn .ico{width:20px; height:20px}
.fab{display:flex; align-items:center; justify-content:center}
.fab .ico{width:28px; height:28px; stroke-width:2.2}
#app.vin{animation:vin .22s ease}
@keyframes vin{from{opacity:0} to{opacity:1}}
@media (prefers-reduced-motion: reduce){ #app.vin{animation:none} }
.btn.on{border-color:var(--accent); color:var(--accent-d); background:var(--soft)}
.btn .ico.sm{margin:0 -1px}

/* ---------- barre d'onglets du bas ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:flex; justify-content:center;
  background:var(--bg-glass); backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line); padding:0 6px env(safe-area-inset-bottom);
}
.tabbar-in{display:flex; width:100%; max-width:560px}
.tb{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;
  border:none; background:none; color:var(--muted); cursor:pointer;
  padding:8px 2px 7px; font-size:11px; font-weight:600; letter-spacing:.01em;
}
.tb .ico{width:24px; height:24px}
.tb.on{color:var(--accent-d)}
.tb.on .ico{stroke-width:2.1}
.tb-badge{
  position:absolute; top:3px; left:calc(50% + 5px); min-width:18px; height:18px; padding:0 5px;
  border-radius:999px; background:var(--accent); color:#fff; font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}
.tb-dot{position:absolute; top:6px; left:calc(50% + 9px); width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--bg)}
body.immersif header.top, body.immersif .tabbar, body.immersif .fab,
body.saisie .tabbar, body.saisie .fab{display:none !important}
body.immersif{padding-bottom:0}
body.saisie{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.sheet-open{overflow:hidden}

/* ---------- titres de page ---------- */
.page-head{display:flex; align-items:center; gap:10px; margin:22px 0 4px}
.page-head h2{font-size:28px; letter-spacing:-.025em; line-height:1.1; flex:1}
.page-head .count{font-size:14px}
.round{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; padding:0;
}
.round.sm{width:32px; height:32px}
.round.sm .ico{width:18px; height:18px}
.voir{border:none; background:none; color:var(--accent-d); font-size:13.5px; font-weight:620; cursor:pointer; padding:2px 0; white-space:nowrap}
.section-head .voir, .day-head .voir{margin-left:auto}
.kicker{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--accent-d)}
.kicker.muted{color:var(--muted)}

/* ---------- accueil ---------- */
.hello{margin:22px 0 14px}
.hello-sub{font-size:14.5px; color:var(--muted); font-weight:550}
.hello h1{font-size:28px; letter-spacing:-.025em; line-height:1.15; margin-top:2px}
.fakesearch{
  width:100%; display:flex; align-items:center; gap:10px; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px;
  color:var(--muted); font-size:15px; cursor:pointer; box-shadow:var(--shadow);
}
.today{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); margin-top:16px}
.today-img{height:168px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:54px; cursor:pointer; overflow:hidden}
.today-img img{width:100%; height:100%; object-fit:cover}
.today-body{padding:14px 15px 15px}
.today-title{font-size:20px; font-weight:680; margin:3px 0 5px; line-height:1.25; letter-spacing:-.01em; cursor:pointer}
.today.vide .today-title{font-size:17px; cursor:default}
.today .actions{margin-top:12px}
.quick{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:14px}
.qt{
  display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 3px 10px; cursor:pointer;
  font-size:12.5px; font-weight:640; color:var(--ink); line-height:1.2;
}
.qt:active{transform:scale(.97)}
.qt-emo{font-size:24px; line-height:1}
.qt small{display:block; font-size:10.5px; color:var(--muted); font-weight:500; margin-top:1px}
.rail{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding:0 16px; margin:0 -16px; padding:2px 16px 10px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail > .card{flex:0 0 158px; scroll-snap-align:start}
@media(min-width:700px){ .rail > .card{flex-basis:200px} }
.rail .card-title{font-size:13.5px}
.rail .card-meta{font-size:11.5px}
.colls{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.coll{position:relative; border-radius:14px; overflow:hidden; aspect-ratio:16/10; background:var(--soft); cursor:pointer; border:none; padding:0; text-align:left; color:#fff}
.coll img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.coll::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.66))}
.coll > span{position:absolute; left:11px; bottom:9px; right:11px; z-index:1; font-weight:680; font-size:14.5px; line-height:1.2; text-shadow:0 1px 3px rgba(0,0,0,.35)}
.coll small{display:block; font-weight:500; font-size:11.5px; opacity:.92}
.coll .coll-emo{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:36px; padding-bottom:22px}
.onb{text-align:center; padding:26px 10px 18px}
.onb .big{font-size:54px; line-height:1}
.onb h2{font-size:22px; margin:10px 0 6px}
.onb p{color:var(--muted); margin:0 auto; max-width:420px; font-size:15px}

/* ---------- cartes ---------- */
.fav-dot{
  position:absolute; top:8px; left:8px; width:28px; height:28px; border-radius:50%;
  background:var(--glass); color:#e0245e; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 5px rgba(0,0,0,.14);
}
.fav-dot .ico{width:16px; height:16px}
.match{font-size:11.5px; font-weight:650; color:var(--ok-ink); background:var(--ok-soft); border-radius:6px; padding:2px 7px; align-self:flex-start}
.match.part{color:var(--gim); background:var(--gim-bg)}

/* ---------- recherche ---------- */
.searchbar .btn{padding:0 13px; flex:0 0 auto}
.search-in{flex:1; position:relative; display:flex; align-items:center; min-width:0}
.search-in .ico{position:absolute; left:12px; color:var(--muted); pointer-events:none}
.search-in input{padding-left:38px; border-radius:12px}
.qchips{display:flex; gap:7px; overflow-x:auto; margin:12px -16px 0; padding:0 16px 2px; scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchips .chip{flex:0 0 auto; white-space:nowrap}
.tri-sel{width:auto; padding:6px 30px 6px 11px; font-size:13.5px; border-radius:999px; background-color:var(--card)}

/* ---------- fiche ---------- */
.fiche-hero{
  position:relative; margin:0 -16px; height:min(62vw, 400px); background:var(--soft);
  display:flex; align-items:center; justify-content:center; font-size:68px; overflow:hidden;
}
.fiche-hero > img{width:100%; height:100%; object-fit:cover}
.ov{position:absolute; top:12px; left:12px; right:12px; display:flex; gap:8px; pointer-events:none}
.ov .sp{flex:1}
.ov-btn{
  pointer-events:auto; width:40px; height:40px; border-radius:50%; border:none; background:var(--glass); color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  box-shadow:0 2px 8px rgba(0,0,0,.15); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.ov-btn.fav{color:#e0245e}
.fiche-head{position:relative; background:var(--bg); border-radius:22px 22px 0 0; margin:-22px -16px 0; padding:20px 16px 0}
@media(min-width:720px){
  .fiche-hero{margin:16px 0 0; border-radius:var(--r)}
  .fiche-head{margin:0; padding:18px 0 0; border-radius:0}
}
.fiche-title{font-size:26px; line-height:1.18; letter-spacing:-.022em}
.fiche-sub{display:flex; align-items:center; flex-wrap:wrap; gap:4px 12px; margin-top:7px; font-size:13.5px; color:var(--muted)}
.metas{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px}
.meta{display:inline-flex; align-items:center; gap:5px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:560}
.rate{display:inline-flex; gap:1px}
.rate button{border:none; background:none; padding:0 1px; font-size:21px; color:var(--line); cursor:pointer; line-height:1}
.rate button.on{color:var(--warn)}
.rate.big button{font-size:38px; padding:0 3px}
.cta-row{display:flex; gap:9px; margin-top:16px}
.cta{
  flex:1; display:flex; align-items:center; justify-content:center; gap:9px; border:none; border-radius:14px;
  padding:14px; background:var(--accent); color:#fff; font-size:16px; font-weight:650; cursor:pointer;
  box-shadow:0 4px 14px rgba(192,112,63,.28);
}
.cta:active{transform:scale(.98)}
.cta .ico{width:19px; height:19px}
.cta.second{flex:0 0 auto; background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:none; padding:14px 16px}
.cta.second.on{background:var(--soft); border-color:var(--accent); color:var(--accent-d)}
.plan-info{margin-top:10px; font-size:13.5px; color:var(--accent-d); background:var(--soft); border-radius:10px; padding:8px 12px}
.portions-bar{display:flex; align-items:center; gap:12px; justify-content:space-between; padding-bottom:12px; margin-bottom:4px; border-bottom:1px solid var(--line2)}
.portions-bar b{font-size:15.5px}
.hint-scale{font-size:12.5px; color:var(--muted); margin-top:1px}
.stepper.big button{width:42px; height:40px; font-size:21px}
.stepper.big .stepper-val{min-width:46px; font-size:16px}
.qa{color:var(--accent-d); font-weight:700}
.fiche-foot{display:flex; gap:9px; flex-wrap:wrap; margin-top:22px}

/* ---------- feuilles du bas ---------- */
.sheet-bg{position:fixed; inset:0; background:rgba(20,16,12,.4); z-index:95; opacity:0; pointer-events:none; transition:opacity .22s}
.sheet-bg.open{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:96; margin:0 auto; max-width:560px;
  background:var(--bg); border-radius:20px 20px 0 0; box-shadow:var(--shadow-lg);
  max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%); visibility:hidden;
  transition:transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s .26s;
}
.sheet.open{transform:none; visibility:visible; transition:transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s}
@media (prefers-reduced-motion: reduce){ .sheet, .sheet.open{transition:none} }
.grip{width:38px; height:5px; border-radius:3px; background:var(--line); margin:2px auto 14px}
.sheet h3{font-size:19px; margin-bottom:2px}
.sheet .sub{font-size:13.5px; color:var(--muted); margin:0 0 14px}
.sheet .kicker{margin:18px 0 8px}
.opts{display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.opt{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border:none; border-bottom:1px solid var(--line2);
  background:none; text-align:left; cursor:pointer; font-size:15px; color:var(--ink); width:100%;
}
.opt:last-child{border-bottom:none}
.opt:active{background:var(--line2)}
.opt-emo{font-size:20px; width:26px; text-align:center; flex:0 0 auto}
.opt small{display:block; font-size:12.5px; color:var(--muted); margin-top:1px}
.opt.danger{color:var(--danger)}
.opt.on{color:var(--accent-d); font-weight:650}
.days{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.dayb{
  border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px 4px; text-align:center;
  cursor:pointer; font-size:14px; font-weight:640; color:var(--ink);
}
.dayb small{display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-top:1px}
.dayb.passe{opacity:.45}
.dayb.auj{border-color:var(--accent); color:var(--accent-d)}
.dayb.has{background:var(--soft)}
.pick{display:flex; align-items:center; gap:11px; padding:9px 2px; border-bottom:1px solid var(--line2); cursor:pointer}
.pick:last-child{border-bottom:none}
.pt{
  width:52px; height:52px; border-radius:10px; object-fit:cover; flex:0 0 auto; background:var(--soft);
  display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden;
}
.pick b{display:block; font-size:14.5px; font-weight:620; line-height:1.3}
.pick small{color:var(--muted); font-size:12px}

/* ---------- planning ---------- */
.weeknav{display:flex; align-items:center; gap:8px; margin-top:8px}
.wk{flex:1; text-align:center}
.wk b{display:block; font-size:16px}
.wk small{font-size:12.5px; color:var(--muted)}
.plan-sum{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:14px}
.day{margin-top:20px}
.day-head{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.day-head h4{font-size:15.5px}
.day-head .date{font-size:13px; color:var(--muted); flex:1}
.day.auj .day-head h4{color:var(--accent-d)}
.pill-auj{font-size:11px; font-weight:700; color:#fff; background:var(--accent); border-radius:999px; padding:2px 8px}
.day.passe{opacity:.6}
.day-add{border:1.5px dashed var(--line); background:none; border-radius:12px; width:100%; padding:12px; color:var(--muted); font-size:14px; cursor:pointer}
.day-none{font-size:13px; color:var(--muted); padding:2px 0}
.pe{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; box-shadow:var(--shadow); margin-bottom:8px}
.pe-top{display:flex; gap:11px; align-items:center}
.pe-img{
  width:60px; height:60px; border-radius:11px; background:var(--soft); flex:0 0 auto; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:26px; position:relative; cursor:pointer;
}
.pe-img img{width:100%; height:100%; object-fit:cover}
.pe-fait{position:absolute; inset:0; background:rgba(79,138,91,.75); color:#fff; display:flex; align-items:center; justify-content:center}
.pe-info{flex:1; min-width:0; cursor:pointer}
.pe-info b{font-size:14.5px; font-weight:640; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.pe-info small{display:block; font-size:12px; color:var(--muted); margin-top:2px}
.pe-bot{display:flex; align-items:center; gap:8px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line2)}
.pe.fait .pe-info b{text-decoration:line-through; color:var(--muted)}

/* ---------- courses ---------- */
.prog{height:8px; border-radius:99px; background:var(--line2); overflow:hidden}
.prog > i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s}
.prog.ok > i{background:var(--ok)}
.prog-row{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--muted); margin:14px 0 6px}
.prog-row b{color:var(--ink)}
.addline{display:flex; gap:8px; margin:14px 0 2px}
.addline input{flex:1; min-width:0}
.pour{display:flex; gap:8px; overflow-x:auto; margin:12px -16px 0; padding:0 16px 2px; scrollbar-width:none}
.pour::-webkit-scrollbar{display:none}
.pour-r{flex:0 0 auto; display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px 11px 3px 3px; font-size:12.5px; cursor:pointer; max-width:220px}
.pour-r .pt{width:26px; height:26px; border-radius:50%; font-size:13px}
.pour-r span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
details.placard{margin-top:22px; border-top:none}
details.placard > summary{font-size:15px; color:var(--ink)}

/* ---------- mode cuisine ---------- */
.cook{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); max-width:760px; margin:0 auto}
.cook-top{display:flex; align-items:center; gap:10px; padding:12px 0 10px}
.cook-top .t{flex:1; min-width:0}
.cook-top .t b{display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cook-top .t small{font-size:12.5px; color:var(--muted)}
.segs{display:flex; gap:4px}
.segs i{flex:1; height:4px; border-radius:3px; background:var(--line)}
.segs i.on{background:var(--accent)}
.cook-body{flex:1; padding:24px 0 150px}
.step-title{font-size:24px; letter-spacing:-.02em; margin:6px 0 14px}
.step-txt{font-size:23px; line-height:1.5; font-weight:500; margin:10px 0 22px; letter-spacing:-.005em}
@media(min-width:720px){ .step-txt{font-size:27px} }
.step-ings{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px}
.step-ing{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:15px}
.tbtn{
  display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--accent); color:var(--accent-d); background:var(--soft);
  border-radius:12px; padding:11px 16px; font-size:16.5px; font-weight:650; cursor:pointer; margin:0 8px 8px 0;
}
.tbtn small{font-weight:500; font-size:12.5px; opacity:.8}
ul.ing.big li{font-size:17px; padding:12px 0}
ul.ing.big .box{width:22px; height:22px}
.cook-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:70; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg-glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line);
}
.cook-nav-in{display:flex; gap:10px; width:100%; max-width:760px; margin:0 auto}
.cook-nav .btn{flex:1; padding:15px; font-size:16.5px; border-radius:14px}
.cook-nav .btn.prev{flex:0 0 auto; padding:15px 18px}
.fin{text-align:center; padding-top:8px}
.fin .big{font-size:66px; line-height:1}
.fin h2{font-size:27px; margin:12px 0 4px}
.notice.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok-ink)}

/* ---------- minuteurs ---------- */
/* en bas à gauche, au-dessus de la barre d'onglets : ils ne cachent jamais un titre */
.timers{position:fixed; left:12px; right:84px; bottom:calc(env(safe-area-inset-bottom) + 78px); z-index:85; display:flex; flex-direction:column; gap:7px; align-items:flex-start; pointer-events:none}
body.immersif .timers{bottom:calc(env(safe-area-inset-bottom) + 92px); right:12px}
body.saisie .timers{bottom:calc(env(safe-area-inset-bottom) + 80px)}
.toast{width:max-content}
body.immersif .toast{bottom:calc(env(safe-area-inset-bottom) + 94px)}
body.a-minuteurs .toast{bottom:calc(env(safe-area-inset-bottom) + 132px)}
body.immersif.a-minuteurs .toast{bottom:calc(env(safe-area-inset-bottom) + 146px)}
.timer{
  pointer-events:auto; display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--on-ink);
  border-radius:999px; padding:6px 6px 6px 13px; box-shadow:var(--shadow-lg); font-size:15px; font-weight:680;
  font-variant-numeric:tabular-nums; cursor:pointer;
}
.timer small{font-weight:500; opacity:.75; font-size:12px; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.timer button{width:28px; height:28px; border-radius:50%; border:none; background:rgba(128,128,128,.28); color:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0}
.timer button .ico{width:15px; height:15px}
.timer.fini{background:var(--accent); color:#fff; animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- formulaire ---------- */
.savebar{
  position:fixed; left:0; right:0; bottom:0; z-index:60; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg-glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line);
}
.savebar-in{max-width:948px; margin:0 auto; display:flex; gap:9px}
.savebar .btn{padding:13px 16px; font-size:15.5px}
.panel-titre{font-size:15px; font-weight:680; margin:0 0 12px}
details.grp{border-top:none; padding:0}
details.grp > summary{font-size:15px; color:var(--ink); font-weight:680}
details.grp[open] > summary{margin-bottom:14px}
.alerte-save{position:sticky; top:0; z-index:45; background:var(--danger-soft); color:var(--danger); border-bottom:1px solid var(--danger-line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px; font-size:14px; line-height:1.45; text-align:center}
.alerte-save[hidden]{display:none}
.alerte-save .btn{margin-left:6px}
.toast-act{border:none; background:none; color:var(--accent); font-weight:700; margin-left:12px; cursor:pointer; padding:0; font-size:14px}
.toast.act{pointer-events:auto}
</style>
</head>

/* Le catalogue vit en mémoire ; les phases viennent des données utilisateur.
   On le reconstruit à chaque changement plutôt que de le figer. */
let ALIMENTS = [];

function construireAliments(){
  const assoc = (db.fc && db.fc.assoc) || {};
  const mod = (db.aliments && db.aliments.modifs) || {};
  const masques = (db.aliments && db.aliments.masques) || [];

  const construire = (en, fr, cat, gi, pest, perso) => {
    const m = mod[en] || {};
    return {
      en: en, fr: m.fr !== undefined ? m.fr : fr,
      cat: m.cat !== undefined ? m.cat : cat,
      gi: m.gi !== undefined ? m.gi : gi,
      pest: m.pest !== undefined ? m.pest : pest,
      phases: (assoc[en] || []).slice(),
      perso: perso
    };
  };

  ALIMENTS = ALIMENTS_BASE
    .filter(a => masques.indexOf(a[0]) < 0)
    .map(a => construire(a[0] || a[1] || "", a[1] || a[0] || "", a[2], a[3], a[4], false));

  ((db.aliments && db.aliments.perso) || []).forEach(a => {
    const en = a.en || a.fr || "";
    if(!en || ALIMENTS.find(x => normLibelle(x.en) === normLibelle(en))) return;
    ALIMENTS.push(construire(en, a.fr || en, a.cat || "O", a.gi || "", a.pest || "", true));
  });

  IDX_ALI = null;
  return ALIMENTS;
}

/* enregistre une correction sur un aliment, qu'il vienne du catalogue ou de moi */
function majAliment(en, champs){
  const perso = (db.aliments.perso || []).find(a => a.en === en);
  if(perso){ Object.assign(perso, champs); }
  else{ db.aliments.modifs[en] = Object.assign({}, db.aliments.modifs[en], champs); }
  construireAliments(); save();
}

/* forme « souche » commune au singulier et au pluriel, en français comme en anglais :
   pluriel enlevé, puis « e » final enlevé — pois chiches → poi chich ← pois chiche */
function singulier(w){
  if(w.length < 4) return w;
  if(/ies$/.test(w)) w = w.slice(0,-3) + "y";
  else if(/s$/.test(w) && !/ss$/.test(w)) w = w.slice(0,-1);
  if(w.length > 3 && /e$/.test(w)) w = w.slice(0,-1);
  return w;
}

/* variantes courantes absentes de la liste Notion, vérifiées une à une */
const SYN_INTERNES = {
  "prawn":"Shrimp", "king prawn":"Shrimp", "gambas":"Shrimp", "scampi":"Shrimp",
  "peas":"Green peas", "petits pois":"Green peas", "garden peas":"Green peas",
  "cilantro":"Coriander", "spring onions":"Spring onion", "scallion":"Spring onion",
  "aubergine":"Eggplant", "courgette":"Zucchini", "chickpeas":"Chickpea",
  "linseed":"Flaxseeds", "graines de lin":"Flaxseeds", "flax seeds":"Flaxseeds",
  "sweet potatoes":"Sweet potato", "patates douces":"Sweet potato"
};
function normAli(s){
  let t = String(s == null ? "" : s).toLowerCase();
  try{ t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
  t = t.replace(/œ/g, "oe").replace(/æ/g, "ae")
       .replace(/[’']/g, " ").replace(/[^a-z0-9]+/g, " ").replace(/\b\d+[a-z]*\b/g, " ");
  return t.split(" ").filter(Boolean).map(singulier).join(" ");
}

/* index des noms, du plus long au plus court : on garde la correspondance la plus précise */
let IDX_ALI = null;
function indexAliments(){
  if(IDX_ALI) return IDX_ALI;
  const idx = [];
  const pousser = (mot, ali) => { const m = normAli(mot); if(m && m.length > 2) idx.push({mot:m, ali:ali}); };
  ALIMENTS.forEach(a => {
    pousser(a.en, a); pousser(a.fr, a);
    // « Banana (ripe) » → on indexe aussi « banana », en second choix
    const be = a.en.split("(")[0], bf = a.fr.split("(")[0];
    if(be !== a.en) pousser(be, a);
    if(bf !== a.fr) pousser(bf, a);
  });
  Object.keys(SYN_INTERNES).forEach(syn => {
    const cible = ALIMENTS.find(a => a.en === SYN_INTERNES[syn]);
    if(cible) pousser(syn, cible);
  });
  Object.keys(db.synonymes || {}).forEach(syn => {
    const cible = ALIMENTS.find(a => a.en === db.synonymes[syn]);
    if(cible) pousser(syn, cible);
  });
  idx.sort((a,b) => b.mot.length - a.mot.length);

  // dernier recours : le nom de tête (« green pea » → « pea »), testé seulement si rien d'autre ne colle.
  // Exception : un dernier mot précédé de « non »/« sans » est nié par la phrase (« lait non sucré »
  // ne parle pas de sucre) et ne doit surtout pas devenir un synonyme de cet aliment.
  const tetes = [];
  const vus = {};
  const NEGATIONS = ["non", "sans"];
  ALIMENTS.forEach(a => {
    [a.en, a.fr].forEach(nom => {
      const mots = normAli(nom).split(" ");
      const tete = mots[mots.length - 1];
      const precedent = mots[mots.length - 2];
      if(tete && tete.length > 3 && !vus[tete] && NEGATIONS.indexOf(precedent) < 0){
        vus[tete] = 1; tetes.push({mot:tete, ali:a});
      }
    });
  });
  IDX_ALI = {plein: idx, tetes: tetes.sort((a,b) => b.mot.length - a.mot.length)};
  return IDX_ALI;
}

function trouverAliment(txt){
  const s = " " + normAli(txt) + " ";
  if(s.trim().length < 3) return null;
  const idx = indexAliments();
  for(let i = 0; i < idx.plein.length; i++){
    if(s.indexOf(" " + idx.plein[i].mot + " ") >= 0) return idx.plein[i].ali;
  }
  for(let i = 0; i < idx.tetes.length; i++){
    if(s.indexOf(" " + idx.tetes[i].mot + " ") >= 0) return idx.tetes[i].ali;
  }
  return null;
}

/* aliments d'une recette rattachés à une phase donnée */
function alimentsDeRecette(r, phase){
  const out = [];
  (r.ingredients || []).forEach((ing, k) => {
    // on cherche d'abord sur le nom seul : « 1 c. à café d'ail » ne doit pas devenir du café
    const a = trouverAliment(parseIngredient(ing.txt).nom) || trouverAliment(ing.txt);
    if(!a) return;
    const pertinent = alimentEstDeLaPhase(a, phase);
    out.push({k:k, ali:a, pertinent:pertinent});
  });
  return out;
}
function scorePhase(r, phase){
  if(!phase || !db.fc.actif) return 0;
  return alimentsDeRecette(r, phase).filter(x => x.ali.phases.indexOf(phase) >= 0).length;
}

  {re:/^(poignees?|handfuls?)$/,           fam:"poignee",vers:1, aff:"poignée"},
  {re:/^(tranches?|slices?)$/,             fam:"tranche",vers:1, aff:"tranche"},
  {re:/^(boites?|cans?|tins?|conserves?)$/,fam:"boite",  vers:1, aff:"boîte"},
  {re:/^(sachets?|packs?|paquets?)$/,      fam:"sachet", vers:1, aff:"sachet"}
];

/* pour les unités on ne singularise pas : on compare des libellés, pas des aliments */
function normUniteTxt(u){
  let t = String(u == null ? "" : u).toLowerCase();
  try{ t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
  return t.replace(/[’']/g, " ").replace(/\s+/g, " ").trim();
}
function normUnite(u){
  const t = normUniteTxt(u);
  if(!t) return null;
  for(const x of UNITES){ if(x.re.test(t)) return x; }
  return null;
}

/* « 1 1/2 kg », « 2,5 l », « 400 ml », « ½ citron » → nombre */
function lireNombre(s){
  s = String(s).replace(",", ".").trim();
  const frac = {"½":0.5,"¼":0.25,"¾":0.75,"⅓":1/3,"⅔":2/3};
  if(frac[s] !== undefined) return frac[s];
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);        // 1 1/2
  if(m) return +m[1] + (+m[2]) / (+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/);                     // 3/4
  if(m) return (+m[1]) / (+m[2]);
  m = s.match(/^(\d+(?:\.\d+)?)$/);
  return m ? +m[1] : null;
}

/* découpe « 150g tomatoes speciality vine » → {qte:150, unite:g, nom:"tomatoes…"} */
function parseIngredient(ligne){
  let t = String(ligne || "").trim().replace(/^[-•*·]\s*/, "");
  const res = {qte:null, unite:null, nom:t, brut:t, note:""};

  // note entre parenthèses en fin de ligne : « (use half) »
  const par = t.match(/\s*\(([^)]*)\)\s*$/);
  if(par){ res.note = par[1].trim(); t = t.slice(0, par.index).trim(); }

  // 1. quantité en tête
  const m = t.match(/^(\d+(?:[.,]\d+)?\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  if(!m){ res.nom = nettoyerNom(t) || t; return res; }
  const q = lireNombre(m[1]);
  if(q === null){ res.nom = nettoyerNom(t) || t; return res; }
  res.qte = q;
  let reste = m[2];

  // 2. unité éventuelle : on essaie les 3 premiers mots, puis 2, puis 1 (« c. à soupe » avant « c »)
  const mots = reste.split(/\s+/).filter(Boolean);
  for(let n = Math.min(3, mots.length); n >= 1; n--){
    const cand = mots.slice(0, n).join(" ");
    const u = normUnite(cand);
    if(u){ res.unite = u; reste = mots.slice(n).join(" "); break; }
  }
  res.nom = nettoyerNom(reste) || nettoyerNom(t) || t;
  return res;
}

/* retire les mots de liaison en tête : « de », « of », « d' »… */
function nettoyerNom(t){
  return String(t || "").replace(/^(de la |de l['’]|du |des |de |d['’]|of the |of |the )/i, "").trim();
}

/* rayon d'un ingrédient : ma correction > catégorie de l'aliment > mots-clés > Autres */
function rayonDe(nom, ali){
  const cle = normAli(nom);
  if(db.rayons[cle]) return db.rayons[cle];
  // correction posée depuis la liste : enregistrée sous le nom de l'aliment seul
  if(ali){ const ca = normAli(ali.fr + " " + ali.en); if(db.rayons[ca]) return db.rayons[ca]; }
  if(ali && RAYON_PAR_CAT[ali.cat]) return RAYON_PAR_CAT[ali.cat];
  const n = " " + cle + " ";
  for(const [rayon, mots] of RAYON_MOTS){
    const parts = mots.split("|");
    for(let i = 0; i < parts.length; i++){
      const p = normAli(parts[i]);
      if(p && n.indexOf(" " + p + " ") >= 0) return rayon;
    }
  }
  return RAYONS[RAYONS.length - 1];
}

/* construit la liste agrégée à partir des repas planifiés d'une semaine.
   Les articles « toujours au placard » sont mis de côté dans res.placard. */
function construireCourses(sem){
  sem = sem || semaineCourante();
  const C = coursesDe(sem);
  const lignes = {};   // clé → { nom, ali, rayon, parts:{fam:{qte,aff}}, sansQte:[], recettes:[] }

  entreesSemaine(sem).forEach(e => {
    const r = getRecette(e.rid);
    // portions choisies pour ce repas vs. portions de base de la recette :
    // sans base connue, impossible de savoir à quoi rapporter le nombre choisi,
    // donc on ne touche pas aux quantités telles qu'écrites.
    const echelle = echelleEntree(e);
    (r.ingredients || []).forEach(ing => {
      const p = parseIngredient(ing.txt);
      const ali = trouverAliment(p.nom) || trouverAliment(ing.txt);
      const cle = ali ? ("a:" + ali.en) : ("t:" + normAli(p.nom));
      if(!cle || cle === "t:") return;
      if(C.retires.indexOf(cle) >= 0) return;

      if(!lignes[cle]){
        lignes[cle] = {
          cle: cle,
          nom: ali ? (ali.fr || ali.en) : p.nom,
          ali: ali,
          rayon: rayonDe((ali ? ali.fr + " " + ali.en + " " : "") + p.nom, ali),
          parts: {},
          sansQte: 0,
          alg: false,
          recettes: [],
          details: []   // occurrences où le libellé de la recette diffère de l'aliment agrégé
        };
      }
      const L = lignes[cle];
      if(L.recettes.indexOf(r.nom) < 0) L.recettes.push(r.nom);
      if(ing.alg) L.alg = true;

      let qteAff = "";
      if(p.qte !== null && p.unite){
        const f = p.unite.fam;
        if(!L.parts[f]) L.parts[f] = {qte:0, aff:p.unite.aff};
        L.parts[f].qte += p.qte * p.unite.vers * echelle;
        qteAff = formatUneQte(p.qte * p.unite.vers * echelle, p.unite.aff, false);
      }else if(p.qte !== null){
        if(!L.parts["piece"]) L.parts["piece"] = {qte:0, aff:""};
        L.parts["piece"].qte += p.qte * echelle;
        qteAff = formatUneQte(p.qte * echelle, "", true);
      }else{
        L.sansQte++;
      }

      // détail seulement si le nom tapé dans la recette (« midi cucumber ») ne
      // correspond pas mot pour mot à l'aliment sous lequel on regroupe (« cucumber » /
      // « concombre ») — sans aliment reconnu, la clé regroupe déjà par nom normalisé
      // identique, donc il n'y a jamais rien de plus précis à montrer.
      const norm = normAli(p.nom);
      const correspond = ali ? (norm === normAli(ali.en) || norm === normAli(ali.fr)) : true;
      if(!correspond && p.nom){
        L.details.push({texte: p.nom, qte: qteAff, recette: r.nom});
      }
    });
  });

  // lignes ajoutées à la main
  C.ajouts.forEach(a => {
    const p = parseIngredient(a.txt);
    const cle = "m:" + a.id;
    lignes[cle] = {cle:cle, nom:a.txt, ali:null, rayon:a.rayon || rayonDe(p.nom, null),
                   parts:{}, sansQte:0, alg:false, recettes:[], details:[], manuel:true};
  });

  // ce que j'ai toujours chez moi part dans une section à part
  const placard = [];
  const parRayon = {};
  Object.keys(lignes).forEach(k => {
    const L = lignes[k];
    if(!L.manuel && db.placard.indexOf(k) >= 0){ placard.push(L); return; }
    (parRayon[L.rayon] = parRayon[L.rayon] || []).push(L);
  });
  // regroupement par rayon, dans l'ordre du magasin
  const res = RAYONS.filter(r => parRayon[r]).map(r => ({
    rayon: r,
    lignes: parRayon[r].sort((a,b) => a.nom.localeCompare(b.nom, "fr"))
  }));
  res.placard = placard.sort((a,b) => a.nom.localeCompare(b.nom, "fr"));
  return res;
}

/* « 1,5 kg » plutôt que « 1500 g » — partagé entre le total agrégé et le détail par recette */
function formatUneQte(qte, aff, piece){
  let q = qte;
  if(aff === "g" && q >= 1000){ q = q / 1000; aff = "kg"; }
  else if(aff === "ml" && q >= 1000){ q = q / 1000; aff = "l"; }
  // un ingrédient compté à la pièce ne s'achète pas en fraction : la mise à
  // l'échelle par portions peut produire « 4.5 œufs », qu'on arrondit au-dessus
  q = piece ? Math.ceil(q - 1e-9) : Math.round(q * 100) / 100;
  return aff ? (q + " " + aff) : String(q);
}

function afficheQte(L){
  const bouts = [];
  Object.keys(L.parts).forEach(f => {
    const p = L.parts[f];
    bouts.push(formatUneQte(p.qte, p.aff, f === "piece"));
  });
  if(!bouts.length && L.sansQte) return L.sansQte > 1 ? "×" + L.sansQte : "";
  if(L.sansQte) bouts.push("+ " + L.sansQte + " sans quantité");
  return bouts.join(" + ");
}

const KEY = "base-recettes-v1";
const APP_VERSION = "3.0";   // affichée dans l'onglet Safari : permet de vérifier qu'on lit bien le fichier à jour

/* =========================================================

let saveEchoue = false;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(db));
    if(saveEchoue){ saveEchoue = false; majAlerteSave(); }
    return true;
  }catch(e){
    // un toast passe trop vite : un bandeau reste tant que rien n'est enregistré
    saveEchoue = true; majAlerteSave();
    toast("⚠️ Pas enregistré : la mémoire du navigateur est pleine");
    return false;
  }
}
function majAlerteSave(){ const b = document.getElementById("alerte-save"); if(b) b.hidden = !saveEchoue; }

/* un identifiant finit dans des attributs HTML : on n'accepte que des caractères sans danger */
function idSur(id){
  const s = String(id == null ? "" : id);
  return /^[\w.:-]{1,80}$/.test(s) ? s : uid();
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    const brutes = (Array.isArray(parsed.recettes) ? parsed.recettes : []).filter(b => b && typeof b === "object");
    const remap = {};   // identifiants refusés par idSur → leur remplaçant, pour ne pas perdre le planning
    db.recettes   = brutes.map(b => { const r = normalize(b); if(b.id != null && String(b.id) !== r.id) remap[b.id] = r.id; return r; });
    db.cuisines   = Array.isArray(parsed.cuisines) && parsed.cuisines.length ? parsed.cuisines : CUISINES_DEF.slice();
    db.tags       = Array.isArray(parsed.tags) && parsed.tags.length ? parsed.tags : TAGS_DEF.slice();
    // les tags déjà utilisés dans les recettes rejoignent la liste
    db.recettes.forEach(r => r.tags.forEach(t => { if(db.tags.indexOf(t) < 0) db.tags.push(t); }));
    db.cycleNotes = Object.assign({ "Folliculaire":"","Ovulatoire":"","Lutéale":"","Menstruelle":"" }, parsed.cycleNotes || {});
    db.phaseActuelle  = CYCLES.indexOf(parsed.phaseActuelle) >= 0 ? parsed.phaseActuelle : "";
    const al = parsed.aliments || {};
    db.aliments = {
      modifs: al.modifs || {},
      perso: Array.isArray(al.perso) ? al.perso : [],
      masques: Array.isArray(al.masques) ? al.masques : []
    };
    const fc = parsed.fc || {};
    db.fc = { actif: !!fc.actif, phases: fc.phases || {}, assoc: fc.assoc || {} };
    // reprise d'une version antérieure où les aliments perso vivaient dans fc
    if(Array.isArray(fc.aliments) && fc.aliments.length && !db.aliments.perso.length){
      db.aliments.perso = fc.aliments.map(a => ({en:a.en, fr:a.fr, cat:a.cat, gi:a.gi, pest:a.pest}));
      fc.aliments.forEach(a => { if(a.phases && a.phases.length) db.fc.assoc[a.en] = a.phases; });
    }
    db.synonymes      = parsed.synonymes || {};
    db.rayons         = parsed.rayons || {};
    db.plan    = Array.isArray(parsed.plan) ? parsed.plan
      .map(e => (e && remap[e.rid]) ? Object.assign({}, e, {rid: remap[e.rid]}) : e).map(normEntree).filter(Boolean) : [];
    db.courses = (parsed.courses && typeof parsed.courses === "object" && !Array.isArray(parsed.courses)) ? parsed.courses : {};
    db.placard = arr(parsed.placard);
    db.placardNoms = (parsed.placardNoms && typeof parsed.placardNoms === "object") ? parsed.placardNoms : {};
    db.prefs   = Object.assign({portions:0, theme:"auto"}, parsed.prefs || {});

    // reprise de la v2 : « cette semaine » était un drapeau posé sur chaque recette,
    // et il n'existait qu'une seule liste de courses. Les deux rejoignent la semaine en cours.
    if(!Array.isArray(parsed.plan)){
      const sem = semaineCourante();
      brutes.forEach((b, i) => {
        if(b && b.semaine) db.plan.push({id: uid(), rid: db.recettes[i].id, sem: sem, jour: -1,
          portions: num(b.semainePortions) || db.recettes[i].portions || 4, fait: false});
      });
      if(parsed.coursesCoches || parsed.coursesAjouts || parsed.coursesRetires){
        db.courses[sem] = {
          coches: parsed.coursesCoches || {},
          ajouts: Array.isArray(parsed.coursesAjouts) ? parsed.coursesAjouts : [],
          retires: Array.isArray(parsed.coursesRetires) ? parsed.coursesRetires : []
        };
        // les articles ajoutés à la main étaient repérés par leur position : on leur donne un id
        const C = coursesDe(sem), coches = {};
        Object.keys(C.coches).forEach(k => {
          const m = /^m:(\d+)$/.exec(k);
          if(!m) coches[k] = C.coches[k];
          else if(C.ajouts[+m[1]]) coches["m:" + C.ajouts[+m[1]].id] = C.coches[k];
        });
        C.coches = coches;
      }
      elaguer();
      save();
    }else{
      elaguer();
      if(Object.keys(remap).length) save();
    }
  }catch(e){ console.warn("Lecture impossible", e); }
}

/* un repas planifié, tel que relu d'une sauvegarde : rien ne doit pouvoir le casser */
function normEntree(e){
  if(!e || !e.rid || !/^\d{4}-\d{2}-\d{2}$/.test(String(e.sem || ""))) return null;
  const j = parseInt(e.jour, 10);
  return {id: idSur(e.id), rid: String(e.rid), sem: lundiDe(dateDe(e.sem)),
          jour: (j >= 0 && j <= 6) ? j : -1, portions: num(e.portions), fait: !!e.fait};
}

/* le planning garde six mois d'historique, les listes de courses deux */
function elaguer(){
  const cur = semaineCourante();
  const limPlan = ajouterJours(cur, -7 * 26), limCourses = ajouterJours(cur, -7 * 8);
  db.plan = db.plan.filter(e => e.sem >= limPlan && getRecette(e.rid));
  Object.keys(db.courses).forEach(s => { if(s < limCourses) delete db.courses[s]; });
}

/* seuls http(s) sont acceptés : une recette importée ou partagée ne doit
   jamais pouvoir stocker un lien "javascript:" exécuté au clic */
function urlSure(u){ return /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : ""; }

function normalize(r){
  return {
    id: idSur(r.id),
    nom: r.nom || "Sans titre",
    url: urlSure(r.url),
    description: r.description || "",
    image: r.image || "",
    statut: STATUTS.includes(r.statut) ? r.statut : "🟡 Brouillon",
    cuisines: arr(r.cuisines),
    meal: r.meal || "",
    tags: arr(r.tags),
    seasons: arr(r.seasons),
    cycles: arr(r.cycles),
    diff: r.diff || "",
    note: num(r.note),
    prep: num(r.prep),
    cuisson: num(r.cuisson),
    portions: num(r.portions),
    kcal: num(r.kcal), prot: num(r.prot), gluc: num(r.gluc), lip: num(r.lip),
    ingredients: Array.isArray(r.ingredients)
      ? r.ingredients.map(i => typeof i === "string" ? {txt:i, alg:false} : {txt:(i.txt||""), alg:!!i.alg}).filter(i=>i.txt.trim())
      : [],
    etapes: arr(r.etapes),
    allergenes: r.allergenes || "",
    ingredientCle: r.ingredientCle || "",
    groupe: r.groupe || "",
    notesPerso: r.notesPerso || "",     // mes ajustements, à relire la prochaine fois
    cuisinee: num(r.cuisinee),          // nombre de fois où je l'ai faite
    derniereFois: num(r.derniereFois),  // horodatage de la dernière fois
    cree: r.cree || Date.now(),
    maj: r.maj || Date.now()
  };
}

/* =========================================================
   3. UTILITAIRES
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const arr = v => Array.isArray(v) ? v.filter(x => x !== null && x !== undefined && String(x).trim() !== "").map(String) : (v ? [String(v)] : []);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const uid = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function total(r){ return num(r.prep) + num(r.cuisson); }
function fmtMin(m){
  m = num(m); if(!m) return "—";
  if(m < 60) return m + " min";
  const h = Math.floor(m/60), r = m%60;
  return r ? h + " h " + r : h + " h";
}
function stars(n){ n = Math.round(num(n)); return n ? "★".repeat(n) + "☆".repeat(5-n) : ""; }
function getRecette(id){ return db.recettes.find(r => r.id === id); }

let toastT, toastAnnuler = null;
/* annuler : fonction facultative, proposée quelques secondes sous forme de bouton */
function toast(msg, annuler){
  const t = $("#toast");
  t.innerHTML = esc(msg) + (annuler ? '<button type="button" class="toast-act" id="toast-undo">Annuler</button>' : "");
  t.classList.toggle("act", !!annuler);
  t.classList.add("show");
  toastAnnuler = annuler || null;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove("show"); toastAnnuler = null; }, annuler ? 5000 : 2300);
}

/* ---------- navigation ----------
   Les onglets du bas remettent la pile à zéro ; les écrans ouverts depuis eux
   (fiche, formulaire, mode cuisine…) s'empilent, et le geste retour du
   navigateur les dépile comme le bouton ‹, en retrouvant le défilement. */
const ONGLETS = ["accueil", "galerie", "planning", "courses", "cycle"];
let pile = [];
let historique = true;   // pushState disponible ? sinon le retour se fait à la main

function instantane(){ return {view: state.view, ficheId: state.ficheId, cycle: state.cycle, y: window.scrollY}; }

function afficher(view, opts){
  Object.assign(state, {view}, opts || {});
  if(ONGLETS.indexOf(view) >= 0) state.onglet = view;
  fermerFeuille();
  render();
  const app = $("#app");
  app.classList.remove("vin"); void app.offsetWidth; app.classList.add("vin");
}

function go(view, opts){
  if(ONGLETS.indexOf(view) >= 0){ onglet(view, opts); return; }
  pile.push(instantane());
  if(pile.length > 40) pile.shift();
  try{ history.pushState({n: pile.length}, ""); }catch(e){ historique = false; }
  afficher(view, opts);
  window.scrollTo(0, 0);
}
/* remplace l'écran courant sans l'empiler (ex. formulaire enregistré → fiche) */
function remplacer(view, opts){ afficher(view, opts); window.scrollTo(0, 0); }
function onglet(view, opts){
  pile = [];
  try{ history.replaceState({n: 0}, ""); }catch(e){}
  afficher(view, opts);
  window.scrollTo(0, 0);
}
function retour(){
  if(!pile.length){ onglet(state.onglet || "accueil"); return; }
  if(historique) history.back();
  else depiler(pile.length - 1);
}
function depiler(n){
  let snap = null;
  while(pile.length > n) snap = pile.pop();
  if(!snap) return;
  afficher(snap.view, {ficheId: snap.ficheId, cycle: snap.cycle});
  const y = snap.y || 0;
  window.scrollTo(0, y);
  requestAnimationFrame(() => window.scrollTo(0, y));
}
function brouillonModifie(){
  if(state.view !== "form" || !state.formDraft) return false;
  syncDraft();
  return !!(state.formDraft.nom || state.formDraft.id);

/* lecture + compression d'une image */
function readImage(file, cb){
  const fr = new FileReader();
  fr.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 700;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => toast("Image illisible");
    img.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

/* =========================================================
   4. FILTRAGE, TRI, SUGGESTIONS
   ========================================================= */
function filtresVides(){
  return { cycle:[], meal:[], cuisine:[], tags:[], season:[], diff:[], statut:[], noteMin:0, tempsMax:0,
           semaine:false, maPhase:false, fav:false, aTester:false };
}
function matchAny(sel, vals){ return !sel.length || sel.some(s => vals.indexOf(s) >= 0); }

/* minuscules sans accents : « creme » trouve « crème » */
function normRech(s){
  let t = String(s == null ? "" : s).toLowerCase();
  try{ t = t.normalize("NFD").replace(/[̀-ͯ]/g, ""); }catch(e){}
  return t.replace(/œ/g, "oe");
}

function filtrer(list){
  const f = state.filters;
  const mots = state.frigo ? [] : normRech(state.q).split(/\s+/).filter(Boolean);
  const cur = semaineCourante();
  const res = list.filter(r => {
    if(mots.length){
      const hay = normRech(r.nom + " " + r.cuisines.join(" ") + " " + r.tags.join(" ") + " " + r.meal + " " +
        r.ingredients.map(i=>i.txt).join(" ") + " " + r.ingredientCle + " " + r.description);
      if(mots.some(m => hay.indexOf(m) < 0)) return false;
    }
    if(!matchAny(f.cycle, r.cycles)) return false;
    if(!matchAny(f.meal, r.meal ? [r.meal] : [])) return false;
    if(!matchAny(f.cuisine, r.cuisines)) return false;
    if(!matchAny(f.tags, r.tags)) return false;
    if(!matchAny(f.season, r.seasons)) return false;
    if(!matchAny(f.diff, r.diff ? [r.diff] : [])) return false;
    if(!matchAny(f.statut, [r.statut])) return false;
    if(f.noteMin && num(r.note) < f.noteMin) return false;
    if(f.tempsMax && (total(r) === 0 || total(r) > f.tempsMax)) return false;
    if(f.semaine && !estPlanifiee(r, cur)) return false;
    if(f.fav && !estFavori(r)) return false;
    if(f.aTester && r.note) return false;
    if(f.maPhase && !pertinencePhase(r)) return false;
    return true;
  });
  if(f.maPhase && db.phaseActuelle){
    const cmp = comparateur(state.tri);
    return res.sort((a,b) => (pertinencePhase(b) - pertinencePhase(a)) || cmp(a,b));
  }
  return trier(res, state.tri);
}

function comparateur(tri){
  const nom = (a,b) => a.nom.localeCompare(b.nom, "fr");
  return ({
    meilleures: (a,b) => (b.note - a.note) || (estFavori(b) - estFavori(a)) || (b.cuisinee - a.cuisinee) || nom(a,b),
    rapides:    (a,b) => ((total(a) || 1e6) - (total(b) || 1e6)) || nom(a,b),
    recentes:   (a,b) => b.cree - a.cree,
    cuisinees:  (a,b) => (b.cuisinee - a.cuisinee) || (b.derniereFois - a.derniereFois) || nom(a,b),
    proteines:  (a,b) => (b.prot - a.prot) || nom(a,b)
  })[tri] || nom;
}
function trier(list, tri){ return list.sort(comparateur(tri)); }

function nbFiltresActifs(){
  const f = state.filters;
  return f.cycle.length + f.meal.length + f.cuisine.length + f.tags.length +
    f.season.length + f.diff.length + f.statut.length +
    (f.noteMin ? 1 : 0) + (f.tempsMax ? 1 : 0) + (f.semaine ? 1 : 0) + (f.maPhase ? 1 : 0) +
    (f.fav ? 1 : 0) + (f.aTester ? 1 : 0);
}
function resetFiltres(){
  state.filters = filtresVides();
  state.q = "";
  state.frigo = false;
}

/* ---------- « avec ce que j'ai » ----------
   chaque terme tapé est cherché dans les ingrédients, mot pour mot ou via
   l'aliment reconnu : « courgettes » trouve « 2 zucchini » */
let memoAli = new Map(), memoIdx = null;
function aliDeLigne(txt){
  const idx = indexAliments();
  if(memoIdx !== idx){ memoAli = new Map(); memoIdx = idx; }
  if(memoAli.has(txt)) return memoAli.get(txt);
  // on cherche d'abord sur le nom seul : « 1 c. à café d'ail » ne doit pas devenir du café
  const a = trouverAliment(parseIngredient(txt).nom) || trouverAliment(txt);
  memoAli.set(txt, a);
  return a;
}
function termesFrigo(q){
  return String(q || "").split(/[,;+\n]|\s+et\s+|\s+and\s+/i).map(s => s.trim()).filter(s => s.length > 1);
}
function scoreFrigo(r, termes){
  const lignes = r.ingredients.map(i => ({n: " " + normAli(i.txt) + " ", ali: aliDeLigne(i.txt)}));
  const utilisees = {};
  let n = 0;
  termes.forEach(t => {
    const nt = normAli(t), at = trouverAliment(t);
    const k = lignes.findIndex(L => (nt && L.n.indexOf(" " + nt + " ") >= 0) || (at && L.ali === at));
    if(k >= 0){ n++; utilisees[k] = 1; }
  });
  return {n: n, total: termes.length, autres: r.ingredients.length - Object.keys(utilisees).length};
}

/* ---------- favoris, saisons, historique ---------- */
function estFavori(r){ return r.cuisines.some(c => normLibelle(c) === "favorite"); }
function basculerFavori(r){
  if(estFavori(r)){
    r.cuisines = r.cuisines.filter(c => normLibelle(c) !== "favorite");
  }else{
    const lib = db.cuisines.find(c => normLibelle(c) === "favorite") || FAVORI;
    if(db.cuisines.indexOf(lib) < 0) db.cuisines.unshift(lib);
    r.cuisines.push(lib);
  }
  r.maj = Date.now(); save();
  return estFavori(r);
}
function saisonActuelle(){ return SAISON_PAR_MOIS[new Date().getMonth()]; }
function deSaison(r){ return r.seasons.indexOf(saisonActuelle()) >= 0; }

function ilYa(ts){
  const j = Math.round((dateDe(aujourdhui()) - dateDe(isoJour(new Date(ts)))) / J_MS);
  return j <= 0 ? "aujourd'hui" : j === 1 ? "hier" : j < 30 ? "il y a " + j + " jours" :
         j < 365 ? "il y a " + Math.round(j / 30) + " mois" : "il y a plus d'un an";
}
function libCuisinee(r){
  if(!r.cuisinee) return "Pas encore cuisinée";
  return "Cuisinée " + r.cuisinee + " fois" + (r.derniereFois ? " · " + ilYa(r.derniereFois) : "");
}

/* ---------- suggestions ----------
   Une recette bien notée, favorite, de saison ou adaptée à ma phase a plus
   de chances d'être tirée ; celle cuisinée il y a moins de dix jours, moins. */
let memoPhase = new Map(), memoPhaseIdx = null;
function scorePhaseVite(r, phase){
  phase = phase || db.phaseActuelle;
  const idx = indexAliments();
  if(memoPhaseIdx !== idx){ memoPhase = new Map(); memoPhaseIdx = idx; }
  const k = r.id + "|" + r.maj + "|" + phase;
  if(!memoPhase.has(k)) memoPhase.set(k, scorePhase(r, phase));
  return memoPhase.get(k);
}
/* une recette est « de ma phase » si je l'y ai rattachée (champ Cycle) ou si ses
   ingrédients appartiennent à la phase ; le rattachement explicite compte davantage */
function pertinencePhase(r, phase){
  phase = phase || db.phaseActuelle;
  if(!db.fc.actif || !phase) return 0;
  return (r.cycles.indexOf(phase) >= 0 ? 5 : 0) + scorePhaseVite(r, phase);
}
function scoreReco(r){
  let s = (r.note || 3) * 2;               // non notée : on lui laisse sa chance
  if(estFavori(r)) s += 3;
  s += Math.min(r.cuisinee || 0, 5) * 0.5;
  if(deSaison(r)) s += 1.5;
  s += Math.min(pertinencePhase(r), 6) * 0.5;
  if(r.statut === STATUTS[0]) s -= 1;
  if(r.derniereFois && Date.now() - r.derniereFois < 10 * J_MS) s -= 4;
  return Math.max(0.5, s);
}
/* un repas, pas un dessert : les plats principaux d'abord, puis les plats « pour recevoir »,
   puis les accompagnements. Petit-déjeuner, desserts, encas et boissons ne sont jamais proposés. */
const PALIERS_REPAS = [["Main course", ""], ["Entertaining"], ["Side dish"]];
function poolSuggestions(exclure){
  const vivantes = db.recettes.filter(r => r.statut !== ARCHIVE && exclure.indexOf(r.id) < 0);
  for(const palier of PALIERS_REPAS){
    const pool = vivantes.filter(r => palier.indexOf(r.meal) >= 0 || (palier[0] === "Main course" && MEALS.indexOf(r.meal) < 0));
    if(pool.length) return pool;
  }
  return [];
}
function tirer(pool){
  if(!pool.length) return null;
  let tot = 0;
  const w = pool.map(r => { const s = scoreReco(r); tot += s; return s; });
  let x = Math.random() * tot;
  for(let i = 0; i < pool.length; i++){ x -= w[i]; if(x <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

/* =========================================================

const pad2 = n => (n < 10 ? "0" : "") + n;
function isoJour(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
/* midi plutôt que minuit : un changement d'heure ne fait jamais glisser la date */
function dateDe(iso){ const p = String(iso).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
function ajouterJours(iso, n){ const d = dateDe(iso); d.setDate(d.getDate() + n); return isoJour(d); }
function lundiDe(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  x.setDate(x.getDate() - (x.getDay() + 6) % 7);
  return isoJour(x);
}
function aujourdhui(){ return isoJour(new Date()); }
function semaineCourante(){ return lundiDe(new Date()); }
function indexJour(){ return (new Date().getDay() + 6) % 7; }
function dateCourte(iso){ const d = dateDe(iso); return d.getDate() + " " + MOIS_COURTS[d.getMonth()]; }
function libSemaine(sem){
  const a = dateDe(sem), fin = ajouterJours(sem, 6), b = dateDe(fin);
  return a.getMonth() === b.getMonth() ? a.getDate() + " – " + dateCourte(fin) : dateCourte(sem) + " – " + dateCourte(fin);
}
function libRelatif(sem){
  const c = semaineCourante();
  return sem === c ? "Cette semaine" : sem === ajouterJours(c, 7) ? "Semaine prochaine" :
         sem === ajouterJours(c, -7) ? "Semaine dernière" : (sem > c ? "Semaine à venir" : "Semaine passée");
}
function libJour(sem, j){ return j < 0 ? "Sans jour précis" : JOURS[j] + " " + dateDe(ajouterJours(sem, j)).getDate(); }

function entreesSemaine(sem){ return db.plan.filter(e => e.sem === sem && getRecette(e.rid)); }
function estPlanifiee(r, sem){ sem = sem || semaineCourante(); return db.plan.some(e => e.rid === r.id && e.sem === sem); }
function portionsParDefaut(r){ return db.prefs.portions || r.portions || 4; }
function planifier(rid, sem, jour, portions){
  const r = getRecette(rid);
  if(!r) return null;
  const e = {id: uid(), rid: rid, sem: sem, jour: jour, portions: portions || portionsParDefaut(r), fait: false};
  db.plan.push(e);

}
function echelleEntree(e){

  return (r && r.portions && e.portions) ? e.portions / r.portions : 1;
}
function coursesDe(sem){
  if(!db.courses[sem]) db.courses[sem] = {coches:{}, ajouts:[], retires:[]};
  const C = db.courses[sem];
  if(!C.coches || typeof C.coches !== "object") C.coches = {};
  if(!Array.isArray(C.ajouts)) C.ajouts = [];
  if(!Array.isArray(C.retires)) C.retires = [];
  C.ajouts.forEach(a => { if(!a.id) a.id = uid(); });

}
/* le week-end, quand il ne reste rien à cuisiner cette semaine, la liste utile est celle de la suivante */
function semaineCoursesParDefaut(){
  const c = semaineCourante(), s = ajouterJours(c, 7);
  const reste = entreesSemaine(c).filter(e => !e.fait && (e.jour < 0 || e.jour >= indexJour())).length;
  return (!reste && entreesSemaine(s).length) ? s : c;
}
function articlesRestants(sem){

/* =========================================================
   4f. PORTIONS : mise à l'échelle des quantités
   ========================================================= */
const FRAC_CAR = {"½":0.5, "¼":0.25, "¾":0.75, "⅓":1/3, "⅔":2/3, "⅛":0.125};
const NB_QTE = "(?:\\d+(?:[.,]\\d+)?\\s*[½¼¾⅓⅔⅛]|\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔⅛])";
const RE_QTE_TETE = new RegExp("^(\\s*(?:[-•*·]\\s*)?)(" + NB_QTE + ")(?:(\\s*(?:-|–|à|to|ou|or)\\s*)(" + NB_QTE + "))?");

function lireQte(s){
  const m = String(s).trim().match(/^(\d+(?:[.,]\d+)?)\s*([½¼¾⅓⅔⅛])$/);
  if(m) return num(m[1].replace(",", ".")) + FRAC_CAR[m[2]];
  return lireNombre(s);
}

/* 1.5 → « 1½ », 0.333 → « ⅓ », 12.4 → « 12 », 337 → « 335 » : ce qu'on lirait dans un livre */
function joliNombre(q, virgule){
  if(q >= 100) return String(Math.round(q / 5) * 5);
  if(q >= 10) return String(Math.round(q));
  const ent = Math.floor(q), reste = q - ent;
  const fr = [[0,""],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[1,""]];
  let best = fr[0], d = 9;
  fr.forEach(x => { const e = Math.abs(reste - x[0]); if(e < d){ d = e; best = x; } });
  if(d <= 0.04){
    const e = best[0] === 1 ? ent + 1 : ent;
    return best[1] ? (e ? e : "") + best[1] : String(e);
  }
  const t = String(Math.round(q * 10) / 10);
  return virgule ? t.replace(".", ",") : t;
}

/* « 200 g de farine » × 1,5 → « 300 g de farine » ; seule la quantité de tête change */
function ajusterLigne(txt, f){
  const non = {txt: txt, ok: false};
  if(!f || Math.abs(f - 1) < 1e-6) return non;
  const m = String(txt).match(RE_QTE_TETE);
  if(!m) return non;
  const a = lireQte(m[2]);
  if(a === null || isNaN(a)) return non;
  const virgule = /,/.test(m[2] + (m[4] || ""));
  let q = joliNombre(a * f, virgule);
  if(m[4] !== undefined){
    const b = lireQte(m[4]);
    q += m[3] + ((b === null || isNaN(b)) ? m[4] : joliNombre(b * f, virgule));
  }
  const apres = txt.slice(m[0].length);
  return {txt: m[1] + q + apres, ok: true, avant: m[1], qte: q, apres: apres};
}
function ligneIngHTML(txt, f){
  const a = ajusterLigne(txt, f);
  return a.ok ? esc(a.avant) + '<b class="qa">' + esc(a.qte) + '</b>' + esc(a.apres) : esc(txt);
}
